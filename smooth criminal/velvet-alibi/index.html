<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velvet Alibi</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #08070c; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="paint" role="img" aria-label="A thirty-second moving oil painting with music: a smoky nineteen-thirties speakeasy with blue windows and orange lamps, where a man in a cream suit and white fedora strides into a spotlight, is joined by a line of dancers in dark suits, and finishes with an impossible forward lean."></canvas>
<script>
// ---- 00-core.js
"use strict";
// ============================================================
// Timing: 14 bars of 4/4 at 112 BPM = 30.0 s.
// Piece time t runs 0..60 and loops. On the very first play it starts
// at -INTRO, while the title lifts off and the nocturne paints itself in.
// ============================================================
const TAU = Math.PI * 2;
const BPM = 112;
const BEAT = 60 / BPM;
const BAR = 4 * BEAT;
const NBARS = 14;
const NBEATS = NBARS * 4;
const DUR = NBARS * BAR;
const INTRO = 0;
// stroke paint-in / lift-off sentinels: 'always painted' and 'never lifted'
const NO_IN = -1e4, NO_OUT = 1e4;
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const seg = (x, a, b) => clamp((x - a) / (b - a), 0, 1);
const hash = n => { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const modT = t => ((t % DUR) + DUR) % DUR;

// easing
function easeInOutBack(t, s) {
  const c = (s === undefined ? 1.2 : s) * 1.525;
  t *= 2;
  if (t < 1) return (t * t * ((c + 1) * t - c)) / 2;
  t -= 2;
  return (t * t * ((c + 1) * t + c) + 2) / 2;
}
function easeOutBack(t, s) {
  const c = s === undefined ? 1.70158 : s;
  t -= 1;
  return t * t * ((c + 1) * t + c) + 1;
}
const easeInOut = t => t * t * (3 - 2 * t);
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const easeInOutCubic = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const bump = (x, c, w) => Math.exp(-((x - c) * (x - c)) / (2 * w * w));

// ---------- 3D vectors (y up, x = screen right, z = toward camera)
const V = (x, y, z) => ({ x, y, z });
const vadd = (a, b) => V(a.x + b.x, a.y + b.y, a.z + b.z);
const vsub = (a, b) => V(a.x - b.x, a.y - b.y, a.z - b.z);
const vmul = (a, s) => V(a.x * s, a.y * s, a.z * s);
const vmad = (a, b, s) => V(a.x + b.x * s, a.y + b.y * s, a.z + b.z * s);
const vdot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const vcross = (a, b) => V(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
const vlen = a => Math.hypot(a.x, a.y, a.z);
const vnorm = a => { const l = vlen(a) || 1; return V(a.x / l, a.y / l, a.z / l); };
const vlerp = (a, b, t) => V(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, a.z + (b.z - a.z) * t);

// ---------- 3x3 rotations, row-major. R = Ry(yaw) * Rx(pitch) * Rz(roll)
// yaw>0 turns the front (+z) toward +x, pitch>0 leans the top toward the camera (nod),
// roll>0 tilts the top toward screen-left.
function rotYXZ(yaw, pitch, roll) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cx = Math.cos(pitch), sx = Math.sin(pitch),
        cz = Math.cos(roll), sz = Math.sin(roll);
  return [
    cy * cz + sy * sx * sz, -cy * sz + sy * sx * cz, sy * cx,
    cx * sz, cx * cz, -sx,
    -sy * cz + cy * sx * sz, sy * sz + cy * sx * cz, cy * cx
  ];
}
const mv = (m, v) => V(m[0] * v.x + m[1] * v.y + m[2] * v.z, m[3] * v.x + m[4] * v.y + m[5] * v.z, m[6] * v.x + m[7] * v.y + m[8] * v.z);
const mvT = (m, v) => V(m[0] * v.x + m[3] * v.y + m[6] * v.z, m[1] * v.x + m[4] * v.y + m[7] * v.z, m[2] * v.x + m[5] * v.y + m[8] * v.z);
function mm(a, b) {
  const r = new Array(9);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
    r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j];
  return r;
}
// origin + R * (x,y,z)
const xf = (o, R, x, y, z) => V(o.x + R[0] * x + R[1] * y + R[2] * z, o.y + R[3] * x + R[4] * y + R[5] * z, o.z + R[6] * x + R[7] * y + R[8] * z);

// color helpers
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const scalec = (a, k) => [a[0] * k, a[1] * k, a[2] * k];

// ---- 10-gl.js
// ============================================================
// WebGL2: stroke renderer (MRT colour + paint height) and composite
// ============================================================
const cv = document.getElementById('paint');
const gl = cv.getContext('webgl2', {
  antialias: false, alpha: false, depth: false, stencil: false,
  premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance'
});
if (!gl) {
  document.body.innerHTML = '<p style="color:#cbb;font:16px/1.5 Georgia,serif;padding:2em">This painting needs WebGL2 to move.</p>';
  throw new Error('WebGL2 unavailable');
}
const HAS_CBF = !!gl.getExtension('EXT_color_buffer_float');
cv.addEventListener('webglcontextlost', e => e.preventDefault());
cv.addEventListener('webglcontextrestored', () => location.reload());

const STROKE_VS = `#version 300 es
layout(location=0) in vec3 a_pos;
layout(location=1) in vec2 a_uv;
layout(location=2) in vec4 a_p;
layout(location=3) in vec3 a_rev;
layout(location=4) in vec4 a_col;
layout(location=5) in vec4 a_col2;
layout(location=6) in vec4 a_ex;
uniform vec2 u_res;
uniform mat4 u_vp;
uniform float u_world;
uniform float u_boil;
uniform float u_jit;
out vec2 v_uv; flat out vec4 v_p; flat out vec3 v_rev; out vec4 v_col; flat out vec4 v_col2; flat out vec4 v_ex;
float h11(float n){ return fract(sin(n * 12.9898) * 43758.5453); }
void main(){
  if (u_world > 0.5) {
    vec3 wp = a_pos;
    float s = a_p.z;
    wp.xy += (vec2(h11(s * 7.31 + u_boil * 3.17), h11(s * 3.77 + u_boil * 5.3)) - 0.5) * u_jit;
    gl_Position = u_vp * vec4(wp, 1.0);
  } else {
    vec2 c = a_pos.xy / u_res * 2.0 - 1.0;
    gl_Position = vec4(c.x, -c.y, 0.0, 1.0);
  }
  v_uv = a_uv; v_p = vec4(a_p.x, a_p.y, a_p.z + u_boil * 0.3719, a_p.w); v_rev = a_rev; v_col = a_col; v_col2 = a_col2; v_ex = a_ex;
}`;

// Each stroke carries two delays (s): when its paint goes on and when it lifts off.
// u_tIn / u_tOut are the clocks those delays are measured against, so every painted
// world can be brought in and scraped away on its own schedule.
const STROKE_FS = `#version 300 es
precision highp float;
in vec2 v_uv; flat in vec4 v_p; flat in vec3 v_rev; in vec4 v_col; flat in vec4 v_col2; flat in vec4 v_ex;
uniform float u_mask;
uniform float u_tIn, u_tOut;
layout(location=0) out vec4 o_col;
layout(location=1) out vec4 o_hgt;
float h11(float n){ return fract(sin(n * 12.9898) * 43758.5453); }
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1,0)), u.x), mix(h21(i + vec2(0,1)), h21(i + vec2(1,1)), u.x), u.y); }
float ease(float x){ x = clamp(x, 0.0, 1.0); return x * x * (3.0 - 2.0 * x); }
void main(){
  float k = v_rev.z;                  // stroke units -> css px
  float W = max(v_p.y * k, 0.5);      // stroke width, css px
  float u = v_uv.x * k;               // distance along stroke, css px
  float Lc = v_p.x * k;
  float v = v_uv.y;                   // across, -1.15..1.15
  float av = abs(v);
  float seed = mod(v_p.z, 97.0), th = v_p.w;
  float kind = floor(v_ex.z * 255.0 + 0.5);
  float dry = v_col2.a;
  float aa = max(fwidth(v), 0.002) * 1.1;
  float t = clamp(u / max(Lc, 1.0), 0.0, 1.0);
  float bIn = v_rev.x < -5000.0 ? 1.0 : ease((u_tIn - v_rev.x) / 0.3);
  float aOut = v_rev.y > 5000.0 ? 0.0 : ease((u_tOut - v_rev.y) / 0.30);
  float uA = aOut * Lc, uB = bIn * Lc;
  if (u < uA || u > uB || uB <= uA) discard;
  float cov, br, streak, bid;
  if (kind < 0.5) {
    float nb = clamp(W * 0.3, 4.0, 60.0);
    float bx = (v * 0.5 + 0.5) * nb;
    bid = floor(bx);
    float bs = smoothstep(0.0, 1.0, fract(bx));
    float b1 = mix(h11(bid * 1.713 + seed * 17.17), h11((bid + 1.0) * 1.713 + seed * 17.17), bs);
    float b2 = vn(vec2(bx * 0.3, seed * 3.1));
    streak = vn(vec2(u / (W * 1.4 + 8.0) + seed * 5.3, bx * 0.55 + seed));
    br = clamp(b1 * 0.32 + b2 * 0.33 + streak * 0.5 - 0.07, 0.0, 1.0);
    float side = step(0.0, v);
    float en = vn(vec2(u / (W * 1.1 + 6.0), seed * 9.1 + side * 7.0));
    float edge = 1.0 - 0.13 * en - 0.05 * dry;
    float ez = smoothstep(0.55, 0.97, av);
    float bl = h21(vec2(bid + seed * 13.0, floor(u / (W * 0.7 + 4.0))));
    edge -= ez * step(bl, 0.28 + 0.3 * dry) * 0.3;
    cov = 1.0 - smoothstep(edge - aa, edge + aa, av);
    float thr = dry * (0.1 + 0.95 * smoothstep(0.35, 1.0, t)) - 0.05;
    cov *= smoothstep(thr - 0.06, thr + 0.06, br);
  } else {
    bid = 0.0;
    streak = vn(vec2(u / (W + 10.0), seed));
    br = 0.45 + 0.3 * streak;
    cov = 1.0 - smoothstep(0.15, 1.05, av);
    cov *= cov;
  }
  float sq = 1.0 - v_ex.w;
  float capS = max(W * 0.5 * sq, 1.0);
  float ds = clamp((u - uA) / capS, 0.0, 1.0);
  float allowS = sqrt(ds * (2.0 - ds));
  cov *= 1.0 - smoothstep(allowS - aa, allowS + aa, av);
  float capE = max(W * 0.35 * sq, 1.0);
  float de = clamp((uB - u) / capE, 0.0, 1.0);
  float allowE = sqrt(de * (2.0 - de));
  cov *= 1.0 - smoothstep(allowE - aa, allowE + aa, av);
  float a = v_col.a * cov;
  if (a < 0.004) discard;
  vec3 c;
  if (u_mask > 0.5) {
    c = v_col.rgb;
  } else {
    float load = mix(h11(bid * 3.31 + seed * 7.7), h11((bid + 1.0) * 3.31 + seed * 7.7), smoothstep(0.2, 0.8, fract((v * 0.5 + 0.5) * clamp(W * 0.3, 4.0, 60.0))));
    float m2 = smoothstep(0.4, 0.72, load * 0.6 + streak * 0.5);
    c = mix(v_col.rgb, v_col2.rgb, m2);
    c *= 0.8 + 0.4 * br;
    c *= 1.0 + 0.06 * (1.0 - smoothstep(0.0, 0.15, t));
  }
  o_col = vec4(c * a, a);
  float hg = th * (0.22 + 0.78 * br) * (1.0 - 0.45 * dry * smoothstep(0.4, 1.0, t)) + th * 0.45 * smoothstep(0.62, 0.98, av);
  o_hgt = vec4(hg * a, v_ex.x * a, v_ex.y * a, a);
}`;

const COMP_VS = `#version 300 es
void main(){
  vec2 p = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0);
  gl_Position = vec4(p, 0.0, 1.0);
}`;

// Pop-art palettes, 10 inks each: 0 ground, 1 coat, 2 coat lining, 3 black clothes, 4 skin,
// 5 hair, 6 mic/shoes, 7 key-line ink, 8 lips, 9 whites.
const POP_PALETTES = [
  [[0.97, 0.35, 0.6], [1.0, 0.87, 0.18], [0.98, 0.52, 0.12], [0.13, 0.2, 0.62], [1.0, 0.74, 0.7], [1.0, 0.45, 0.1], [0.85, 0.88, 0.95], [0.07, 0.05, 0.12], [0.9, 0.1, 0.2], [1.0, 1.0, 0.96]],
  [[0.2, 0.8, 0.8], [1.0, 0.38, 0.62], [0.7, 0.12, 0.45], [0.1, 0.1, 0.3], [1.0, 0.9, 0.35], [1.0, 0.72, 0.08], [0.95, 0.95, 1.0], [0.08, 0.05, 0.1], [0.95, 0.15, 0.35], [1.0, 1.0, 0.96]],
  [[1.0, 0.55, 0.1], [0.3, 0.85, 0.85], [0.05, 0.5, 0.55], [0.35, 0.12, 0.55], [1.0, 0.62, 0.72], [1.0, 0.92, 0.2], [0.9, 0.92, 0.98], [0.08, 0.04, 0.12], [0.85, 0.05, 0.25], [1.0, 1.0, 0.96]],
  [[1.0, 0.9, 0.22], [0.92, 0.16, 0.18], [0.55, 0.05, 0.12], [0.06, 0.07, 0.15], [1.0, 0.86, 0.76], [1.0, 0.5, 0.1], [0.8, 0.85, 0.95], [0.06, 0.04, 0.08], [0.9, 0.1, 0.15], [1.0, 1.0, 0.96]],
  [[0.62, 0.9, 0.3], [0.58, 0.32, 0.85], [0.3, 0.12, 0.55], [0.05, 0.3, 0.2], [1.0, 0.68, 0.42], [0.95, 0.2, 0.6], [0.92, 0.92, 0.98], [0.06, 0.05, 0.12], [0.95, 0.1, 0.3], [1.0, 1.0, 0.96]],
  [[0.2, 0.36, 0.92], [1.0, 0.6, 0.18], [0.85, 0.2, 0.1], [0.05, 0.05, 0.08], [1.0, 0.72, 0.8], [1.0, 0.9, 0.25], [0.95, 0.95, 1.0], [0.05, 0.04, 0.1], [0.95, 0.12, 0.25], [1.0, 1.0, 0.96]]
];
const glslVec3 = c => `vec3(${c.map(x => x.toFixed(3)).join(',')})`;
const PAL_GLSL = `const vec3 PAL[60] = vec3[60](${POP_PALETTES.map(p => p.map(glslVec3).join(',')).join(',\n')});`;

const COMP_FS = `#version 300 es
precision highp float;
uniform sampler2D u_bgC, u_bgH, u_fgC, u_fgH, u_sh, u_galC, u_galH;
uniform vec2 u_res;
uniform float u_dpr;
uniform vec3 u_amb, u_wCol, u_cCol, u_ground;
uniform vec4 u_wPool, u_wPool2, u_cPool, u_cPool2;
uniform float u_grain, u_relief, u_floorY, u_time, u_refl, u_waterY;
uniform float u_pop, u_grid, u_popSeed;
uniform float u_gal;
uniform vec4 u_frame;
uniform vec3 u_galAmb, u_galWarm;
uniform vec4 u_galPool;
uniform vec4 u_flash;
uniform float u_fade, u_vig;
out vec4 o;
${PAL_GLSL}
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float pool(vec2 p, vec4 P){
  vec2 d = (p - P.xy) / max(P.zw, vec2(1.0));
  float r = length(d);
  return (1.0 - smoothstep(0.2, 1.0, r)) + 0.35 * (1.0 - smoothstep(0.0, 0.45, r));
}
float waterLine(float x){
  return u_waterY + (sin(x * 0.09 / u_dpr + u_time * 4.0) * 1.3 + sin(x * 0.021 / u_dpr - u_time * 2.1) * 2.0) * u_dpr;
}
// Where to read the dancer layer for this pixel: the pop-art prints are all copies of the
// top-left panel, alternate ones mirrored.
vec2 fgPos(vec2 fc, out float panel){
  panel = 0.0;
  if (u_pop < 0.5 || u_grid < 1.5) return fc;
  vec2 cell = u_res / u_grid;
  vec2 ij = min(floor(fc / cell), vec2(u_grid - 1.0));
  vec2 loc = fc - ij * cell;
  float row = u_grid - 1.0 - ij.y;
  panel = ij.x + row * u_grid;
  if (mod(ij.x + row, 2.0) > 0.5) loc.x = cell.x - loc.x;
  return vec2(loc.x, u_res.y - cell.y + loc.y);
}
// the dancer is hidden below the river surface while he rises out of it
float fgMask(vec2 fc){
  if (u_waterY <= 0.0) return 1.0;
  float wl = waterLine(fc.x);
  return smoothstep(wl - u_dpr, wl + u_dpr, fc.y);
}
float inFrame(vec2 fc){
  if (u_gal < 0.5) return 1.0;
  return step(u_frame.x, fc.x) * step(fc.x, u_frame.z) * step(u_frame.y, fc.y) * step(fc.y, u_frame.w);
}
float hAt(vec2 fc){
  float pn;
  vec2 fp = fgPos(fc, pn);
  vec4 b = texture(u_bgH, fc / u_res);
  vec4 f = texture(u_fgH, fp / u_res) * fgMask(fc);
  float h = (b.r * (1.0 - f.a) + f.r) * inFrame(fc);
  if (u_gal > 0.5) { vec4 g = texture(u_galH, fc / u_res); h = h * (1.0 - g.a) + g.r; }
  return h;
}
vec3 sceneShade(vec2 fc, vec2 uv, vec4 bc, vec4 bh, vec4 fcol){
  vec2 sh = texture(u_sh, uv).rg;
  vec3 alb = bc.rgb + u_ground * (1.0 - bc.a);
  float recv = bh.a > 0.002 ? clamp(bh.g / bh.a, 0.0, 1.0) : 0.0;
  float wp = max(pool(fc, u_wPool), pool(fc, u_wPool2)) * (1.0 - sh.r);
  float cp = max(pool(fc, u_cPool), pool(fc, u_cPool2)) * (1.0 - sh.g);
  vec3 lightC = u_amb + u_wCol * wp + u_cCol * cp;
  vec3 bg = mix(alb, alb * lightC, recv * bc.a);
  // wet ground: a rippled reflection of the dancer below his feet
  float bgGloss = bh.a > 0.002 ? bh.b / bh.a : 0.0;
  float below = u_floorY - fc.y;
  if (below > 0.0 && u_refl > 0.0) {
    float dd = below / u_res.y;
    vec2 rp = vec2(fc.x + sin(fc.y * 0.35 / u_dpr + u_time * 5.0) * 2.5 * u_dpr * (0.3 + dd * 6.0), u_floorY + below * 1.1);
    vec4 rf = texture(u_fgC, rp / u_res) * fgMask(rp);
    float k = u_refl * smoothstep(0.45, 0.65, bgGloss) * (1.0 - smoothstep(0.0, 0.25, dd)) * recv;
    bg = bg * (1.0 - rf.a * k) + rf.rgb * k;
  }
  return bg * (1.0 - fcol.a) + fcol.rgb;
}
vec3 popShade(vec2 fc, vec4 bc, vec4 fcol, vec4 fh, float pn, vec2 fp){
  int base = int(mod(pn + u_popSeed, 6.0)) * 10;
  float bl = bc.a > 0.01 ? dot(bc.rgb / bc.a, vec3(0.3, 0.5, 0.2)) : 0.5;
  vec3 back = PAL[base] * (0.8 + 0.4 * bl);
  vec3 c = back;
  if (fcol.a > 0.003) {
    vec3 g = fcol.rgb / fcol.a;
    float l = dot(g, vec3(0.3, 0.5, 0.2));
    int id = int(clamp(floor(fh.g / max(fh.a, 1e-3) * 10.0 + 0.5), 1.0, 9.0));
    vec3 fcl = PAL[base + id];
    // Ben-Day dots in the shadows
    vec2 q = mat2(0.7071, -0.7071, 0.7071, 0.7071) * (fc / u_dpr);
    float d = length(fract(q / 5.0) - 0.5);
    float shd = id == 4 ? 1.0 - smoothstep(0.12, 0.36, l) : 1.0 - smoothstep(0.22, 0.6, l);
    float r = 0.6 * sqrt(shd);
    float dots = (1.0 - smoothstep(r - 0.08, r + 0.08, d)) * step(0.5, float(id != 7 && id != 9));

// ---------- 3D stroke for the dancer and moving scenery: points in world space, widths in cm,

// ============================================================
// Lettering: the browser rasterises the words, and each row of ink becomes one
// sign-painter's stroke. Runs are cached per string/font/size.
// ============================================================
const TEXT_CACHE = new Map();
function textRuns(str, font, size, rows) {
  const key = [str, font, size, rows].join('|');
  if (TEXT_CACHE.has(key)) return TEXT_CACHE.get(key);
  const c = document.createElement('canvas');
  const x = c.getContext('2d');
  const f = font.replace('%', size + 'px');
  x.font = f;

  for (let y = step * 0.5; y < h; y += step) {
    const yy = Math.floor(y);

    for (let xx = 0; xx <= w; xx++) {
      const on = xx < w && d[(yy * w + xx) * 4 + 3] > 100;

// ---- 30-rig.js
// ============================================================
// Skeleton: pose parameters -> 3D joints (units: cm, floor at y = 0)
// "M" = the microphone arm (his right, screen left), "F" = free arm (his left, screen right)
// ============================================================
const RIG = {
  pelvisY: 98, waistLen: 14, chestLen: 24, neckLen: 14,
  shoulderX: 19, upperArm: 29, foreArm: 26.5,
  hipX: 9.5, hipY: -4, thigh: 44, shin: 42

function basePose() {
  return {
    px: 0, py: -2.5, pz: 0, pyaw: 0, ppitch: 0, proll: 0,
    ry: 0,                                   // lifts the whole body (feet included): river, jumps
    cyaw: 0, cpitch: 0.03, croll: 0,
    hyaw: 0, hpitch: 0, hroll: 0,
    shM: 0, shF: 0,
    mX: -20, mY: -30, mZ: 14, mPole: 0,
    fX: 20, fY: -30, fZ: 14, fPole: 0,
    fOpen: 0, fPoint: 0, micAim: 0, mOpen: 0,
    lfx: -15, lfz: 2, lfy: 0, lheel: 0, lfyaw: -0.22,
    rfx: 15, rfz: 2, rfy: 0, rheel: 0, rfyaw: 0.22,
    lkx: -0.3, rkx: 0.3, squash: 0, twirl: 0, twA: 0,

// ---- 40-dance.js
// ============================================================
// Choreography for a 30 second club scene: 56 beats at 112 BPM.
//   0-8    the lead waits in the smoke at the back, hat pulled low; a flick of the brim
//   8-16   the walk: a long, unhurried stride out into the room and down to the spotlight
//  16-24   in the light: shoulder pops, a point, a full spin, up on his toes
//  18-26   four dancers in dark suits march in from both sides and take up a V behind him
//  24-32   a sideways glide, left and back again, with the line swaying in time
//  32-40   the hits: arms flung out on the beat, the whole line together; a spin
//  40-48   the feet: taps and slides (the camera drops to the floor)
//  48-50   everything stops, hands go to the hat brims
//  50-56   the lean: the lead tips far past his balance point, holds, snaps up and tips his hat
// Every pose is a function of the beat, so any frame can be reproduced.
// ============================================================
const parity = k => ((k % 2) + 2) % 2;

function sideHit(b, lag, w0, w1, over) {
  b -= lag || 0;

  const a0 = w0 === undefined ? 0.32 : w0, a1 = w1 === undefined ? 0.3 : w1;

  return lerp(-sg, sg, easeInOutBack((d + a0) / (a0 + a1), over === undefined ? 1.1 : over));
}

function twoStep(b, amp, P) {

  P.py = -3 - dp * 8 * amp;
  P.proll = s * 0.13 * amp;
  P.pyaw = s * 0.14 * amp;
  P.croll = -s * 0.15 * amp;
  P.cyaw = -sa * 0.26 * amp;
  P.cpitch = 0.04 + dp * 0.1 * amp;
  P.hroll = s * 0.1 * amp;

  P.rkx = lerp(0.3, -0.9, clamp(-s * amp, 0, 1));

}

}

function arm(P, side, x, y, z, open, point) {

  P.pyaw = yaw;

  P.rfx = 11 * rx + fx * sR; P.rfz = 11 * rz + fz * sR;
  P.lfy = 9 * Math.max(0, -sn); P.rfy = 9 * Math.max(0, sn);
  P.lfyaw = yaw - 0.1; P.rfyaw = yaw + 0.1;
  P.lheel = 7 * Math.max(0, sn) * (c < 0 ? 1 : 0.3); P.rheel = 7 * Math.max(0, -sn) * (c > 0 ? 1 : 0.3);

  P.hyaw = -0.5 * yaw; P.hpitch = 0.06; P.hroll = -0.04 * sn;
  P.mX = -20 - 3 * sn; P.mY = -29; P.mZ = 14 + 11 * c; P.mOpen = 0.3;
  P.fX = 20 + 3 * sn; P.fY = -29; P.fZ = 14 - 11 * c; P.fOpen = 0.3;

}

// ---------------------------------------------------------------- moves
function idle(b, P, amp) { twoStep(b, amp, P); P.smile = 0.2; P.hpitch += 0.12; return P; }

// hand to the brim, tip, and back
function hatTip(b, P, s, amp) {
  const lb = b - s;
  twoStep(b, amp === undefined ? 0.3 : amp, P);

  const e = up * (1 - down);

  P.hatLift = e * 0.8;

}

// the low, cool stand-up after the lean: hat down again
function crouchPop(b, P, s) {

}

// a full spin on the balls of the feet, arms out, jacket-shoulders leading
function spin(b, P, s) {

  P.lkx = -0.2; P.rkx = 0.2;
  P.hpitch = 0.05; P.smile = 0.8;

}

// up on the toes, arms opening, chin lifting
function toeStand(b, P, s) {
  const lb = b - s;
  twoStep(b, 0.3, P);
  const e = easeOutBack(seg(lb, 0, 0.3), 1.6);
  P.lheel = lerp(P.lheel, 15, e); P.rheel = lerp(P.rheel, 15, e); P.py = lerp(P.py, 4, e);

  arm(P, 'F', lerp(P.fX, 30, e), lerp(P.fY, 24, e), lerp(P.fZ, 14, e), e);
  P.hpitch = lerp(P.hpitch, -0.14, e); P.smile = 0.8;

}

// a shoulder pop and a point across the room
function popPoint(b, P, s) {
  const lb = b - s;
  twoStep(b, 0.7, P);
  const e = easeOutBack(seg(lb, 0.0, 0.25), 2.2) * (1 - smoothstep(1.4, 1.9, lb));
  arm(P, 'F', lerp(P.fX, 50, e), lerp(P.fY, 22, e), lerp(P.fZ, 22, e), 0, e);
  P.shF += 4 * bump(lb, 0.05, 0.1);
  P.hyaw = lerp(P.hyaw, 0.3, e); P.smile = 0.7; P.brow = 0.5 * e;
  return P;
}

// sideways glide: the pelvis is carried along by the path; the feet shuffle underneath
function glide(b, P, dir, b0) {
  twoStep(b, 0.25, P);
  stride(b, P, dir, 0, 5.5, b0, 0);
  P.lfy *= 0.35; P.rfy *= 0.35;
  arm(P, 'M', -26, -4 + 3 * Math.sin(TAU * b), 16, 0.6);
  arm(P, 'F', 28, 2 + 4 * Math.sin(Math.PI * b), 18, 0.8);
  P.hroll = 0.07 * Math.sin(Math.PI * b); P.hpitch = 0.08; P.smile = 0.6;
  return P;
}

// arms flung out on the beat: side is 'M' (screen left) or 'F' (screen right), s = first beat
function hits(b, P, s, side) {
  twoStep(b, 0.55, P);
  const k = Math.floor(b), u = b - k;
  const on = parity(k - s) === 0;
  const e = on ? easeOutBack(seg(u, 0, 0.22), 2.4) * (1 - smoothstep(0.7, 0.98, u)) : 0;
  const sg = side === 'M' ? -1 : 1;
  arm(P, side, lerp(P[side.toLowerCase() + 'X'], sg * 50, e), lerp(P[side.toLowerCase() + 'Y'], 24, e), lerp(P[side.toLowerCase() + 'Z'], 22, e), 0, side === 'F' ? e : 0);
  P.hyaw = lerp(P.hyaw, sg * 0.35, e); P.pyaw += sg * 0.25 * e; P.smile = 0.4;

// the rest-of-the-line move: a finger snap by the shoulder on every beat
function snapStep(b, P) {

// both hands to the brim and hold
function handsToBrim(b, P, s, hold) {
  const lb = b - s;
  twoStep(b, 0.1 * (1 - smoothstep(0, 0.4, lb)), P);
  const e = easeOutBack(seg(lb, 0, 0.3), 1.6);
  arm(P, 'M', lerp(P.mX, -13, e), lerp(P.mY, 44, e), lerp(P.mZ, 15, e), e);
  arm(P, 'F', lerp(P.fX, 13, e), lerp(P.fY, 44, e), lerp(P.fZ, 15, e), e);
  P.hpitch = lerp(P.hpitch, 0.18, e); P.smile = 0.1; P.py = lerp(P.py, -5, e);

}

// the feet: quick taps and slides on the eighth notes while the upper body stays cool
function taps(b, P) {
  twoStep(b, 0.35, P);
  const e = b * 2, k = Math.floor(e), u = e - k;

  if (left) { P.lheel = 16 * tap; P.lfy = 3 * tap; P.lfz = 4 * Math.sin(Math.PI * u); }
  else { P.rheel = 16 * tap; P.rfy = 3 * tap; P.rfz = 4 * Math.sin(Math.PI * u); }

  P.lfx += 5 * sl; P.rfx += 5 * sl;
  arm(P, 'M', -24 + 6 * Math.sin(TAU * b), -8, 18, 0.5);

// the lean: anchored feet, the whole body pivots forward far past where balance would allow.
// L runs 0..1; the body turns three-quarters so the tilt shows in profile
function lean(b, P, s) {
  const lb = b - s;
  const down = easeInOutCubic(seg(lb, 0, 1.3));
  const up = easeInOutCubic(seg(lb, 3.05, 3.4));

  P.rfx = 12 * rx - fx * back * 0.6; P.rfz = 12 * rz - fz * back * 0.6;

  arm(P, 'F', lerp(P.fX, 24, L), lerp(P.fY, -30, L), lerp(P.fZ, 4, L), 0.8 * L);
  P.smile = lerp(0.4, 0.9, L);

// ---------------------------------------------------------------- the lead
// where his pelvis is on the floor at beat b
function leadXZ(b) {

  if (b < 16) { const u = (b - 8) / 8; return [lerp(120, 0, u), lerp(-175, 30, u)]; }
  if (b < 24) return [0, 30];
  if (b < 28) return [lerp(0, -46, (b - 24) / 4), 30];
  if (b < 32) return [lerp(-46, 0, (b - 28) / 4), 30];
  if (b < 40) return [0, 30];
  if (b < 48) return [0, 30 + 26 * smoothstep(40, 41.5, b) * (1 - smoothstep(46.5, 48, b))];

}
const LEAD_SECTIONS = [
  { b: -1, f: (b, P) => idle(b, P, 0.12) },
  { b: 5.5, f: (b, P, s) => hatTip(b, P, 6.2, 0.12) },
  { b: 8, f: (b, P, s) => { const [x0, z0] = [120, -175], d = vnorm(V(-120, 0, 205)); return stride(b, P, d.x, d.z, 14.5, 8); } },
  { b: 15.5, f: (b, P) => { twoStep(b, lerp(0.15, 0.7, seg(b, 15.5, 16.5)), P); return P; } },
  { b: 16, f: (b, P) => popPoint(b, P, 16.5) },
  { b: 19, f: (b, P) => hatTip(b, P, 19.4, 0.8) },
  { b: 20, f: (b, P) => spin(b, P, 20.3) },
  { b: 22, f: (b, P) => toeStand(b, P, 22.3) },
  { b: 24, f: (b, P) => glide(b, P, -1, 24) },
  { b: 28, f: (b, P) => glide(b, P, 1, 28) },
  { b: 32, f: (b, P) => hits(b, P, 32, 'F') },
  { b: 36, f: (b, P) => spin(b, P, 36.2) },
  { b: 38, f: (b, P) => popPoint(b, P, 38.4) },
  { b: 40, f: (b, P) => taps(b, P) },
  { b: 47.5, f: (b, P) => crouchPop(b, P, 47.9) },
  { b: 48.4, f: (b, P) => handsToBrim(b, P, 48.5) },
  { b: 50, f: (b, P) => lean(b, P, 50) },

function sectionPose(list, b, i) {
  const S = list[i];

}
function leadAt(b) {

  if (i > 0 && b < list[i].b + 0.3) P = lerpPose(sectionPose(list, b, i - 1), P, smoothstep(list[i].b - 0.2, list[i].b + 0.3, b));

}

// ---------------------------------------------------------------- the line of dancers
const ENS = [
  { style: 'a', slot: [-104, -48], from: [-440, -48], t0: 18, side: 'M', yaw: 0.18 },
  { style: 'b', slot: [-60, -112], from: [-440, -112], t0: 19, side: 'M', yaw: 0.1 },
  { style: 'c', slot: [104, -48], from: [440, -48], t0: 18.5, side: 'F', yaw: -0.18 },
  { style: 'd', slot: [60, -112], from: [440, -112], t0: 19.5, side: 'F', yaw: -0.1 }
];
const ENS_ARRIVE = 26;
function ensAt(b, e) {
  const [x0, z0] = e.from, [x1, z1] = e.slot;
  let P;
  if (b < ENS_ARRIVE + 0.5) {
    const u = clamp((b - e.t0) / (ENS_ARRIVE - e.t0), 0, 1);
    const dx = x1 - x0, dz = z1 - z0, len = Math.hypot(dx, dz);
    const speed = len / (ENS_ARRIVE - e.t0);
    P = stride(b, basePose(), dx / len, dz / len, u > 0 && u < 1 ? speed / 2 : 0.001, e.t0);
    if (u <= 0 || u >= 1) { twoStep(b, u >= 1 ? 0.55 : 0.1, P); }
    place(P, lerp(x0, x1, u), lerp(z0, z1, u));
    if (b > ENS_ARRIVE - 0.4) {
      const Q = place(sectionEns(b, e), x1, z1);

    }

}
function sectionEns(b, e) {

  P.pyaw += yaw;

}

// ---------------------------------------------------------------- the cast at time t
function castAt(t) {
  const b = t / BEAT;
  const out = [{ id: 'lead', style: STYLES.lead, P: leadAt(b) }];
  ENS.forEach((e, i) => out.push({ id: 'e' + i, style: STYLES[e.style], P: ensAt(b, e) }));
  for (const c of out) c.J = solveRig(c.P);

}

// ---------------------------------------------------------------- jacket, shirt, tie, lapels
function drawSuitTorso(J, S, front) {
  const Rc = J.Rc, Rw = J.Rw, Rp = J.Rp;
  const isLead = S === STYLES.lead;
  G.mid = ID.coat;
  // neck first, so the collar and shirt sit on top of it
  G.mid = ID.skin;
  st([xf(J.neckTop, J.Rh, 0, 2.5, 1.5), xf(J.neck, Rc, 0, 4, 3)], 9.4, shade(MAT.skin, mv(J.Rh, V(0, -0.5, 0.8))), { tip: 0.9, w0: 0.9, dry: 0.15 });
  G.mid = ID.coat;
  // the jacket body: four broad planes from the hem up to the shoulder line, then the shoulders
  for (const x of [-11.5, -3.8, 3.8, 11.5]) {
    const n = mv(Rc, vnorm(V(x / 14, 0.1, front ? 1 : -1)));
    const z = front ? 1 : -1;
    st([xf(J.pelvis, Rp, x * 1.2, -10, 8 * z), xf(J.waist, Rw, x * 1.06, 0, 9 * z), xf(J.chest, Rc, x, 4, 10.5 * z), xf(J.neck, Rc, x * 0.9, 1, 5 * z)],
      [15, 15, 15, 12], shade(S.jacket, n), { dry: 0.28, h: 0.34 });
  }
  st([xf(J.neck, Rc, -19.5, -3, 0.5), xf(J.neck, Rc, 0, 2.5, 2.5), xf(J.neck, Rc, 19.5, -3, 0.5)], 13, shade(S.jacket, mv(Rc, V(0, 0.8, 0.6))), { dry: 0.2, h: 0.4 });
  // the drape: a soft dark fold on the shadow side and a lit one on the key side
  st([xf(J.chest, Rc, -13, 2, 11.4 * (front ? 1 : -1)), xf(J.waist, Rw, -12, 0, 10.6 * (front ? 1 : -1)), xf(J.pelvis, Rp, -12, -9, 9 * (front ? 1 : -1))], 2.6, shade(S.jacket, mv(Rc, V(-0.9, 0, 0.5)), 0.14), { a: 0.75, dry: 0.5, h: 0.4, noShadow: true });
  st([xf(J.chest, Rc, 13, 2, 11.4 * (front ? 1 : -1)), xf(J.waist, Rw, 12, 0, 10.6 * (front ? 1 : -1)), xf(J.pelvis, Rp, 12, -9, 9 * (front ? 1 : -1))], 2.2, shade(S.jacket, mv(Rc, V(0.9, 0, 0.4)), -0.2), { a: 0.7, dry: 0.5, h: 0.4, noShadow: true });
  if (!front) {
    // back vent
    st([xf(J.waist, Rw, 0, -2, -10), xf(J.pelvis, Rp, 0, -10, -9)], 1.2, shade(S.jacket, V(0, 0, -1), -0.4), { a: 0.7, dry: 0.4, noShadow: true });
    return;
  }
  // shirt and tie in the V of the jacket
  G.mid = ID.white;
  st([xf(J.neck, Rc, 0, 4.4, 6.6), xf(J.chest, Rc, 0, -3, 11.4), xf(J.chest, Rc, 0, -14, 12)], [10, 8.5, 3], shade(S.shirt, mv(Rc, V(0, 0.2, 1))), { dry: 0.1, h: 0.3, w0: 0.95, tip: 0.6 });
  if (S.tie) {
    G.mid = ID.ink;
    st([xf(J.neck, Rc, 0, 2.6, 7.6), xf(J.chest, Rc, 0, -10, 12.4), xf(J.waist, Rw, 0, -3, 10.8)], [2.8, 4.2, 3.6], S.tie, { dry: 0.2, h: 0.5, gloss: 0.5, tip: 0.6 });
  } else {
    // open collar: two wings of teal shirt over the jacket
    for (const sg of [-1, 1]) st([xf(J.neck, Rc, sg * 3.2, 4.4, 7), xf(J.neck, Rc, sg * 7.4, 3.6, 5.6), xf(J.chest, Rc, sg * 6.4, -1, 11.3)], [3.2, 4.2, 1.4], shade(S.shirt, mv(Rc, V(sg * 0.5, 0.4, 1)), sg < 0 ? 0.12 : -0.08), { dry: 0.15, h: 0.5, tip: 0.5 });
  }
  // lapels
  G.mid = ID.coat;

    const top = xf(J.neck, Rc, sg * 5, 3.5, 6.4), notch = xf(J.chest, Rc, sg * 13, 3, 11.4), brk = xf(J.chest, Rc, sg * 6, -17, 12.8);

// ---------------------------------------------------------------- arms
function drawSuitArm(J, S, which) {
  const M = which === 'M';
  const sh = M ? J.shM : J.shF, el = M ? J.elM : J.elF, wr = M ? J.wrM : J.wrF;

  const pE = perpToward(vnorm(vadd(up, fo)), V(-1, 0.4, 0.6));

// ---------------------------------------------------------------- one person
function drawSuit(J, S) {
  G.style = S;
  const facing = mv(J.Rc, V(0, 0, 1)).z;
  const front = facing > -0.15;
  drawSuitLegs(J, S);
  const mz = armDepth(J, 'M'), fz = armDepth(J, 'F');
  if (mz < -3) drawSuitArm(J, S, 'M');
  if (fz < -3) drawSuitArm(J, S, 'F');
  drawSuitTorso(J, S, front);
  if (mv(J.Rh, V(0, 0, 1)).z < -0.25) drawSuitHeadBack(J, S); else drawHead(J);
  if (mz >= -3) drawSuitArm(J, S, 'M');
  if (fz >= -3) drawSuitArm(J, S, 'F');
}

// a simple dark silhouette for floor shadows (mask pass)
function drawSilSuit(J) {
  const flat = { sq: 0.6 };
  for (const s of ['L', 'R']) {
    const hip = J['hip' + s], an = J['an' + s], ft = J['foot' + s];
    st([vadd(hip, V(0, 7, 0)), hip, J['kn' + s], an, vadd(vlerp(an, ft.ball, 0.4), V(0, -0.6, 1.5))], [19, 17.5, 14, 12.5, 12.5], null, flat);
    st([vadd(an, V(0, -1.5, 0.5)), vadd(ft.ball, V(0, 2, 0)), ft.toe], [9, 10.5, 9], null);
  }
  st([J.pelvis, J.waist, J.chest], 34, null, flat);
  st([xf(J.shM, J.Rc, -3, 1, 0), J.neck, xf(J.shF, J.Rc, 3, 1, 0)], 15, null);
  st([J.chest, J.neck, J.neckTop, J.head], [22, 12, 11, 13], null);
  for (const M of [true, false]) {
    const sh = M ? J.shM : J.shF, el = M ? J.elM : J.elF, wr = M ? J.wrM : J.wrF;
    st([sh, el, wr], [15, 13, 11], null);
    const fo = vnorm(vsub(wr, el));
    dab(vmad(wr, fo, 5), 9, 9, null, { ang: screenAng(wr, vmad(wr, fo, 8)) });

  const H = J.head, R = J.Rh;
  st([xf(H, R, -15, 8, 0), xf(H, R, 0, 6, 15), xf(H, R, 15, 8, 0)], 6, null);
  st([xf(H, R, 0, 8, 3), xf(H, R, 0, 19, 3)], 16, null);
}

// ---- 61-face.js
// ============================================================
// Face, hands and light shading, carried over from the original engine
// (the suit, hat and body are in 60-figure.js)
// ============================================================
function shade(mat, n, jit) {
  const dw = vdot(n, G.wDir), dc = vdot(n, G.cDir);
  const lw = clamp(smoothstep(-0.45, 0.8, dw) * G.wI, 0, 1.25);
  const lc = smoothstep(0.0, 0.85, dc) * G.cI;
  if (G.pop) { const v = clamp(0.2 + 0.62 * smoothstep(0, 1.1, lw) + 0.18 * lc, 0, 1); return [v, v, v]; }
  let c = mixc(mat.s, mat.m, smoothstep(0.0, 0.5, lw));
  c = mixc(c, mat.l, smoothstep(0.5, 1.15, lw));
  c = mixc(c, mat.c, clamp(lc * 0.45 * (1 - 0.6 * smoothstep(0.4, 1.0, lw)), 0, 1));
  if (G.tint) c = [c[0] * G.tint[0], c[1] * G.tint[1], c[2] * G.tint[2]];
  if (jit) c = scalec(c, 1 + jit);
  return c;
}

function screenAng(p, q) {
  const a = G.proj(p), b = G.proj(q);
  return Math.atan2(b.y - a.y, b.x - a.x);
}
function perpToward(dir, toward) {
  let p = vcross(dir, V(0, 0, 1));
  if (vlen(p) < 1e-4) p = V(1, 0, 0);
  p = vnorm(p);
  return vdot(p, toward) < 0 ? vmul(p, -1) : p;
}


function drawHead(J) {
  const H = J.head, R = J.Rh, ps = J.pose;
  const hp = (x, y, z) => xf(H, R, x, y, z);
  const hn = (x, y, z) => mv(R, vnorm(V(x, y, z)));
  const skin = (x, y, z, j) => shade(MAT.skin, hn(x, y, z), j);
  G.mid = ID.skin;
  // block in the head in a darker skin tone first, so no gaps open between the planes
  st([hp(0, 8.5, 4.5), hp(0, 1, 5.5), hp(0, -7, 5.5), hp(0, -10, 5)], [13.4, 14.6, 13, 8], skin(0.2, -0.1, 0.5, -0.18), { dry: 0.05, h: 0.3, w0: 0.9, tip: 0.8 });
  for (const sg of [-1, 1]) {
    st([hp(sg * 6.6, 5, 1.5), hp(sg * 7.0, 0, 1.2), hp(sg * 6.4, -5, 1.8)], [3.2, 3.6, 3], skin(sg, 0, 0.2, -0.12), { dry: 0.15, h: 0.35 });
    st([hp(sg * 7.2, 2.4, -0.4), hp(sg * 7.7, -0.3, -0.3), hp(sg * 7.0, -3.4, 0.2)], [2.0, 2.5, 1.8], skin(sg, 0, 0.35, -0.05), { dry: 0.2, h: 0.4 });
  }

// ---- 65-camera.js
// ============================================================
// Cameras and projection. A camera may carry a 2D "view" (scale + offset in device px)
// applied after projection: that is how the pop-art panel and the gallery frame shrink
// the whole painting without re-framing it.
// ============================================================
const WALL_Z = -260;
const CAM_DIST = 560;
const IDENT_VIEW = { s: 1, ox: 0, oy: 0 };

function makeCam(pos, target, fovY, roll, view) {
  const f = vnorm(vsub(target, pos));
  const r = vnorm(vcross(f, V(0, 1, 0)));
  const u = vcross(r, f);
  const c = Math.cos(roll), s = Math.sin(roll);
  return {
    pos, f, r: vadd(vmul(r, c), vmul(u, s)), u: vsub(vmul(u, c), vmul(r, s)),
    focal: (CH / 2) / Math.tan(fovY / 2), cx: CW / 2, cy: CH / 2, view: view || IDENT_VIEW
  };
}
const withView = (cam, view) => Object.assign({}, cam, { view });
function project(cam, p) {
  const dx = p.x - cam.pos.x, dy = p.y - cam.pos.y, dz = p.z - cam.pos.z;
  const x = dx * cam.r.x + dy * cam.r.y + dz * cam.r.z;
  const y = dx * cam.u.x + dy * cam.u.y + dz * cam.u.z;
  const z = Math.max(1, dx * cam.f.x + dy * cam.f.y + dz * cam.f.z);
  const s = cam.focal / z;
  const v = cam.view;
  return { x: (cam.cx + x * s) * v.s + v.ox, y: (cam.cy - y * s) * v.s + v.oy, s: s * v.s };
}
// shadow of p cast by a point light onto the floor (y=0) or the back wall
function shadowPoint(Lp, p) {
  const d = vsub(p, Lp);
  let tb = Infinity;
  if (d.z < -1e-4) { const t = (WALL_Z + 0.5 - Lp.z) / d.z; if (t > 1) tb = t; }
  if (d.y < -1e-4) { const t = (0.3 - Lp.y) / d.y; if (t > 1 && t < tb) tb = t; }
  if (!isFinite(tb)) tb = 1;
  return { p: vmad(Lp, d, tb), t: tb };
}
function projectShadow(cam, Lp, p, lean) {
  const sp = shadowPoint(Lp, p);
  if (lean && sp.p.y > 0.5) sp.p.x += lean * sp.p.y;   // pivot about the floor line
  const q = project(cam, sp.p);
  q.s *= sp.t;
  return q;
}
// GPU view-projection matrix for the static world strokes, including the 2D view
function camVP(cam) {
  const sx = 2 * cam.focal / CW, sy = 2 * cam.focal / CH;
  const r = cam.r, u = cam.u, f = cam.f, p = cam.pos;
  const tr = -vdot(r, p), tu = -vdot(u, p), tf = -vdot(f, p);
  const M = new Float32Array([
    sx * r.x, sy * u.x, 0.5 * f.x, f.x,
    sx * r.y, sy * u.y, 0.5 * f.y, f.y,
    sx * r.z, sy * u.z, 0.5 * f.z, f.z,
    sx * tr, sy * tu, 0.5 * tf, tf
  ]);
  const v = cam.view;
  if (v.s !== 1 || v.ox || v.oy) {
    const ax = v.s - 1 + 2 * v.ox / CW, ay = 1 - v.s - 2 * v.oy / CH;
    for (let c = 0; c < 4; c++) {
      M[c * 4] = v.s * M[c * 4] + ax * M[c * 4 + 3];
      M[c * 4 + 1] = v.s * M[c * 4 + 1] + ay * M[c * 4 + 3];
    }
  }
  return M;
}
// where a camera ray through p meets the plane z = zPlane (for putting things "behind" p)
function rayToPlaneZ(cam, p, zPlane) {
  const d = vsub(p, cam.pos);
  const t = (zPlane - cam.pos.z) / (d.z || -1e-6);
  return vmad(cam.pos, d, t);
}

function buildWindows(rnd) {
  const W = WALL_Z;
  for (const win of WIN) {

    // cool glow spilling out around each window (unlit, soft)
    wdab(V(x, y0 + h * 0.5, W + 0.6), h * 1.5, w * 3.4, [0.12, 0.34, 0.56], { kind: 1, a: 0.32 });
    // recessed frame
    const half = yy => (win.arch && yy > spring ? Math.sqrt(Math.max(0, (w / 2) * (w / 2) - (yy - spring) * (yy - spring))) : w / 2);
    for (let yy = y0 - 6; yy <= y0 + h + 4; yy += 8) {
      const hw = half(yy) + 7;
      wst([V(x - hw, yy, W + 0.8), V(x + hw, yy, W + 0.8)], 9, [0.05, 0.05, 0.08], { recv: 1, dry: 0.15, h: 0.35, sq: 1, w0: 1, tip: 1 });
    }
    // the panes: rows of luminous blue, brighter toward the top
    for (let yy = y0; yy <= y0 + h; yy += 6) {
      const hw = half(yy);
      const k = (yy - y0) / h;
      const c = mixc([0.10, 0.50, 0.82], [0.44, 0.86, 1.0], k * 0.7 + rnd() * 0.15);
      wst([V(x - hw, yy, W + 1), V(x + hw, yy + (rnd() - 0.5), W + 1)], 7, c, { recv: 0, dry: 0.12, h: 0.14, sq: 1, w0: 1, tip: 1 });
    }

    for (let i = 0; i <= cols; i++) {
      const xx = x - w / 2 + i * w / cols;
      const top = win.arch ? y0 + h - Math.max(0, (w / 2) - Math.sqrt(Math.max(0, (w / 2) * (w / 2) - (xx - x) * (xx - x)))) : y0 + h;

    }
    for (let j = 0; j <= rows; j++) {
      const yy = y0 + j * h / rows;
      const hw = half(yy);
      wst([V(x - hw, yy, W + 1.4), V(x + hw, yy, W + 1.4)], 3.2, [0.04, 0.05, 0.08], { recv: 0.6, dry: 0.15, h: 0.4, w0: 1, tip: 1 });

      }

    wst([V(x - w / 2 - 8, y0 - 6, W + 3), V(x + w / 2 + 8, y0 - 6, W + 3)], 7, [0.14, 0.08, 0.06], { recv: 1, dry: 0.2, h: 0.5, gloss: 0.4 });
  }

// ---- 75-scenes.js
// ============================================================
// Camera, lights and the moving atmosphere for the club scene.
// Beats:  0 wide, the lead waits | 8 he walks out | 14 the spot finds him | 18 the line arrives |
//        24 glide | 32 hits | 40 low shot, the feet | 48.5 everything stops | 50 the lean | 54 hat tip | 56 end
// ============================================================

// [beat, visible height at the dancers (cm), look-at x, look-at y, camera height above look-at, roll (rad)]
const CAM_KEYS = [
  [0, 336, 78, 120, 30, 0.0], [8, 318, 46, 112, 24, 0.0],
  [16, 268, 4, 102, 14, 0.0], [24, 252, -6, 104, 12, 0.0],
  [32, 238, 0, 100, 10, 0.0], [39.5, 242, 0, 100, 10, 0.0],
  [41.2, 178, 0, 66, -4, 0.0], [47.2, 172, 0, 66, -4, 0.0],
  [48.6, 238, 0, 102, 8, 0.0], [50, 252, 14, 104, 8, 0.0], [53.2, 252, 14, 104, 8, 0.0],
  [55.2, 208, 0, 112, 6, 0.0], [56, 204, 0, 112, 6, 0.0]
];
function cameraAt(t) {
  const b = t / BEAT;
  let i = 0;
  while (i + 1 < CAM_KEYS.length && b >= CAM_KEYS[i + 1][0]) i++;
  const k0 = CAM_KEYS[i], k1 = CAM_KEYS[Math.min(i + 1, CAM_KEYS.length - 1)];
  const u = k1[0] > k0[0] ? easeInOut(clamp((b - k0[0]) / (k1[0] - k0[0]), 0, 1)) : 0;
  let viewH = lerp(k0[1], k1[1], u), tx = lerp(k0[2], k1[2], u), ty = lerp(k0[3], k1[3], u);
  const yOff = lerp(k0[4], k1[4], u), roll = lerp(k0[5], k1[5], u);
  // a whisper of handheld drift, and a small push on every bar line
  tx += 1.6 * Math.sin(t * 0.7) + 0.8 * Math.sin(t * 1.9 + 1);
  ty += 1.1 * Math.sin(t * 0.9 + 2);
  if (!REDUCED) viewH *= 1 - 0.012 * Math.pow(dip(b / 4), 2);
  const asp = CW / CH;
  if (asp < 1.1) { const need = 200 / asp; if (need > viewH) { ty += (need - viewH) * 0.1; viewH = need; } }
  const fov = 2 * Math.atan((viewH / 2) / CAM_DIST);
  return makeCam(V(tx * 0.75, ty + yOff, CAM_DIST), V(tx, ty, 0), fov, roll + 0.004 * Math.sin(t * 0.6));
}

// how brightly the follow-spot burns: it finds him as he reaches the mark, narrows for the lean, dies at the end
function spotOn(b) {
  const on = smoothstep(12.6, 14.6, b) * (1 - smoothstep(55.3, 56, b));
  const pulse = 1 + 0.05 * hitPulse('kick', b * BEAT, 0.2) + 0.09 * hitPulse('snare', b * BEAT, 0.12) + 0.14 * hitPulse('crash', b * BEAT, 0.4);
  return on * pulse;
}
function lightsFor(b) {
  const on = spotOn(b);
  return {
    // key: a warm spot from above and in front, slightly to his left; rim: cool light through the windows behind
    w: V(-140, 420, 300), c: V(320, 150, -300),
    wI: 0.5 + 0.75 * on, cI: 1.0 + 0.1 * hitPulse('kick', b * BEAT, 0.15)
  };
}
const LOOK = { tint: null, rimW: [1.0, 0.82, 0.55], rimC: [0.45, 0.72, 1.0] };

// world-space ellipse on the screen, as the composite expects: [cx, cy (from the bottom), rx, ry]
function poolAt(cam, p, rxCm, ryCm) {
  const q = project(cam, p);
  return [q.x, CH - q.y, rxCm * q.s, ryCm * q.s];
}

// smoke that drifts and curls through the room, and the faint cone of the follow-spot
function drawSmoke(t, b, cam, lead) {
  const rnd = mulberry(4711);
  G.mid = 0;
  for (let i = 0; i < 18; i++) {
    const y = 26 + rnd() * 400, z = WALL_Z + 30 + rnd() * 560;
    const x0 = -650 + rnd() * 1300, len = 200 + rnd() * 340, sp = 0.15 + rnd() * 0.35, ph = rnd() * TAU, amp = 50 + rnd() * 90;
    const w = 26 + rnd() * 34;
    const x = x0 + Math.sin(t * sp + ph) * amp;
    const y1 = y + 10 * Math.sin(t * 0.55 + ph), y2 = y + 14 * Math.sin(t * 0.4 + ph * 2);
    st([V(x, y, z), V(x + len * 0.5, y1, z), V(x + len, y2, z)], [w * 0.6, w, w * 0.5], [0.60, 0.64, 0.82],
      { kind: 1, a: 0.045 + rnd() * 0.05, recv: 1, dry: 0.3 });
  }
  const on = spotOn(b);
  if (on > 0.02) {
    const [lx, lz] = leadXZ(b);
    for (let k = -2; k <= 2; k++) {
      st([V(lx * 0.4 - 90 + k * 6, 480, lz - 70), V(lx + k * 22, 0, lz)], [4, 28 + Math.abs(k) * 4], [1.0, 0.86, 0.6],
        { kind: 1, a: 0.032 * on, recv: 0, dry: 0.2 });
    }
  }
  // dust turning in the beam
  for (let i = 0; i < 26; i++) {
    const [lx, lz] = leadXZ(b);
    const ph = i * 2.37;
    const x = lx + 90 * Math.sin(t * 0.3 + ph) * (0.4 + (i % 5) * 0.15), y = 30 + ((t * 8 + i * 37) % 340), z = lz + 60 * Math.cos(t * 0.27 + ph * 1.3);
    dab(V(x, y, z), 1.8, 2.4, [1.0, 0.9, 0.7], { a: 0.5 * on, kind: 0, dry: 0.2, noShadow: true });
  }
}

// ---- 80-audio.js
// ============================================================
// The soundtrack: an original score, synthesised live with WebAudio and locked to the picture.
// A smoky room tone, a heartbeat, a walking groove that grows into a full funk band (rolling bass riff,
// off-beat stabs, bells, brass), hits that land exactly on the dancers' flung arms, a thin section for the
// tap dance, a full stop, and a final swell for the lean. G minor, 112 BPM, 14 bars = 30 seconds.
// No samples, and nothing borrowed.
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
const AUDIO = { ctx: null, out: null, rev: null, gate: null, noise: null, master: null, t0: 0, running: false, idx: 0, loop: 0, muted: false };

function audioSetup() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  let ctx;
  try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { return false; }
  Object.assign(AUDIO, { ctx }, buildGraph(ctx));
  return true;
}
// the mixing desk: a bus into shelving EQ and a glue compressor; hall, gated and echo sends
function buildGraph(ctx) {
  const master = ctx.createGain(); master.gain.value = 0.8;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -15; comp.knee.value = 12; comp.ratio.value = 3.2; comp.attack.value = 0.004; comp.release.value = 0.2;

// ---------------------------------------------------------------- the score
const SCORE = [];
const VOICE = [];     // [start, end] of every sung note (kept for the mouth follower; unused in this piece)
const ev = (beat, fn, ...a) => SCORE.push({ t: beat * BEAT, fn, a });
// chords: r = bass root, s = stab voicing, arp = sparkle notes, third = 3 (minor) or 4 (major) for the bass line
const CHD = {
  Gm: { r: 31, s: [55, 58, 62, 67], arp: [67, 70, 74, 79], third: 3 },
  Eb: { r: 39, s: [55, 58, 63, 67], arp: [67, 70, 75, 79], third: 4 },
  F: { r: 41, s: [57, 60, 65, 69], arp: [69, 72, 77, 81], third: 4 },
  Cm: { r: 36, s: [55, 60, 63, 67], arp: [67, 72, 75, 79], third: 3 },
  D7: { r: 38, s: [57, 60, 66, 69], arp: [69, 72, 78, 81], third: 4 }

// the riff: root, third, fifth, fourth in a syncopated figure [beat, semitones above root, length, velocity]
const RIFF = [[0, 0, 0.4, 1], [0.75, 0, 0.2, 0.7], [1.5, 'T', 0.3, 0.8], [2, 0, 0.4, 0.9], [2.5, 7, 0.3, 0.8], [3, 5, 0.3, 0.8], [3.5, 7, 0.4, 0.9]];
function riff(bar, ch, v) {
  for (const [bt, iv, len, vel] of RIFF) ev(bar * 4 + bt, I.bass, ch.r + (iv === 'T' ? ch.third : iv), BEAT * len, vel * (v || 1));
}
// off-beat comping: short stabs on the "ands"
const COMP = [[0.5, 0.3, 0.9], [1.5, 0.3, 0.8], [2.5, 0.3, 0.9], [3.25, 0.18, 0.7], [3.75, 0.18, 0.7]];
function comp(bar, ch, v) { for (const [bt, d, vv] of COMP) ev(bar * 4 + bt, I.stab, ch.s, d * BEAT, vv * (v || 1)); }
function drums(bar, o) {
  const b0 = bar * 4;

// the two-bar bell motif over Gm / Eb
const M_GM = [[0, 79, 0.75], [0.75, 77, 0.25], [1, 74, 0.5], [1.5, 70, 0.5], [2, 74, 0.75], [2.75, 77, 0.25], [3, 79, 1]];
const M_EB = [[0, 75, 0.75], [0.75, 74, 0.25], [1, 70, 0.5], [1.5, 67, 0.5], [2, 70, 0.75], [2.75, 74, 0.25], [3, 75, 1]];
const M_CM = [[0, 79, 0.75], [0.75, 75, 0.25], [1, 72, 0.5], [1.5, 75, 0.5], [2, 79, 0.75], [2.75, 84, 0.25], [3, 82, 1]];
const M_D7 = [[0, 81, 0.5], [0.5, 78, 0.5], [1, 74, 0.5], [1.5, 72, 0.5], [2, 69, 0.5], [2.5, 72, 0.5], [3, 74, 0.5], [3.5, 78, 0.5]];

function buildScore() {
  // ---- bars 0-1 (beats 0-8): the room. A low pad, a heartbeat, smoke, the odd finger-snap and a glass.
  ev(0, I.brush, 3.6);
  ev(0, I.pad, CHD.Gm.s, BEAT * 8, 0.9);
  for (const bt of [0, 4]) ev(bt, I.upright, 31, 0.9);
  for (const bt of [2.5, 6.5]) ev(bt, I.upright, 34, 0.55);
  for (const bt of [2, 3, 6, 7]) ev(bt, I.snap, 0.55);
  [4, 5, 6, 7].forEach((bt, i) => ev(bt, I.kick, 0.3 + i * 0.06));

  ev(1.2, I.ding, 103, 0.45); ev(5.3, I.ding, 98, 0.4);             // a glass somewhere
  ev(6.15, I.swish, 0.5, 0.6); ev(6.9, I.ding, 96, 0.7);            // the brim, and the glint on it

  const walk = [['Gm', 2], ['Eb', 3]];

    const ch = CHD[nm];
    for (let q = 0; q < 4; q++) { ev(bar * 4 + q, I.kick, 0.85); if (q % 2) ev(bar * 4 + q, I.snap, 0.9); ev(bar * 4 + q + 0.5, I.hat, 0.6); }

  ev(14, I.stab, CHD.D7.s, BEAT * 0.4, 0.9); ev(14.5, I.stab, CHD.D7.s, BEAT * 0.3, 0.8); ev(15, I.stab, CHD.D7.s, BEAT * 0.3, 0.9);
  for (let i = 0; i < 8; i++) ev(14 + i * 0.25, I.snare, 0.22 + i * 0.09);
  ev(14, I.riser, BEAT * 2, 0.8);
  ev(13.5, I.bell, 91, 0.6, 0.6, 2.5, 1);

  // ---- bars 4-5 (16-24): in the light. Full groove, brass on the "ands", the bell motif.
  ev(16, I.crash, 1.0);
  ev(16, I.timp, 43, 1.0);
  const sp = [['Gm', 4], ['Eb', 5]];
  for (const [nm, bar] of sp) {
    const ch = CHD[nm];
    drums(bar, { clap: bar === 5, open: true });
    riff(bar, ch, 1.0); comp(bar, ch, 1.0);

  tune(4, M_GM, I.brass, -12, 0.55); tune(5, M_EB, I.brass, -12, 0.55);
  ev(20.3, I.whoosh, 0.7, 0.7, 0.6);            // the spin
  ev(22.3, I.ding, 100, 0.7);                   // up on the toes

  // ---- bars 6-7 (24-32): the line marches in, then glides. Cm and D7, pluck arpeggios, thicker brass.
  const gl = [['Cm', 6], ['D7', 7]];
  for (const [nm, bar] of gl) {
    const ch = CHD[nm];
    drums(bar, { clap: true, open: true });
    riff(bar, ch, 1.0); comp(bar, ch, 1.0); arpeggio(bar, ch, 0.8);
    ev(bar * 4, I.pad, ch.s, BEAT * 4, 0.9);
  }

  tune(6, M_CM, I.brass, -12, 0.65); tune(7, M_D7, I.brass, -12, 0.65);

    ev(bt, I.snare, 1.0); ev(bt, I.clap, 0.8); ev(bt, I.kick, 1.0);
    ev(bt + 1, I.kick, 0.9); ev(bt + 0.5, I.hat, 0.9, true); ev(bt + 1.5, I.hat, 0.7);
    for (let i = 0; i < 8; i++) ev(bt + i * 0.25, I.bass, ch.r + (i % 2 ? 12 : 0), BEAT * 0.2, i % 4 === 0 ? 1 : 0.7);
    ev(bt, I.pad, ch.s, BEAT * 2, 0.8);
  }
  ev(36, I.crash, 0.7);
  ev(35.3, I.whoosh, 0.8, 0.8, -0.6);            // the spin winds up
  for (let i = 0; i < 6; i++) ev(39 + i * 0.16, I.tom, [55, 52, 50, 47, 45, 43][i], 0.8);

  // ---- bars 10-11 (40-48): the feet. The band thins to snaps and taps; an upright walks underneath.
  ev(40, I.crash, 0.6);
  const up = [31, 34, 36, 38, 39, 38, 36, 34];
  for (let i = 0; i < 8; i++) ev(40 + i, I.upright, up[i], 0.95);
  for (let i = 0; i < 16; i++) {
    ev(40.5 + i * 0.5, i % 2 ? I.snap : I.hat, i % 2 ? 0.8 : 0.5);      // taps on the eighth notes, left then right
    if (i % 4 === 0) ev(40.5 + i * 0.5 + 0.25, I.hat, 0.35);

  for (let q = 0; q < 8; q++) ev(40 + q, I.kick, 0.55);
  ev(40, I.pad, CHD.Gm.s, BEAT * 4, 0.6); ev(44, I.pad, CHD.Cm.s, BEAT * 4, 0.6);
  for (const [bt, n] of [[41, 79], [43, 77], [45, 75], [47, 74]]) ev(bt + 0.5, I.piano, n, BEAT * 0.8, 0.7);
  ev(46, I.riser, BEAT * 2, 0.6);
  for (let i = 0; i < 6; i++) ev(46 + i * 0.33, I.snap, 0.5 + i * 0.1);

  // ---- bar 12 (48-50): everything stops. One low hit as he drops, then a held chord and a heartbeat.
  ev(47.9, I.timp, 38, 1.1); ev(47.9, I.tom, 36, 1.0);
  ev(48.4, I.pad, [50, 55, 58, 62, 65], BEAT * 3.4, 1.0);

  ev(50, I.timp, 31, 1.2); ev(50, I.crash, 0.55);

  ev(53.6, I.stab, [43, 55, 58, 62, 67, 70], BEAT * 1.6, 1.3);
  ev(53.6, I.brass, 79, BEAT * 1.6, 1.15); ev(53.6, I.brass, 74, BEAT * 1.6, 0.9);
  ev(53.6, I.bass, 31, BEAT * 1.6, 1.1);

buildScore();

// Beat-accurate hit lists for the picture: lights, stars and camera answer the drums.
const HITS = { kick: [], snare: [], hat: [], crash: [], clap: [], pluck: [], snap: [] };
for (const e of SCORE) {
  const k = e.fn === I.kick ? 'kick' : e.fn === I.snare ? 'snare' : e.fn === I.hat ? 'hat' : e.fn === I.crash ? 'crash' : e.fn === I.clap ? 'clap' : e.fn === I.pluck ? 'pluck' : e.fn === I.snap ? 'snap' : null;
  const v = k === 'pluck' ? e.a[1] : e.a[0];     // (a pluck's first argument is its note)
  if (k) HITS[k].push([e.t, typeof v === 'number' ? v : 1]);
}
// every hit of a kind in the last `span` seconds: [[age, strength, index], ...]
function recentHits(kind, t, span) {
  const L = HITS[kind], out = [];
  let lo = 0, hi = L.length - 1, k = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (L[m][0] <= t + 1e-4) { k = m; lo = m + 1; } else hi = m - 1; }
  for (let i = k; i >= 0 && t - L[i][0] < span; i--) out.push([t - L[i][0], L[i][1], i]);
  return out;
}
// strength of the most recent hit of a kind, decaying with time constant `decay` (s)
function hitPulse(kind, t, decay) {
  const L = HITS[kind];
  let lo = 0, hi = L.length - 1, k = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (L[m][0] <= t + 1e-4) { k = m; lo = m + 1; } else hi = m - 1; }
  if (k < 0) return 0;
  return L[k][1] * Math.exp(-(t - L[k][0]) / decay);
}

// his mouth, following whatever he is singing
function voiceMouth(t) {
  for (const [a, e] of VOICE) {
    if (t >= a - 0.03 && t <= e + 0.08) {
      const k = smoothstep(a - 0.03, a + 0.04, t) * (1 - smoothstep(e - 0.02, e + 0.08, t));
      const syl = 0.62 + 0.38 * Math.abs(Math.sin(Math.PI * (t - a) / (BEAT * 0.5)));
      return 0.18 + 0.72 * k * syl;
    }
  }
  return 0.12;
}

// ---------------------------------------------------------------- transport
// Piece time t is ctxTime - t0. Events are scheduled a quarter of a second ahead.
function audioStart(pieceNow) {
  if (!AUDIO.ctx && !audioSetup()) return false;
  const ctx = AUDIO.ctx;
  if (ctx.state === 'suspended') ctx.resume();
  audioAnchor(pieceNow);
  AUDIO.running = true;
  audioPump();
  return true;
}
// line the score up so that piece time `pieceNow` is heard now; skip anything already past
function audioAnchor(pieceNow) {
  const ctx = AUDIO.ctx;
  AUDIO.t0 = ctx.currentTime - pieceNow;
  const tp = pieceNow < 0 ? pieceNow : modT(pieceNow);
  AUDIO.loop = pieceNow < 0 ? 0 : Math.floor(pieceNow / DUR);
  let i = 0;
  while (i < SCORE.length && SCORE[i].t < tp - 1e-6) i++;
  if (i >= SCORE.length) { i = 0; AUDIO.loop++; }
  AUDIO.idx = i;
}
function audioPump() {
  if (!AUDIO.running) return;
  const ctx = AUDIO.ctx, now = ctx.currentTime, horizon = now + 0.25;
  for (let guard = 0; guard < 4000; guard++) {
    const e = SCORE[AUDIO.idx];
    const when = AUDIO.t0 + AUDIO.loop * DUR + e.t;
    if (when > horizon) break;
    if (when > now - 0.03) { try { e.fn(Math.max(when, now), ...e.a); } catch (err) { /* keep the band playing */ } }
    AUDIO.idx++;
    if (AUDIO.idx >= SCORE.length) { AUDIO.idx = 0; AUDIO.loop++; }
  }
}
function audioPieceTime() {
  const ctx = AUDIO.ctx;
  let ct = ctx.currentTime;
  if (ctx.getOutputTimestamp) {
    const ts = ctx.getOutputTimestamp();
    if (ts && ts.contextTime > 0) ct = ts.contextTime + Math.max(0, (performance.now() - ts.performanceTime) / 1000);
  }
  return ct - AUDIO.t0;
}
function audioMute(m) {
  if (!AUDIO.ctx) return;
  AUDIO.muted = m;
  AUDIO.master.gain.setTargetAtTime(m ? 0 : 0.8, AUDIO.ctx.currentTime, 0.05);
}
setInterval(audioPump, 50);

// ---- 90-main.js
// ============================================================
// Frame orchestration, clock, input and the test hooks
// ============================================================
const bufBGd = new StrokeBuf(), bufSH = new StrokeBuf(), bufFG = new StrokeBuf();
let setsBuilt = false;
const STATS = { frames: 0, lastMs: 0, strokes: 0, verts: 0 };
const DARKGROUND = [0.03, 0.025, 0.04];
const NOPOOL = [-1e5, -1e5, 1, 1];
const pieceT = T => modT(T);

// flashes on the big hits: [beat, colour, strength, decay per beat]
const FLASHES = [[16, [1.0, 0.85, 0.6], 0.3, 6], [32, [1, 0.95, 0.85], 0.22, 7], [36, [1, 0.95, 0.85], 0.2, 7], [50, [0.8, 0.9, 1], 0.25, 5]];
function flashAt(b) {
  let best = [0, 0, 0, 0];
  for (const [b0, c, k, d] of FLASHES) {
    if (b < b0 || b > b0 + 2) continue;
    const a = k * Math.exp(-(b - b0) * d);
    if (a > best[3]) best = [c[0], c[1], c[2], a];
  }
  return best;
}
function baseComposite(o) {
  return Object.assign({
    amb: [1, 1, 1], wCol: [0, 0, 0], cCol: [0, 0, 0], ground: DARKGROUND,
    wPool: NOPOOL, wPool2: NOPOOL, cPool: NOPOOL, cPool2: NOPOOL,
    grain: 0, relief: 2.1, floorY: -1, time: 0, refl: 0, waterY: -1,
    pop: 0, grid: 1, popSeed: 0, gal: 0, frame: [0, 0, 1, 1],
    galAmb: [0.5, 0.45, 0.42], galWarm: [0, 0, 0], galPool: NOPOOL,
    flash: [0, 0, 0, 0], fade: 0, vig: 0.9
  }, o);
}

function renderFrame(tp) {
  const t0ms = performance.now();
  glResize();
  if (!setsBuilt) { buildSets(); setsBuilt = true; }
  const t = pieceT(tp), b = t / BEAT;
  G.t = t; G.b = b;
  const cast = castAt(t);
  const lead = cast[0].J;
  const cam = cameraAt(t);
  const Ls = lightsFor(b);
  G.cam = cam; G.tint = LOOK.tint; G.rimW = LOOK.rimW; G.rimC = LOOK.rimC; G.pop = false; G.wI = Ls.wI; G.cI = Ls.cI;
  const camProj = p => project(cam, p);

  // ---- moving atmosphere on top of the static room
  G.mode = 'paint'; G.layer = 'bg'; G.mid = 0;
  G.buf = bufBGd; bufBGd.reset(); G.proj = camProj; G.boil = Math.floor(t * 6); G.jit = 0.5; G.rev = null;
  drawSmoke(t, b, cam, lead);

  // ---- floor shadows from the follow-spot
  G.buf = bufSH; bufSH.reset(); G.mode = 'mask'; G.layer = 'sh'; G.rev = null; G.boil = Math.floor(t * 12);
  if (spotOn(b) > 0.05) {
    for (const c of cast) {
      G.maskCol = [1, 0, 0]; G.proj = p => projectShadow(cam, Ls.w, p, 0);
      drawSilSuit(c.J);
    }
  }

  // ---- the people, far to near
  G.buf = bufFG; bufFG.reset(); G.mode = 'paint'; G.layer = 'fg'; G.proj = camProj;
  G.boil = Math.floor(t * 12); G.jit = REDUCED ? 0.35 : 0.7; G.rev = null;
  const order = cast.slice().sort((p, q) => p.J.pelvis.z - q.J.pelvis.z);
  for (const c of order) {
    const J = c.J;
    G.wDir = vnorm(V(Ls.w.x - J.chest.x, Math.max(60, Ls.w.y - J.chest.y), Ls.w.z - J.chest.z));
    G.cDir = vnorm(V(Ls.c.x - J.chest.x, Math.max(30, Ls.c.y - J.chest.y), Ls.c.z - J.chest.z));
    drawSuit(J, c.style);
  }
  G.mid = 0;

  // ---- GPU passes
  const vp = camVP(cam), boilBG = Math.floor(t * (REDUCED ? 2 : 6));
  glDrawStrokes(SET.club, T_BG, { world: true, vp, boil: boilBG, jit: 0.6, tIn: 1e4, tOut: -1e4 });
  glDrawStrokes(bufBGd, T_BG, { noClear: true, tIn: t, tOut: t });
  glDrawStrokes(bufSH, T_SH, { mask: true, tIn: t, tOut: t });
  glDrawStrokes(bufFG, T_FG, { tIn: t, tOut: t });

  // ---- composite: a dim warm room, a cool wash from the windows, one hard warm pool where he stands
  const U = baseComposite({ time: t, grain: (Math.floor(t * 12) % 61) * 1.37, flash: flashAt(b), relief: 2.3, vig: 0.95 });
  const on = spotOn(b);
  const [lx, lz] = leadXZ(b - 0.25);
  const spotR = 1 - 0.22 * smoothstep(49.6, 50.6, b);           // the iris closes a little for the lean
  const pulse = 0.5 + 0.5 * hitPulse('kick', t, 0.18);
  Object.assign(U, {
    amb: [0.36, 0.26, 0.25],
    wCol: scalec([1.55, 1.16, 0.78], on), cCol: [0.30 + 0.05 * pulse, 0.56 + 0.05 * pulse, 1.0],
    wPool: poolAt(cam, V(lx, 0, lz + 6), 165 * spotR, 52 * spotR),
    wPool2: poolAt(cam, V(lx, 105, WALL_Z + 6), 120 * spotR, 190 * spotR),
    cPool: poolAt(cam, V(-60, 200, WALL_Z), 560, 230),
    cPool2: poolAt(cam, V(120, 0, -40), 340, 62),
    refl: 0.42,
    floorY: CH - project(cam, V(lx, 0, lz + 2)).y
  });
  // fade up from black, and down to black at the very end
  U.fade = Math.max(1 - smoothstep(0, 1.1, t), smoothstep(DUR - 0.9, DUR - 0.05, t));
  // a breath of exposure on the backbeat
  const sn = Math.max(hitPulse('snare', t, 0.09), hitPulse('clap', t, 0.09));
  if (0.03 * sn > U.flash[3]) U.flash = [1, 0.94, 0.86, 0.03 * sn];
  glComposite(U);
  STATS.frames++;
  STATS.lastMs = performance.now() - t0ms;
  STATS.strokes = bufBGd.count + bufSH.count + bufFG.count + SET.club.count;
  STATS.verts = bufBGd.nv + bufSH.nv + bufFG.nv + SET.club.nv;
}

// ============================================================
// Clock, input, hooks
// ============================================================
const QS = new URLSearchParams(location.search);
const FIXED_T = QS.has('t') ? parseFloat(QS.get('t')) : null;
let mode = QS.has('autoplay') ? 'play' : 'ready';
let startMs = mode === 'play' ? performance.now() : null;
let errors = 0, paused = false, pausedAt = 0;

function start() {
  if (mode !== 'ready') { if (AUDIO.ctx && AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume(); return; }
  mode = 'play';
  startMs = performance.now();
  try { audioStart(0); } catch (e) { console.warn('audio unavailable', e); AUDIO.running = false; }
}
cv.addEventListener('pointerdown', start);
cv.addEventListener('dblclick', () => {
  const d = document;
  if (d.fullscreenElement) d.exitFullscreen && d.exitFullscreen();
  else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
});
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') audioMute(!AUDIO.muted);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); start(); }
});

// Picture time follows the audio clock while the music is playing; otherwise the page clock.
let audioWasRunning = false;
function nowPieceTime(now) {
  const tPerf = (now - startMs) / 1000;
  const running = AUDIO.running && AUDIO.ctx && AUDIO.ctx.state === 'running';
  if (running && !audioWasRunning && Math.abs(audioPieceTime() - tPerf) > 0.08) audioAnchor(tPerf);
  audioWasRunning = running;
  if (!running) return tPerf;
  const ta = audioPieceTime();
  startMs = now - ta * 1000;
  return ta;
}
function tick(now) {
  if (paused) return;
  try {
    if (mode === 'ready') renderFrame(0);
    else { audioPump(); renderFrame(nowPieceTime(now)); }
  } catch (e) { if (errors++ < 3) console.error(e); }
  requestAnimationFrame(tick);
}
window.__rick = {
  render: t => { renderFrame(t); return STATS; },
  stats: () => STATS,
  pause: () => { if (!paused) { paused = true; pausedAt = performance.now(); } },
  resume: () => { if (paused) { paused = false; if (startMs !== null) startMs += performance.now() - pausedAt; requestAnimationFrame(tick); } },
  score: () => SCORE.length,
  audioWav: (sr, peakDb) => audioRenderWav(sr, peakDb),
  audio: async (b0, b1, only) => { const r = await audioMeasure(b0, b1, only); window.__mix = r.buf; delete r.buf; return r; },
  // debug contact sheet: render piece times into a grid over the page
  sheet: (times, cols, scale) => {
    cols = cols || 4; scale = scale || 0.25;
    const w = Math.round(CW * scale), h = Math.round(CH * scale), rows = Math.ceil(times.length / cols);
    let c = document.getElementById('__sheet');
    if (!c) { c = document.createElement('canvas'); c.id = '__sheet'; c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#111;z-index:9'; document.body.appendChild(c); }
    c.width = w * cols; c.height = h * rows;
    const x = c.getContext('2d');
    x.font = `${Math.round(h * 0.07)}px sans-serif`;
    times.forEach((t, i) => {
      renderFrame(t);
      x.drawImage(cv, (i % cols) * w, Math.floor(i / cols) * h, w, h);
      x.fillStyle = '#ff0'; x.fillText(`t=${t.toFixed(2)}  b=${(t / BEAT).toFixed(1)}`, (i % cols) * w + 6, Math.floor(i / cols) * h + h * 0.09);
    });
    return times.length;
  },
  unsheet: () => { const c = document.getElementById('__sheet'); if (c) c.remove(); },
  zoom: (t, fx0, fy0, fx1, fy1) => {
    renderFrame(t);
    let c = document.getElementById('__sheet');
    if (!c) { c = document.createElement('canvas'); c.id = '__sheet'; c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#111;z-index:9'; document.body.appendChild(c); }
    const sx = fx0 * CW, sy = fy0 * CH, sw = (fx1 - fx0) * CW, sh = (fy1 - fy0) * CH;
    c.width = Math.round(sw); c.height = Math.round(sh);
    c.getContext('2d').drawImage(cv, sx, sy, sw, sh, 0, 0, c.width, c.height);
    return [c.width, c.height];
  }
};
if (FIXED_T !== null && isFinite(FIXED_T)) { mode = 'fixed'; renderFrame(FIXED_T); }
else requestAnimationFrame(tick);

</script>
