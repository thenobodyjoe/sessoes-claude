// ---- 02-load.js
// ============================================================
// Fonts and the logo atlas. Nothing renders until both are decoded, so the very first frame is
// already set in Poppins (a font swap mid-render would show up as a jump in the video).
// ============================================================
const ASSETS = { ready: false, atlas: null, glyph: {} };

async function loadAssets() {
  const faces = Object.keys(FONT_SRC).map(w => new FontFace('Poppins', `url(${FONT_SRC[w]})`, { weight: w, style: 'normal' }));
  await Promise.all(faces.map(f => f.load().then(ff => document.fonts.add(ff))));
  const img = new Image();
  img.src = LOGO_ATLAS_SRC;
  await img.decode();
  ASSETS.atlas = img;
  for (const g of LOGO_GLYPHS) ASSETS.glyph[g.name] = g;
  // touch every weight once so the rasteriser has them before frame 0
  const c = document.createElement('canvas').getContext('2d');
  for (const w of Object.keys(FONT_SRC)) { c.font = `${w} 40px Poppins`; c.fillText('ÁÉÍÓÚÃÕÇ Ranking 0123456789', 0, 40); }
  ASSETS.ready = true;
}

const FONT = (w, s) => `${w} ${s}px Poppins`;

// ---- 10-morph.js
// ============================================================
// Metamorphic shapes. Every shape is the same number of points, resampled by arc length, starting
// at the top and running clockwise, so any two can be blended point by point: a circle can become a
// rhombus, a bar, a star or the dome of the Congress, and the morph always turns the same way round.
// ============================================================
const NP = 160;

function resample(verts) {
  // verts: [[x, y], ...] closed polyline (dense enough to be the real outline)
  const n = verts.length, cum = new Float64Array(n + 1);

// the animation will be built by moving into and out of these.

// a crowd of politicians in rows receding into the fog. kind(i, row) -> 'human' | 'wolf' | 'lamb'
function crowd(ctx, t, kind, o) {
  o = o || {};
  const rows = [];
  let y = o.front || 1560, s = o.s0 || 1.0;
  for (let r = 0; r < (o.rows || 7); r++) { rows.push({ y, s }); y -= 205 * s * 0.92; s *= 0.8; }
  const r = mulberry(o.seed || 3);
  let idx = 0;
  for (let ri = rows.length - 1; ri >= 0; ri--) {
    const { y, s } = rows[ri];
    const pitch = 236 * s, n = Math.ceil(W / pitch) + 2, x0 = W / 2 - (n - 1) * pitch / 2 + (ri % 2 ? pitch / 2 : 0);
    const fog = Math.pow(0.72, ri);
    for (let i = 0; i < n; i++) {
      const x = x0 + i * pitch + (r() - 0.5) * 18 * s, yy = y + (r() - 0.5) * 10 * s, v = Math.floor(r() * 5 + ri * 3 + i), rr = r();
      const k = kind(idx++, ri, x, yy, rr);
      const lw = Math.max(1.4, 3.2 * s);
      const bg = mix(D.void, D.ink, 0.5);
      ctx.save();
      ctx.globalAlpha = 0.25 + 0.75 * fog;
      if (k === 'human') {
        if (o.shadowWolves && rr < 0.35 && ri < 3) {
          // the shadow on the wall gives it away
          ctx.save(); ctx.globalAlpha *= 0.55;
          fillAt(ctx, WOLF.head, x + 26 * s, yy - 58 * s, s * 0.86, rgba(D.wine, 0.8));
          ctx.restore();
        }
        human(ctx, x, yy, { s, lw, variant: v, color: mix(D.ash, D.bone, fog), bg });
      } else if (k === 'wolf') wolf(ctx, x, yy, { s, lw, variant: v, color: mix(D.wine, D.red, fog), bg, eyeGlow: 12 + 14 * fog });
      else lamb(ctx, x, yy, { s, lw, variant: v, color: D.lamb, bg, glow: 14 * fog });
      ctx.restore();
    }
  }
  // fog toward the back
  const g = ctx.createLinearGradient(0, rows[rows.length - 1].y - 200, 0, rows[2].y);
  g.addColorStop(0, rgba(D.void, 0.95)); g.addColorStop(1, rgba(D.void, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, rows[2].y);
}
const isLamb = rr => rr > 0.8;          // about one in five
const CROWD = { front: 1640, s0: 1.15, rows: 7, seed: 3 };

// small label with lines either side
function kicker(ctx, text, y, color, size) {
  ctx.save();
  ctx.font = FONT(700, size || 30); ctx.textAlign = 'center'; ctx.fillStyle = color;
  const L = layoutLine(ctx, text, 700, size || 30, 6);
  const x0 = W / 2 - L.w / 2;
  for (let i = 0; i < text.length; i++) ctx.fillText(text[i], x0 + L.xs[i] + L.ws[i] / 2, y);
  ctx.fillStyle = color; ctx.globalAlpha *= 0.7;
  ctx.fillRect(x0 - 110, y - 11, 80, 3); ctx.fillRect(x0 + L.w + 30, y - 11, 80, 3);
  ctx.restore();
}
function tag(ctx, text, x, y, fill, color, size, align) {
  ctx.save();
  ctx.font = FONT(800, size || 30);
  const w = ctx.measureText(text).width + (size || 30) * 1.2, h = (size || 30) * 1.7;
  const x0 = align === 'left' ? x : align === 'right' ? x - w : x - w / 2;
  ctx.fillStyle = fill; rrect(ctx, x0, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x0 + w / 2, y + 2);
  ctx.restore();
  return w;
}

      ctx.beginPath(); ctx.moveTo(gx - 18, gy); ctx.lineTo(gx + 18, gy - 20); ctx.moveTo(gx - 18, gy); ctx.lineTo(gx + 18, gy + 20); ctx.stroke();
      for (const [px, py] of [[gx - 18, gy], [gx + 18, gy - 20], [gx + 18, gy + 20]]) { ctx.beginPath(); ctx.arc(px, py, 10, 0, TAU); ctx.fill(); }
      ctx.restore();
      ctx.save(); ctx.font = FONT(800, 60); ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('ranking.org.br', 540, 1330); ctx.restore();
      ctx.save(); ctx.font = FONT(500, 38); ctx.textAlign = 'center'; ctx.fillStyle = C.mute; ctx.fillText('Consulte antes de votar.', 540, 1400); ctx.restore();
      // the flock, safe
      for (let i = 0; i < 7; i++) lamb(ctx, 110 + i * 143, 1610 + (i % 2) * 18, { s: 0.42, lw: 2.6, body: false, color: C.green, a: 0.85 });
    } },
];

// ---- 70-post.js
// ============================================================
// The lens: the 2D scene is uploaded as a texture and finished on the GPU. Real motion blur
// (several sub-frames accumulated inside the shutter), chromatic aberration that spikes on the hits,
// a bright-pass bloom, flashes, scanline glitches for the failing lamp, vignette and film grain.
// ============================================================
const GL = {};
const VS = `#version 300 es
in vec2 p; out vec2 vUv;
void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
const FS_ACC = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform float uW;
in vec2 vUv; out vec4 o;
void main() { o = vec4(texture(uTex, vUv).rgb * uW, 1.0); }`;
const FS_POST = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime, uCA, uGrain, uVig, uGlitch, uBloom, uSeed;
uniform vec4 uFlash;
in vec2 vUv; out vec4 o;
float h(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main() {
  vec2 uv = vUv;
  if (uGlitch > 0.0) {
    float band = floor(uv.y * 54.0);
    if (h(vec2(band, uSeed)) < uGlitch * 0.55) uv.x += (h(vec2(band * 1.37, uSeed + 3.1)) - 0.5) * 0.14 * uGlitch;
  }
  vec2 d = uv - 0.5;
  float ca = uCA * (0.35 + 2.2 * dot(d, d));
  vec3 col;
  col.r = texture(uTex, uv + d * ca).r;
  col.g = texture(uTex, uv).g;
  col.b = texture(uTex, uv - d * ca).b;
  // bloom from the mip chain: smooth, wide, and cheap
  vec3 bl = max(textureLod(uTex, uv, 3.0).rgb - 0.5, 0.0) * 0.5
          + max(textureLod(uTex, uv, 4.5).rgb - 0.42, 0.0) * 0.6
          + max(textureLod(uTex, uv, 6.0).rgb - 0.35, 0.0) * 0.7;
  col += bl * uBloom;
  float v = smoothstep(1.0, 0.28, length(d * vec2(1.0, 0.82)) * 1.32);
  col *= mix(1.0, v, uVig);
  col = mix(col, uFlash.rgb, uFlash.a);
  col += (h(uv * uRes + fract(uTime * 7.13)) - 0.5) * uGrain;
  o = vec4(col, 1.0);
}`;

function glInit(canvas) {
  const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });
  if (!gl) throw new Error('WebGL2 is not available');
  GL.gl = gl;
  const sh = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = fs => {
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
    return { p, u };
  };
  GL.acc = prog(FS_ACC); GL.post = prog(FS_POST);
  const vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const tex = fmt => {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (fmt) gl.texImage2D(gl.TEXTURE_2D, 0, fmt[0], W, H, 0, fmt[1], fmt[2], null);
    return t;
  };
  GL.scene = tex(null);
  // accumulation buffer: half-float when the GPU can render to it, else 8-bit
  const hf = gl.getExtension('EXT_color_buffer_float');
  GL.accTex = tex(hf ? [gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT] : [gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE]);
  GL.fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, GL.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, GL.accTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  GL.halfFloat = !!hf;
}
function glUpload(src) {
  const gl = GL.gl;
  gl.bindTexture(gl.TEXTURE_2D, GL.scene);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
}
function glAccumulate(first, w) {
  const gl = GL.gl;
  gl.bindFramebuffer(gl.FRAMEBUFFER, GL.fbo);
  gl.viewport(0, 0, W, H);
  if (first) { gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(GL.acc.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, GL.scene);
  gl.uniform1i(GL.acc.u.uTex, 0); gl.uniform1f(GL.acc.u.uW, w);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
function glPost(fromAcc, P) {
  const gl = GL.gl;
  gl.viewport(0, 0, W, H);
  gl.useProgram(GL.post.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fromAcc ? GL.accTex : GL.scene);
  gl.generateMipmap(gl.TEXTURE_2D);
  const u = GL.post.u;
  gl.uniform1i(u.uTex, 0);
  gl.uniform2f(u.uRes, W, H);
  gl.uniform1f(u.uTime, P.time); gl.uniform1f(u.uCA, P.ca); gl.uniform1f(u.uGrain, P.grain);
  gl.uniform1f(u.uVig, P.vig); gl.uniform1f(u.uGlitch, P.glitch); gl.uniform1f(u.uBloom, P.bloom);
  gl.uniform1f(u.uSeed, P.seed);
  gl.uniform4f(u.uFlash, P.flash[0], P.flash[1], P.flash[2], P.flash[3]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// lens settings for a still (dark world: heavier grain and vignette)
function postStill(dark, t) {
  return dark ? { time: t, ca: 0.004, glitch: 0, flash: [0, 0, 0, 0], seed: 1, grain: 0.055, vig: 0.7, bloom: 0.45 }
              : { time: t, ca: 0.0025, glitch: 0, flash: [0, 0, 0, 0], seed: 1, grain: 0.03, vig: 0.45, bloom: 0.5 };
}

// ---- 90-main.js
// ============================================================
// Key-visual viewer: ?kv=N shows frame N (1-based); hooks for tools/keyvisuals.py.
// ============================================================
const cv = document.getElementById('reel');
cv.width = W; cv.height = H;
const SCN = document.createElement('canvas');
SCN.width = W; SCN.height = H;
const sctx = SCN.getContext('2d');

function renderKV(i, t) {
  const k = KV[i];
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.globalAlpha = 1; sctx.globalCompositeOperation = 'source-over'; sctx.shadowBlur = 0;
  sctx.textAlign = 'left'; sctx.textBaseline = 'alphabetic';
  k.draw(sctx, t || 2.0);
  glUpload(SCN);
  glPost(false, postStill(k.dark, t || 2.0));
}

window.__kv = {
  ready: () => ASSETS.ready,
  count: () => KV.length,
  meta: () => KV.map(k => ({ id: k.id, time: k.time, say: k.say })),
  render: (i, t) => { renderKV(i, t); return cv.toDataURL('image/png'); },
};
glInit(cv);
loadAssets().then(() => {
  const q = new URLSearchParams(location.search);
  renderKV(Math.max(0, (parseInt(q.get('kv') || '1', 10) || 1) - 1), 2.0);
}).catch(e => console.error(e));

</script>
