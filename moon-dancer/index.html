<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lunar Nocturne</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0910; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="paint" role="img" aria-label="A one-minute moving oil painting with music. It opens as a calm lunar nocturne with Earth rising over a still moon sea, until an astronaut in a long white space-coat and a retro cap rises out of the water and dances through a station airlock, a pop-art print grid, a theatre where his shadow goes rogue, and a swirling starry night, before the whole thing turns out to be a framed painting in a gallery. Click to start with sound."></canvas>
<script>
// ---- 00-core.js
"use strict";
// ============================================================
// Timing: 30 bars of 4/4 at 112 BPM = 64.3 s.
// Piece time t runs 0..60 and loops. On the very first play it starts
// at -INTRO, while the title lifts off and the nocturne paints itself in.
// ============================================================
const TAU = Math.PI * 2;
const BPM = 112;
const BEAT = 60 / BPM;
const BAR = 4 * BEAT;
const NBARS = 30;
const NBEATS = NBARS * 4;
const DUR = NBARS * BAR;
const INTRO = 1.9;
// stroke paint-in / lift-off sentinels: 'always painted' and 'never lifted'
const NO_IN = -1e4, NO_OUT = 1e4;
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const seg = (x, a, b) => clamp((x - a) / (b - a), 0, 1);
const hash = n => { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const modT = t => ((t % DUR) + DUR) % DUR;

// easing
function easeInOutBack(t, s) {
  const c = (s === undefined ? 1.2 : s) * 1.525;
  t *= 2;
  if (t < 1) return (t * t * ((c + 1) * t - c)) / 2;
  t -= 2;
  return (t * t * ((c + 1) * t + c) + 2) / 2;
}
function easeOutBack(t, s) {
  const c = s === undefined ? 1.70158 : s;
  t -= 1;
  return t * t * ((c + 1) * t + c) + 1;
}
const easeInOut = t => t * t * (3 - 2 * t);
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const easeInOutCubic = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const bump = (x, c, w) => Math.exp(-((x - c) * (x - c)) / (2 * w * w));

// ---------- 3D vectors (y up, x = screen right, z = toward camera)
const V = (x, y, z) => ({ x, y, z });
const vadd = (a, b) => V(a.x + b.x, a.y + b.y, a.z + b.z);
const vsub = (a, b) => V(a.x - b.x, a.y - b.y, a.z - b.z);
const vmul = (a, s) => V(a.x * s, a.y * s, a.z * s);
const vmad = (a, b, s) => V(a.x + b.x * s, a.y + b.y * s, a.z + b.z * s);
const vdot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const vcross = (a, b) => V(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
const vlen = a => Math.hypot(a.x, a.y, a.z);
const vnorm = a => { const l = vlen(a) || 1; return V(a.x / l, a.y / l, a.z / l); };
const vlerp = (a, b, t) => V(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, a.z + (b.z - a.z) * t);

// ---------- 3x3 rotations, row-major. R = Ry(yaw) * Rx(pitch) * Rz(roll)
// yaw>0 turns the front (+z) toward +x, pitch>0 leans the top toward the camera (nod),
// roll>0 tilts the top toward screen-left.
function rotYXZ(yaw, pitch, roll) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cx = Math.cos(pitch), sx = Math.sin(pitch),
        cz = Math.cos(roll), sz = Math.sin(roll);
  return [
    cy * cz + sy * sx * sz, -cy * sz + sy * sx * cz, sy * cx,
    cx * sz, cx * cz, -sx,
    -sy * cz + cy * sx * sz, sy * sz + cy * sx * cz, cy * cx
  ];
}
const mv = (m, v) => V(m[0] * v.x + m[1] * v.y + m[2] * v.z, m[3] * v.x + m[4] * v.y + m[5] * v.z, m[6] * v.x + m[7] * v.y + m[8] * v.z);
const mvT = (m, v) => V(m[0] * v.x + m[3] * v.y + m[6] * v.z, m[1] * v.x + m[4] * v.y + m[7] * v.z, m[2] * v.x + m[5] * v.y + m[8] * v.z);
function mm(a, b) {
  const r = new Array(9);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
    r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j];
  return r;
}
// origin + R * (x,y,z)
const xf = (o, R, x, y, z) => V(o.x + R[0] * x + R[1] * y + R[2] * z, o.y + R[3] * x + R[4] * y + R[5] * z, o.z + R[6] * x + R[7] * y + R[8] * z);

// color helpers
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const scalec = (a, k) => [a[0] * k, a[1] * k, a[2] * k];

// ---- 10-gl.js
// ============================================================
// WebGL2: stroke renderer (MRT colour + paint height) and composite
// ============================================================
const cv = document.getElementById('paint');
const gl = cv.getContext('webgl2', {
  antialias: false, alpha: false, depth: false, stencil: false,
  premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance'
});
if (!gl) {
  document.body.innerHTML = '<p style="color:#cbb;font:16px/1.5 Georgia,serif;padding:2em">This painting needs WebGL2 to move.</p>';
  throw new Error('WebGL2 unavailable');
}
const HAS_CBF = !!gl.getExtension('EXT_color_buffer_float');
cv.addEventListener('webglcontextlost', e => e.preventDefault());
cv.addEventListener('webglcontextrestored', () => location.reload());

const STROKE_VS = `#version 300 es
layout(location=0) in vec3 a_pos;
layout(location=1) in vec2 a_uv;
layout(location=2) in vec4 a_p;
layout(location=3) in vec3 a_rev;
layout(location=4) in vec4 a_col;
layout(location=5) in vec4 a_col2;
layout(location=6) in vec4 a_ex;
uniform vec2 u_res;
uniform mat4 u_vp;
uniform float u_world;
uniform float u_boil;
uniform float u_jit;
out vec2 v_uv; flat out vec4 v_p; flat out vec3 v_rev; out vec4 v_col; flat out vec4 v_col2; flat out vec4 v_ex;
float h11(float n){ return fract(sin(n * 12.9898) * 43758.5453); }
void main(){
  if (u_world > 0.5) {
    vec3 wp = a_pos;
    float s = a_p.z;
    wp.xy += (vec2(h11(s * 7.31 + u_boil * 3.17), h11(s * 3.77 + u_boil * 5.3)) - 0.5) * u_jit;
    gl_Position = u_vp * vec4(wp, 1.0);
  } else {
    vec2 c = a_pos.xy / u_res * 2.0 - 1.0;
    gl_Position = vec4(c.x, -c.y, 0.0, 1.0);
  }
  v_uv = a_uv; v_p = vec4(a_p.x, a_p.y, a_p.z + u_boil * 0.3719, a_p.w); v_rev = a_rev; v_col = a_col; v_col2 = a_col2; v_ex = a_ex;
}`;

// Each stroke carries two delays (s): when its paint goes on and when it lifts off.
// u_tIn / u_tOut are the clocks those delays are measured against, so every painted
// world can be brought in and scraped away on its own schedule.
const STROKE_FS = `#version 300 es
precision highp float;
in vec2 v_uv; flat in vec4 v_p; flat in vec3 v_rev; in vec4 v_col; flat in vec4 v_col2; flat in vec4 v_ex;
uniform float u_mask;
uniform float u_tIn, u_tOut;
layout(location=0) out vec4 o_col;
layout(location=1) out vec4 o_hgt;
float h11(float n){ return fract(sin(n * 12.9898) * 43758.5453); }
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1,0)), u.x), mix(h21(i + vec2(0,1)), h21(i + vec2(1,1)), u.x), u.y); }
float ease(float x){ x = clamp(x, 0.0, 1.0); return x * x * (3.0 - 2.0 * x); }
void main(){
  float k = v_rev.z;                  // stroke units -> css px
  float W = max(v_p.y * k, 0.5);      // stroke width, css px
  float u = v_uv.x * k;               // distance along stroke, css px
  float Lc = v_p.x * k;
  float v = v_uv.y;                   // across, -1.15..1.15
  float av = abs(v);
  float seed = mod(v_p.z, 97.0), th = v_p.w;
  float kind = floor(v_ex.z * 255.0 + 0.5);
  float dry = v_col2.a;
  float aa = max(fwidth(v), 0.002) * 1.1;
  float t = clamp(u / max(Lc, 1.0), 0.0, 1.0);
  float bIn = v_rev.x < -5000.0 ? 1.0 : ease((u_tIn - v_rev.x) / 0.3);
  float aOut = v_rev.y > 5000.0 ? 0.0 : ease((u_tOut - v_rev.y) / 0.30);
  float uA = aOut * Lc, uB = bIn * Lc;
  if (u < uA || u > uB || uB <= uA) discard;
  float cov, br, streak, bid;
  if (kind < 0.5) {
    float nb = clamp(W * 0.3, 4.0, 60.0);
    float bx = (v * 0.5 + 0.5) * nb;
    bid = floor(bx);
    float bs = smoothstep(0.0, 1.0, fract(bx));
    float b1 = mix(h11(bid * 1.713 + seed * 17.17), h11((bid + 1.0) * 1.713 + seed * 17.17), bs);
    float b2 = vn(vec2(bx * 0.3, seed * 3.1));
    streak = vn(vec2(u / (W * 1.4 + 8.0) + seed * 5.3, bx * 0.55 + seed));
    br = clamp(b1 * 0.32 + b2 * 0.33 + streak * 0.5 - 0.07, 0.0, 1.0);
    float side = step(0.0, v);
    float en = vn(vec2(u / (W * 1.1 + 6.0), seed * 9.1 + side * 7.0));
    float edge = 1.0 - 0.13 * en - 0.05 * dry;
    float ez = smoothstep(0.55, 0.97, av);
    float bl = h21(vec2(bid + seed * 13.0, floor(u / (W * 0.7 + 4.0))));
    edge -= ez * step(bl, 0.28 + 0.3 * dry) * 0.3;
    cov = 1.0 - smoothstep(edge - aa, edge + aa, av);
    float thr = dry * (0.1 + 0.95 * smoothstep(0.35, 1.0, t)) - 0.05;
    cov *= smoothstep(thr - 0.06, thr + 0.06, br);
  } else {
    bid = 0.0;
    streak = vn(vec2(u / (W + 10.0), seed));
    br = 0.45 + 0.3 * streak;
    cov = 1.0 - smoothstep(0.15, 1.05, av);
    cov *= cov;
  }
  float sq = 1.0 - v_ex.w;
  float capS = max(W * 0.5 * sq, 1.0);
  float ds = clamp((u - uA) / capS, 0.0, 1.0);
  float allowS = sqrt(ds * (2.0 - ds));
  cov *= 1.0 - smoothstep(allowS - aa, allowS + aa, av);
  float capE = max(W * 0.35 * sq, 1.0);
  float de = clamp((uB - u) / capE, 0.0, 1.0);
  float allowE = sqrt(de * (2.0 - de));
  cov *= 1.0 - smoothstep(allowE - aa, allowE + aa, av);
  float a = v_col.a * cov;
  if (a < 0.004) discard;
  vec3 c;
  if (u_mask > 0.5) {
    c = v_col.rgb;
  } else {
    float load = mix(h11(bid * 3.31 + seed * 7.7), h11((bid + 1.0) * 3.31 + seed * 7.7), smoothstep(0.2, 0.8, fract((v * 0.5 + 0.5) * clamp(W * 0.3, 4.0, 60.0))));
    float m2 = smoothstep(0.4, 0.72, load * 0.6 + streak * 0.5);
    c = mix(v_col.rgb, v_col2.rgb, m2);
    c *= 0.8 + 0.4 * br;
    c *= 1.0 + 0.06 * (1.0 - smoothstep(0.0, 0.15, t));
  }
  o_col = vec4(c * a, a);
  float hg = th * (0.22 + 0.78 * br) * (1.0 - 0.45 * dry * smoothstep(0.4, 1.0, t)) + th * 0.45 * smoothstep(0.62, 0.98, av);
  o_hgt = vec4(hg * a, v_ex.x * a, v_ex.y * a, a);
}`;

const COMP_VS = `#version 300 es
void main(){
  vec2 p = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0);
  gl_Position = vec4(p, 0.0, 1.0);
}`;

// Pop-art palettes, 10 inks each: 0 ground, 1 coat, 2 coat lining, 3 black clothes, 4 skin,
// 5 hair, 6 mic/shoes, 7 key-line ink, 8 lips, 9 whites.
const POP_PALETTES = [
  [[0.97, 0.35, 0.6], [1.0, 0.87, 0.18], [0.98, 0.52, 0.12], [0.13, 0.2, 0.62], [1.0, 0.74, 0.7], [1.0, 0.45, 0.1], [0.85, 0.88, 0.95], [0.07, 0.05, 0.12], [0.9, 0.1, 0.2], [1.0, 1.0, 0.96]],
  [[0.2, 0.8, 0.8], [1.0, 0.38, 0.62], [0.7, 0.12, 0.45], [0.1, 0.1, 0.3], [1.0, 0.9, 0.35], [1.0, 0.72, 0.08], [0.95, 0.95, 1.0], [0.08, 0.05, 0.1], [0.95, 0.15, 0.35], [1.0, 1.0, 0.96]],
  [[1.0, 0.55, 0.1], [0.3, 0.85, 0.85], [0.05, 0.5, 0.55], [0.35, 0.12, 0.55], [1.0, 0.62, 0.72], [1.0, 0.92, 0.2], [0.9, 0.92, 0.98], [0.08, 0.04, 0.12], [0.85, 0.05, 0.25], [1.0, 1.0, 0.96]],
  [[1.0, 0.9, 0.22], [0.92, 0.16, 0.18], [0.55, 0.05, 0.12], [0.06, 0.07, 0.15], [1.0, 0.86, 0.76], [1.0, 0.5, 0.1], [0.8, 0.85, 0.95], [0.06, 0.04, 0.08], [0.9, 0.1, 0.15], [1.0, 1.0, 0.96]],
  [[0.62, 0.9, 0.3], [0.58, 0.32, 0.85], [0.3, 0.12, 0.55], [0.05, 0.3, 0.2], [1.0, 0.68, 0.42], [0.95, 0.2, 0.6], [0.92, 0.92, 0.98], [0.06, 0.05, 0.12], [0.95, 0.1, 0.3], [1.0, 1.0, 0.96]],
  [[0.2, 0.36, 0.92], [1.0, 0.6, 0.18], [0.85, 0.2, 0.1], [0.05, 0.05, 0.08], [1.0, 0.72, 0.8], [1.0, 0.9, 0.25], [0.95, 0.95, 1.0], [0.05, 0.04, 0.1], [0.95, 0.12, 0.25], [1.0, 1.0, 0.96]]
];
const glslVec3 = c => `vec3(${c.map(x => x.toFixed(3)).join(',')})`;
const PAL_GLSL = `const vec3 PAL[60] = vec3[60](${POP_PALETTES.map(p => p.map(glslVec3).join(',')).join(',\n')});`;

const COMP_FS = `#version 300 es
precision highp float;
uniform sampler2D u_bgC, u_bgH, u_fgC, u_fgH, u_sh, u_galC, u_galH;
uniform vec2 u_res;
uniform float u_dpr;
uniform vec3 u_amb, u_wCol, u_cCol, u_ground;
uniform vec4 u_wPool, u_wPool2, u_cPool, u_cPool2;
uniform float u_grain, u_relief, u_floorY, u_time, u_refl, u_waterY;
uniform float u_pop, u_grid, u_popSeed;
uniform float u_gal;
uniform vec4 u_frame;
uniform vec3 u_galAmb, u_galWarm;
uniform vec4 u_galPool;
uniform vec4 u_flash;
uniform float u_fade, u_vig;
out vec4 o;
${PAL_GLSL}
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float pool(vec2 p, vec4 P){
  vec2 d = (p - P.xy) / max(P.zw, vec2(1.0));
  float r = length(d);
  return (1.0 - smoothstep(0.2, 1.0, r)) + 0.35 * (1.0 - smoothstep(0.0, 0.45, r));
}
float waterLine(float x){
  return u_waterY + (sin(x * 0.09 / u_dpr + u_time * 4.0) * 1.3 + sin(x * 0.021 / u_dpr - u_time * 2.1) * 2.0) * u_dpr;
}
// Where to read the dancer layer for this pixel: the pop-art prints are all copies of the
// top-left panel, alternate ones mirrored.
vec2 fgPos(vec2 fc, out float panel){
  panel = 0.0;
  if (u_pop < 0.5 || u_grid < 1.5) return fc;
  vec2 cell = u_res / u_grid;
  vec2 ij = min(floor(fc / cell), vec2(u_grid - 1.0));
  vec2 loc = fc - ij * cell;
  float row = u_grid - 1.0 - ij.y;
  panel = ij.x + row * u_grid;
  if (mod(ij.x + row, 2.0) > 0.5) loc.x = cell.x - loc.x;
  return vec2(loc.x, u_res.y - cell.y + loc.y);
}
// the dancer is hidden below the river surface while he rises out of it
float fgMask(vec2 fc){
  if (u_waterY <= 0.0) return 1.0;
  float wl = waterLine(fc.x);
  return smoothstep(wl - u_dpr, wl + u_dpr, fc.y);
}
float inFrame(vec2 fc){
  if (u_gal < 0.5) return 1.0;
  return step(u_frame.x, fc.x) * step(fc.x, u_frame.z) * step(u_frame.y, fc.y) * step(fc.y, u_frame.w);
}
float hAt(vec2 fc){
  float pn;
  vec2 fp = fgPos(fc, pn);
  vec4 b = texture(u_bgH, fc / u_res);
  vec4 f = texture(u_fgH, fp / u_res) * fgMask(fc);
  float h = (b.r * (1.0 - f.a) + f.r) * inFrame(fc);
  if (u_gal > 0.5) { vec4 g = texture(u_galH, fc / u_res); h = h * (1.0 - g.a) + g.r; }
  return h;
}
vec3 sceneShade(vec2 fc, vec2 uv, vec4 bc, vec4 bh, vec4 fcol){
  vec2 sh = texture(u_sh, uv).rg;
  vec3 alb = bc.rgb + u_ground * (1.0 - bc.a);
  float recv = bh.a > 0.002 ? clamp(bh.g / bh.a, 0.0, 1.0) : 0.0;
  float wp = max(pool(fc, u_wPool), pool(fc, u_wPool2)) * (1.0 - sh.r);
  float cp = max(pool(fc, u_cPool), pool(fc, u_cPool2)) * (1.0 - sh.g);
  vec3 lightC = u_amb + u_wCol * wp + u_cCol * cp;
  vec3 bg = mix(alb, alb * lightC, recv * bc.a);
  // wet ground: a rippled reflection of the dancer below his feet
  float bgGloss = bh.a > 0.002 ? bh.b / bh.a : 0.0;
  float below = u_floorY - fc.y;
  if (below > 0.0 && u_refl > 0.0) {
    float dd = below / u_res.y;
    vec2 rp = vec2(fc.x + sin(fc.y * 0.35 / u_dpr + u_time * 5.0) * 2.5 * u_dpr * (0.3 + dd * 6.0), u_floorY + below * 1.1);
    vec4 rf = texture(u_fgC, rp / u_res) * fgMask(rp);
    float k = u_refl * smoothstep(0.45, 0.65, bgGloss) * (1.0 - smoothstep(0.0, 0.25, dd)) * recv;
    bg = bg * (1.0 - rf.a * k) + rf.rgb * k;
  }
  return bg * (1.0 - fcol.a) + fcol.rgb;
}
vec3 popShade(vec2 fc, vec4 bc, vec4 fcol, vec4 fh, float pn, vec2 fp){
  int base = int(mod(pn + u_popSeed, 6.0)) * 10;
  float bl = bc.a > 0.01 ? dot(bc.rgb / bc.a, vec3(0.3, 0.5, 0.2)) : 0.5;
  vec3 back = PAL[base] * (0.8 + 0.4 * bl);
  vec3 c = back;
  if (fcol.a > 0.003) {
    vec3 g = fcol.rgb / fcol.a;
    float l = dot(g, vec3(0.3, 0.5, 0.2));
    int id = int(clamp(floor(fh.g / max(fh.a, 1e-3) * 10.0 + 0.5), 1.0, 9.0));
    vec3 fcl = PAL[base + id];
    // Ben-Day dots in the shadows
    vec2 q = mat2(0.7071, -0.7071, 0.7071, 0.7071) * (fc / u_dpr);
    float d = length(fract(q / 5.0) - 0.5);
    float shd = id == 4 ? 1.0 - smoothstep(0.12, 0.36, l) : 1.0 - smoothstep(0.22, 0.6, l);

// ============================================================
// Lettering: the browser rasterises the words, and each row of ink becomes one
// sign-painter's stroke. Runs are cached per string/font/size.
// ============================================================
const TEXT_CACHE = new Map();
function textRuns(str, font, size, rows) {
  const key = [str, font, size, rows].join('|');
  if (TEXT_CACHE.has(key)) return TEXT_CACHE.get(key);

  const x = c.getContext('2d');
  const f = font.replace('%', size + 'px');

// ---- 30-rig.js
// ============================================================
// Skeleton: pose parameters -> 3D joints (units: cm, floor at y = 0)
// "M" = the microphone arm (his right, screen left), "F" = free arm (his left, screen right)
// ============================================================
const RIG = {
  pelvisY: 98, waistLen: 14, chestLen: 24, neckLen: 14,
  shoulderX: 19, upperArm: 29, foreArm: 26.5,
  hipX: 9.5, hipY: -4, thigh: 44, shin: 42

function basePose() {
  return {
    px: 0, py: -2.5, pz: 0, pyaw: 0, ppitch: 0, proll: 0,
    ry: 0,                                   // lifts the whole body (feet included): river, jumps
    cyaw: 0, cpitch: 0.03, croll: 0,
    hyaw: 0, hpitch: 0, hroll: 0,
    shM: 0, shF: 0,
    mX: -20, mY: -30, mZ: 14, mPole: 0,
    fX: 20, fY: -30, fZ: 14, fPole: 0,
    fOpen: 0, fPoint: 0, micAim: 0,
    lfx: -15, lfz: 2, lfy: 0, lheel: 0, lfyaw: -0.22,
    rfx: 15, rfz: 2, rfy: 0, rheel: 0, rfyaw: 0.22,
    lkx: -0.3, rkx: 0.3, squash: 0, twirl: 0, twA: 0,
    mouth: 0, smile: 0.5, brow: 0, blink: 0, wink: 0, mO: 0,

// ---- 40-dance.js
// ============================================================
// Choreography: 112 beats at 112 BPM. b = beat index (t / BEAT).
// The signature move is the side-to-side two-step: weight shifts on every

// hips, and the free hand keeps opening and closing. Everything else is built on it.
// ============================================================
const parity = k => ((k % 2) + 2) % 2;

  const lookL = smoothstep(11.75, 12.0, b) * (1 - smoothstep(12.35, 12.55, b));
  const lookR = smoothstep(12.55, 12.8, b) * (1 - smoothstep(13.1, 13.3, b));
  P.hyaw = -0.55 * lookL + 0.55 * lookR;
  P.brow = smoothstep(13.25, 13.45, b) * 1.0 + 0.3 * lookL;
  P.blink = bump(b, 11.45, 0.06) + bump(b, 13.3, 0.05);
  // the jump: arms fly up into a V, legs tuck, then he lands on the downbeat
  const air = smoothstep(14.4, 14.9, b) * (1 - smoothstep(15.55, 16.0, b));
  P.mX = lerp(P.mX, -37, air); P.mY = lerp(P.mY, 44, air); P.mZ = lerp(P.mZ, 12, air);
  P.fX = lerp(P.fX, 37, air); P.fY = lerp(P.fY, 46, air); P.fZ = lerp(P.fZ, 12, air);
  P.fOpen = air;
  const tuck = bump(b, 15.1, 0.28);
  P.lfy = 14 * tuck; P.rfy = 18 * tuck; P.lkx = -0.5; P.rkx = 0.5;
  P.lfx = lerp(-12, -18, air); P.rfx = lerp(12, 18, air);
  P.smile = lerp(0.55, 1, smoothstep(13.3, 14.6, b));
  P.hpitch = -0.12 * air;
  P.squash = 0.06;
  return P;
}

// ---------------------------------------------------------------- moves
function snaps(b, P) {
  twoStep(b, 0.85, P);
  const dp = dip(b), s = sideHit(b);
  // free hand up by the shoulder, a finger snap on every beat
  P.fX = 30 + 3 * s; P.fY = 9 + 3 * dp; P.fZ = 17; P.fPole = 0.3;
  const u = b - Math.floor(b);
  P.fOpen = u > 0.72 ? lerp(1, 0.15, seg(u, 0.72, 0.95)) : smoothstep(0.0, 0.07, u) * 0.85 + 0.15;
  P.shF += 2.2 * bump(u, 0.02, 0.05) + 2.2 * bump(u, 1.02, 0.05);
  P.mX = -9; P.mY = -7 + 2 * dp; P.mZ = 25;
  P.hpitch += 0.07 * dp; P.smile = 1;
  return P;
}

function armRoll(b, P) {
  twoStep(b, 0.8, P);
  const th = TAU * b;   // one roll per beat
  const r = 8.5;
  P.mX = -3 + r * Math.cos(th); P.mY = -11 + r * Math.sin(th); P.mZ = 27; P.mPole = 0.2;
  P.fX = 3 + r * Math.cos(th + Math.PI); P.fY = -11 + r * Math.sin(th + Math.PI); P.fZ = 27; P.fPole = 0.2;
  P.fOpen = 0; P.smile = 1;
  P.hroll += 0.05 * Math.sin(Math.PI * b);
  return P;
}

function sing(b, P, s) {
  twoStep(b, 0.6, P);
  const sd = sideHit(b), sa = sideHit(b, 0.1, 0.3, 0.36, 1.8);
  const dp = dip(b);
  P.mX = -4 + sd * 1.5; P.mY = 15 + dp * 1.5; P.mZ = 17; P.micAim = 1; P.mPole = 0.25;
  P.fX = 37 + 4 * sa; P.fY = 7 + 7 * sa + 3 * dp; P.fZ = 21 - 5 * sa; P.fOpen = 1; P.fPole = 0.25;
  P.hpitch = -0.12 + dp * 0.08; P.hroll = -0.07 + sd * 0.06; P.hyaw = -0.06;
  P.mouth = voiceMouth(b * BEAT);
  P.brow = 0.6;
  const lb = b - s;
  P.blink = 0.92 * smoothstep(1.3, 1.6, lb) * (1 - smoothstep(2.6, 2.9, lb));
  P.smile = 0.35;
  return P;
}

// a full skater's spin in two beats: wind up, whip round with the coat flaring, land facing front
function spin(b, P, s) {
  const lb = b - s;
  twoStep(b, 0.35, P);
  const u = easeInOutCubic(seg(lb, 0.35, 1.55));
  let yaw = -0.4 * bump(lb, 0.22, 0.14) + TAU * u;
  if (u > 0.5) yaw -= TAU;          // same orientation, but lands on yaw = 0 so blends stay put
  P.pyaw = yaw; P.cyaw = -0.12 * Math.sin(Math.PI * u); P.croll = 0; P.proll = 0;
  P.px = 0; P.py = -3 - 4 * Math.sin(Math.PI * u);
  const out = 1 - 0.45 * Math.sin(Math.PI * u);
  P.mX = -40 * out; P.mY = 4; P.mZ = 8; P.fX = 40 * out; P.fY = 4; P.fZ = 8; P.fOpen = 1; P.mPole = 0; P.fPole = 0;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  P.lfx = -11 * cy + 2 * sy; P.lfz = 11 * sy + 2 * cy;
  P.rfx = 11 * cy + 2 * sy; P.rfz = -11 * sy + 2 * cy;
  P.lfyaw = -0.15 + yaw; P.rfyaw = 0.15 + yaw;
  const toes = Math.sin(Math.PI * u);
  P.lheel = 7 * toes; P.rheel = 7 * toes;
  P.lkx = -0.2; P.rkx = 0.2;
  P.hpitch = -0.05; P.smile = 1;
  P.squash = 0.02;
  return P;
}

function big(b, P) {
  twoStep(b, 1.3, P);
  const s = sideHit(b, 0, 0.3, 0.32, 1.4);
  const sa = sideHit(b, 0.08, 0.3, 0.36, 1.9);
  const dp = dip(b);
  const g = (s + 1) / 2;
  P.px += s * 8;
  // step-touch: leading foot steps out, trailing foot closes in
  P.lfx = lerp(-29, 3, g); P.rfx = lerp(-3, 29, g);
  const arc = Math.sin(Math.PI * clamp(g, 0, 1));
  P.lfy = arc * 6; P.rfy = arc * 4;
  const a = -sa;
  P.mX = -12 + 22 * a; P.mY = -12 + 13 * a - dp * 5; P.mZ = 24;
  P.fX = 12 + 22 * a; P.fY = -12 - 13 * a - dp * 5; P.fZ = 24;
  P.mouth = 0.06; P.smile = 1;
  return P;
}

// step-touch, and the free arm flings out into a point on every other beat
function bigPoint(b, P) {
  big(b, P);
  const k = Math.floor(b), u = b - k;
  if (parity(k) === 1) {
    const e = easeOutBack(seg(u, 0.0, 0.22), 2.2) * (1 - smoothstep(0.7, 0.98, u));
    P.fX = lerp(P.fX, 50, e); P.fY = lerp(P.fY, 22, e); P.fZ = lerp(P.fZ, 18, e);
    P.fPoint = e; P.fOpen = lerp(P.fOpen, 0, e); P.hyaw = lerp(P.hyaw, 0.3, e);
  }
  return P;
}

function shimmy(b, P) {
  twoStep(b, 0.7, P);
  const wob = Math.sin(TAU * 2 * b);
  P.shM += 3.6 * wob; P.shF -= 3.6 * wob; P.croll += 0.08 * wob;
  P.mX = -17; P.mY = -10 + 2 * wob; P.mZ = 21; P.fX = 17; P.fY = -10 - 2 * wob; P.fZ = 21; P.fOpen = 0;
  P.hpitch -= 0.08; P.smile = 1; P.brow = 0.5;
  const kw = Math.sin(TAU * 2 * b + 1);
  P.lkx = 0.7 * kw; P.rkx = 0.7 * kw;
  return P;
}

// arm rolls, then snap into jazz hands and freeze while the music stops dead
function jazzFreeze(b, P, s) {
  const lb = b - s;
  armRoll(Math.min(b, s + 2.9), P);
  const e = easeOutBack(seg(lb, 2.5, 2.85), 2.4);
  P.mX = lerp(P.mX, -36, e); P.mY = lerp(P.mY, 30, e); P.mZ = lerp(P.mZ, 16, e);
  P.fX = lerp(P.fX, 38, e); P.fY = lerp(P.fY, 32, e); P.fZ = lerp(P.fZ, 16, e);
  P.fOpen = e; P.py = lerp(P.py, -12, e); P.lkx = lerp(P.lkx, -0.9, e); P.rkx = lerp(P.rkx, 0.9, e);
  P.lfx = lerp(P.lfx, -22, e); P.rfx = lerp(P.rfx, 22, e);
  P.hpitch = lerp(P.hpitch, -0.1, e); P.hroll = lerp(P.hroll, 0.08, e);
  P.wink = bump(lb, 3.5, 0.18);
  P.smile = 1; P.brow = 0.6 * e;
  // a tiny tremble while frozen
  if (lb > 3) { const tr = Math.sin(b * 90) * 0.4; P.px += tr * 0.3; }
  return P;
}

// theatre: dancing, obliviously... quick glance at the wall, then a proper stare, hands on hips
function doubleTake(b, P, s) {
  const lb = b - s;
  twoStep(Math.min(b, s + 2.95), lerp(0.9, 0.2, smoothstep(2.9, 3.2, lb)), P);
  const look1 = smoothstep(2.3, 2.42, lb) * (1 - smoothstep(2.58, 2.72, lb));
  const look2 = smoothstep(2.92, 3.1, lb);
  const look = Math.max(look1, look2);
  P.hyaw = lerp(P.hyaw, 1.0, look); P.cyaw = lerp(P.cyaw, 0.3, look2); P.hroll = lerp(P.hroll, -0.05, look);
  P.brow = look; P.mO = look2 * 0.95; P.smile = lerp(0.9, 0.2, look2);
  const hh = smoothstep(2.95, 3.3, lb);
  P.mX = lerp(P.mX, -25, hh); P.mY = lerp(P.mY, -23, hh); P.mZ = lerp(P.mZ, 3, hh); P.mPole = lerp(P.mPole, -0.8, hh);
  P.fX = lerp(P.fX, 25, hh); P.fY = lerp(P.fY, -23, hh); P.fZ = lerp(P.fZ, 3, hh); P.fPole = lerp(P.fPole, -0.8, hh);
  P.fOpen = lerp(P.fOpen, 0, hh);
  return P;
}

// "anything you can do": four hip hits on the four brass stabs (da-da-da-DAH), a wagging finger,
// then he points to the heavens on the final TAH
function challenge(b, P, s) {
  const lb = b - s;
  twoStep(b, 0.3, P);
  const k = clamp(Math.floor(lb * 4), 0, 3), u = lb * 4 - Math.floor(lb * 4);
  const hitting = lb < 1.05;
  const side = (k % 2 ? -1 : 1) * (hitting ? easeOutBack(clamp(u / 0.35, 0, 1), 2.5) : 1);
  const hold = smoothstep(1.0, 1.3, lb);
  P.pyaw = 0.34 * side * (1 - hold); P.proll = 0.08 * side * (1 - hold); P.px = 5 * side * (1 - hold);
  P.lkx = 0.8 * side; P.rkx = 0.8 * side;
  P.mX = -25; P.mY = -23; P.mZ = 3; P.mPole = -0.8;
  const up = easeOutBack(seg(lb, 1.38, 1.62), 2.2);
  P.fX = lerp(26 + 4 * Math.sin(TAU * 4 * lb), 30, up); P.fY = lerp(12, 60, up); P.fZ = lerp(18, 12, up);
  P.fPoint = 1; P.fOpen = 0;
  P.py -= 4 * up;
  P.hyaw = lerp(0.55, 0.2, up); P.hpitch = lerp(0, -0.22, up);
  P.brow = 0.9; P.smile = 0.85;
  return P;
}

// watching the shadow's cartwheel, mouth open
function watch(b, P, s) {
  const lb = b - s;
  twoStep(s, 0.25, P);
  const e = smoothstep(0.0, 0.3, lb);
  P.hyaw = 0.95 * e; P.cyaw = 0.32 * e; P.hpitch = -0.06;
  P.brow = e; P.mO = e * (1 - smoothstep(1.7, 2.0, lb)); P.smile = lerp(0.3, 1, smoothstep(1.6, 2.0, lb));
  P.mX = lerp(P.mX, -22, e); P.mY = lerp(P.mY, 6, e); P.mZ = lerp(P.mZ, 18, e);
  P.fX = lerp(P.fX, 24, e); P.fY = lerp(P.fY, 6, e); P.fZ = lerp(P.fZ, 18, e); P.fOpen = e;
  P.ppitch = -0.05 * e; P.py = -3 - 2 * e;
  return P;
}

function pointMove(b, P, s) {       // s = beat the point lands on - 0.28
  twoStep(b, 0.55, P);
  const e = easeOutBack(clamp((b - s) / 0.5, 0, 1), 2.2);
  const dp = dip(b);
  P.fX = lerp(P.fX, 49, e); P.fY = lerp(P.fY, 15 + dp * 3, e); P.fZ = lerp(P.fZ, 33 + dp * 4, e);
  P.fPoint = smoothstep(s + 0.03, s + 0.33, b); P.fOpen = lerp(P.fOpen, 0, e); P.fPole = 0.4 * e;
  P.mX = lerp(P.mX, -23, e); P.mY = lerp(P.mY, -29, e); P.mZ = lerp(P.mZ, 12, e);
  P.hroll = lerp(P.hroll, -0.15, e); P.hyaw = lerp(P.hyaw, 0.12, e);
  P.smile = 1; P.brow = 0.7 * e; P.mouth = 0.12;
  return P;
}

// Saturday-night pointing: up to the stars on the even beats, down across the body on the odd
function discoPoint(b, P) {
  twoStep(b, 0.55, P);
  const k = Math.floor(b), u = b - k;
  const up = parity(k) === 0;
  const e = easeOutBack(seg(u, 0.0, 0.24), 2.0);
  const upT = [44, 60, 14], dnT = [-18, -30, 22];
  const from = up ? dnT : upT, to = up ? upT : dnT;
  P.fX = lerp(from[0], to[0], e); P.fY = lerp(from[1], to[1], e); P.fZ = lerp(from[2], to[2], e);
  P.fPoint = 1; P.fOpen = 0; P.fPole = 0.35;
  P.mX = -25; P.mY = -23; P.mZ = 3; P.mPole = -0.8;
  const hip = lerp(up ? -1 : 1, up ? 1 : -1, e);
  P.px += -7 * hip; P.proll += -0.09 * hip;
  P.hyaw = lerp(up ? -0.1 : 0.25, up ? 0.25 : -0.1, e); P.hpitch = lerp(up ? 0.05 : -0.22, up ? -0.22 : 0.05, e);
  P.smile = 1;
  return P;
}

// he lets the mic out on its cable and whirls it round, one loop per beat
function lasso(b, P, s) {
  big(b, P);
  const tw = smoothstep(s + 0.2, s + 0.55, b) * (1 - smoothstep(s + 3.3, s + 3.65, b));
  if (tw > 0) {
    const th = TAU * (b - s) - Math.PI / 2;
    P.twirl = tw; P.twA = th;
    P.mX = lerp(P.mX, -36 + 6 * Math.cos(th + 1.6), tw);
    P.mY = lerp(P.mY, 16 + 6 * Math.sin(th + 1.6), tw);
    P.mZ = lerp(P.mZ, 14, tw);
    P.hyaw = lerp(P.hyaw, -0.25, tw); P.hroll = lerp(P.hroll, 0.12, tw);
  }
  P.mouth = 0.06; P.smile = 1;
  return P;
}

function taDa(b, P, s) {
  const lb = b - s;
  twoStep(s, 0.45, P);
  const e = easeOutBack(seg(lb, 0, 0.35), 2.2);
  const br = Math.sin(TAU * 0.5 * lb) * 0.5;
  P.mX = lerp(P.mX, -37, e); P.mY = lerp(P.mY, 44, e); P.mZ = lerp(P.mZ, 14, e);
  P.fX = lerp(P.fX, 38, e); P.fY = lerp(P.fY, 46, e); P.fZ = lerp(P.fZ, 14, e); P.fOpen = e;
  P.py = lerp(P.py, -2 + br, e); P.hpitch = lerp(P.hpitch, -0.2, e); P.hroll = lerp(P.hroll, -0.06, e);
  P.lfx = -17; P.rfx = 13; P.rheel = 11 * e; P.lheel = 0; P.rkx = lerp(P.rkx, -0.9, e);
  P.smile = 1; P.brow = 0.8 * e; P.mouth = 0.3 * e;
  return P;
}

function bow(b, P, s) {
  const lb = b - s;
  taDa(s + 1.5, P, s);
  const down = smoothstep(0.35, 1.15, lb) * (1 - smoothstep(2.3, 3.1, lb));
  const settle = smoothstep(0, 0.4, lb);
  P.lfx = -14; P.rfx = 14; P.rheel = lerp(P.rheel, 0, settle);
  P.ppitch = 0.22 * down; P.cpitch = 0.03 + 0.5 * down; P.hpitch = lerp(P.hpitch, 0.4, down);
  P.mX = lerp(P.mX, -2, settle); P.mY = lerp(P.mY, -17, settle); P.mZ = lerp(P.mZ, 23, settle);
  P.fX = lerp(P.fX, lerp(34, 50, down), settle); P.fY = lerp(P.fY, lerp(-6, -2, down), settle); P.fZ = lerp(P.fZ, lerp(12, -6, down), settle);
  P.py = -3 - 3 * down;
  P.smile = 1; P.blink = down > 0.55 ? 1 : 0; P.mouth = 0.05;
  return P;
}

// in the gallery: he peers down out of his frame at the wall label as someone paints over it,
// does a double take, then turns back to us, grins, winks and points
function readLabel(b, P, s) {
  const lb = b - s;
  twoStep(s, 0.2, P);
  const look = smoothstep(0.0, 0.45, lb) * (1 - smoothstep(2.05, 2.35, lb));
  P.hpitch = lerp(P.hpitch, 0.42, look); P.hyaw = lerp(P.hyaw, 0.12, look); P.cpitch += 0.14 * look; P.ppitch = 0.05 * look;
  P.mX = -22; P.mY = -20; P.mZ = 10; P.fX = 24; P.fY = -18; P.fZ = 10;
  const shock = smoothstep(0.55, 0.75, lb) * (1 - smoothstep(2.1, 2.3, lb));
  P.brow = shock; P.mO = shock * 0.9; P.smile = lerp(0.6, 0.2, shock);
  P.py = -3 + 2 * shock;
  const e = easeOutBack(seg(lb, 2.25, 2.6), 2.2);
  P.fX = lerp(P.fX, 46, e); P.fY = lerp(P.fY, 14, e); P.fZ = lerp(P.fZ, 34, e); P.fPoint = e; P.fPole = 0.4 * e;
  P.hroll = lerp(P.hroll, -0.12, e); P.smile = lerp(P.smile, 1, e);
  P.wink = bump(lb, 2.62, 0.16);
  return P;
}

function waveBye(b, P) {
  twoStep(b, 0.35, P);
  P.fX = 31 + 7 * Math.sin(TAU * 2 * b); P.fY = 40; P.fZ = 14; P.fOpen = 1; P.fPole = 0.5;
  P.hroll = 0.08; P.smile = 1;
  return P;
}


// ---------------------------------------------------------------- moon moves
// low gravity: one long floating jump every two beats, hang time, legs tucked, arms drifting
function moonBounce(b, P) {
  twoStep(b, 0.5, P);
  const u = (b / 2) - Math.floor(b / 2);            // 0 at the take-off beat, 1 at the next landing
  const arc = 4 * u * (1 - u);                      // 0..1..0
  const air = smoothstep(0.02, 0.15, u) * (1 - smoothstep(0.85, 0.98, u));
  P.ry = 42 * arc;
  P.py = lerp(P.py, -3, air);
  P.px = lerp(P.px, 14 * Math.sin(Math.PI * (b / 4)), air * 0.9);
  const flo = Math.sin(TAU * u);
  P.mX = lerp(P.mX, -34 - 4 * flo, air); P.mY = lerp(P.mY, 26 + 8 * arc, air); P.mZ = lerp(P.mZ, 12, air);
  P.fX = lerp(P.fX, 34 + 4 * flo, air);  P.fY = lerp(P.fY, 26 + 8 * arc, air); P.fZ = lerp(P.fZ, 12, air);
  P.fOpen = air;
  P.lfy = 10 * arc; P.rfy = 14 * arc; P.lkx = lerp(P.lkx, -0.6, air); P.rkx = lerp(P.rkx, 0.6, air);
  P.hpitch = lerp(P.hpitch, -0.14, air); P.hroll = lerp(P.hroll, 0.1 * flo, air);
  P.pyaw = lerp(P.pyaw, 0.5 * Math.sin(TAU * u), air * 0.6);
  P.proll = lerp(P.proll, -0.1 * flo, air);
  P.squash = lerp(P.squash, 0.02, air);
  P.smile = 1; P.mouth = 0.1 * air;
  return P;
}

// the glide: the planted foot slides back while the body seems to move forward
function moonwalk(b, P) {
  twoStep(b, 0.35, P);
  const c = (b / 2) - Math.floor(b / 2);
  const legL = c < 0.5 ? c * 2 : 1 - (c - 0.5) * 2;     // 0..1..0 : left foot slides back then returns
  const lifting = c >= 0.5;                             // during the return, the left heel is up
  // first half of the cycle the left foot glides back while the right steps in; second half they swap roles
  P.lfx = lifting ? lerp(-24, -8, (c - 0.5) * 2) : lerp(-8, -24, c * 2);
  P.rfx = lifting ? lerp(8, 24, (c - 0.5) * 2) : lerp(24, 8, c * 2);
  P.lheel = lifting ? 12 * Math.sin(Math.PI * (c - 0.5) * 2) : 0;
  P.rheel = !lifting ? 12 * Math.sin(Math.PI * c * 2) : 0;
  P.lfy = lifting ? 4 * Math.sin(Math.PI * (c - 0.5) * 2) : 0;
  P.rfy = !lifting ? 4 * Math.sin(Math.PI * c * 2) : 0;
  P.px = 0; P.proll = 0.02 * Math.sin(Math.PI * b); P.ppitch = -0.05;
  P.mX = -30; P.mY = -6 + 3 * Math.sin(TAU * b); P.mZ = 14;
  P.fX = 34; P.fY = 4 + 4 * Math.sin(Math.PI * b); P.fZ = 20; P.fOpen = 1; P.fPole = 0.3;
  P.hroll = 0.06 * Math.sin(Math.PI * b); P.hpitch = -0.06;
  P.smile = 1; P.brow = 0.5 * legL;
  return P;
}

// robot: hard, un-eased poses that snap on every beat, with the head one tick behind
function robot(b, P) {
  twoStep(b, 0.0, P);
  const k = Math.floor(b), h = Math.floor(b - 0.25);
  const sg = parity(k) === 0 ? 1 : -1, sh = parity(h) === 0 ? 1 : -1;
  P.px = sg * 6; P.py = -3; P.pyaw = sg * 0.2; P.proll = 0; P.croll = -sg * 0.05; P.cyaw = -sg * 0.1; P.cpitch = 0.03;
  P.hyaw = sh * 0.4; P.hroll = 0; P.hpitch = -0.02 + 0.06 * (parity(k) ? 1 : 0);
  const up = parity(k) === 0;
  P.mX = up ? -30 : -18; P.mY = up ? 30 : -4; P.mZ = 14;
  P.fX = up ? 26 : 30; P.fY = up ? -4 : 30; P.fZ = 14; P.fOpen = up ? 1 : 0;
  P.lfx = -17; P.rfx = 17; P.lheel = 0; P.rheel = 0; P.lkx = -0.3; P.rkx = 0.3;
  P.smile = 0.3; P.mouth = 0.03; P.squash = 0;
  return P;
}

// ---------------------------------------------------------------- the running order
const SECTIONS = [
  { b: -20, f: under },
  { b: 16, f: (b, P) => twoStep(b, lerp(0.7, 1.0, seg(b, 16, 18)), P) },
  { b: 24, f: moonBounce },
  { b: 28, f: moonwalk },
  { b: 32, f: sing },
  { b: 38, f: spin },
  { b: 40, f: big },
  { b: 44, f: bigPoint },
  { b: 48, f: shimmy },
  { b: 52, f: jazzFreeze },
  { b: 56, f: (b, P) => twoStep(b, lerp(0.5, 1.0, seg(b, 56, 57)), P) },
  { b: 60, f: doubleTake },
  { b: 64, f: challenge },
  { b: 66, f: watch },
  { b: 68, f: (b, P) => { twoStep(b, 1.0, P); P.hyaw += 0.25; return P; } },
  { b: 70, f: (b, P) => pointMove(b, P, 70.25) },
  { b: 72, f: spin },
  { b: 74, f: moonBounce },
  { b: 80, f: discoPoint },
  { b: 84, f: lasso },
  { b: 88, f: robot },
  { b: 90, f: (b, P) => twoStep(b, 1.0, P) },
  { b: 92, f: sing },
  { b: 96, f: (b, P) => { pointMove(b, P, 96.72); P.wink = bump(b, 98.1, 0.3); return P; } },
  { b: 100, f: taDa },
  { b: 104, f: bow },
  { b: 107, f: readLabel },
  { b: 110, f: waveBye }
];

// natural blinks, a couple per bar
function naturalBlink(b) {
  const k = Math.floor(b / 2.7);
  const c = k * 2.7 + 0.4 + hash(k * 7.7) * 1.8;
  return bump(b, c, 0.045);
}

function danceAt(t) {
  const b = t / BEAT;
  let i = 0;
  while (i + 1 < SECTIONS.length && b >= SECTIONS[i + 1].b) i++;
  const S = SECTIONS[i];
  let P = S.f(b, basePose(), S.b);
  if (i > 0 && b < S.b + 0.25) {
    const Q = SECTIONS[i - 1].f(b, basePose(), SECTIONS[i - 1].b);
    P = lerpPose(Q, P, smoothstep(S.b - 0.35, S.b + 0.25, b));
  }
  if (i + 1 < SECTIONS.length) {
    const N = SECTIONS[i + 1];
    if (b > N.b - 0.35) {
      const Q = N.f(b, basePose(), N.b);
      P = lerpPose(P, Q, smoothstep(N.b - 0.35, N.b + 0.25, b));
    }
  }
  if (b > 16) P.blink = Math.max(P.blink, naturalBlink(b));
  return P;
}

// ============================================================
// The shadow in the theatre has ideas of its own.
// Returns the pose it strikes at time t, or null when it simply copies the dancer.
// ============================================================
function floss(b, P) {
  const s = sideHit(b * 2, 0, 0.3, 0.3, 1.3);
  const g = (s + 1) / 2;
  const front = parity(Math.floor(b * 2 + 0.5)) === 0 ? 1 : -1;
  P.px = -s * 13; P.proll = s * 0.12; P.croll = -s * 0.05; P.py = -6 - 4 * dip(b * 2);
  P.mX = lerp(-42, 8, g); P.mY = -36; P.mZ = 14 * front;
  P.fX = lerp(-8, 42, g); P.fY = -36; P.fZ = -14 * front;
  P.lfx = -17; P.rfx = 17; P.lkx = -0.6; P.rkx = 0.6;
  P.hroll = s * 0.1;
  return P;
}
function crossArms(b, P) {
  twoStep(b, 0.15, P);
  P.mX = 12; P.mY = -2; P.mZ = 17; P.fX = -12; P.fY = 1; P.fZ = 19;
  P.rheel = 9 * Math.pow(Math.max(0, Math.sin(Math.PI * b)), 4);
  P.hroll = 0.12 * Math.sin(Math.PI * 0.5 * b); P.hpitch = -0.1;
  return P;
}
function cartwheel(b, P, s) {
  const lb = b - s;
  const u = seg(lb, 0.25, 1.55);
  P.mX = -36; P.mY = 46; P.mZ = 6; P.fX = 36; P.fY = 46; P.fZ = 6; P.fOpen = 1;
  P.lfx = -38; P.rfx = 38; P.lkx = -0.2; P.rkx = 0.2; P.py = -4;
  P.flip = TAU * easeInOutCubic(u);
  P.ry = 30 * Math.sin(Math.PI * u);
  const land = smoothstep(1.55, 1.8, lb);
  P.lfx = lerp(P.lfx, -24, land); P.rfx = lerp(P.rfx, 24, land); P.py -= 8 * land * (1 - smoothstep(1.8, 2.0, lb));
  return P;
}
function hatTip(b, P, s, rick) {
  Object.assign(P, rick);
  const lb = b - s;
  const lift = smoothstep(0.25, 0.6, lb) * (1 - smoothstep(1.3, 1.75, lb));
  P.hat = 1; P.hatLift = lift;
  P.fX = lerp(P.fX, 8, lift); P.fY = lerp(P.fY, 56, lift); P.fZ = lerp(P.fZ, 8, lift); P.fOpen = 0;
  P.croll += 0.08 * lift; P.hroll += 0.12 * lift; P.hpitch += 0.15 * lift;
  return P;
}

const SHADOW_SECTIONS = [
  { b: 60.35, e: 64, f: floss },
  { b: 64, e: 66, f: crossArms },
  { b: 66, e: 68, f: cartwheel },
  { b: 69.2, e: 72.4, f: hatTip }
];
// rick: the pose the shadow would have if it simply copied him
function shadowPoseAt(t, rick) {
  const b = t / BEAT;
  let out = null, w = 0;
  for (const S of SHADOW_SECTIONS) {
    const k = smoothstep(S.b - 0.2, S.b + 0.15, b) * (1 - smoothstep(S.e - 0.15, S.e + 0.2, b));
    if (k <= 0) continue;
    const P = S.f(b, basePose(), S.b, rick);
    out = out ? lerpPose(out, P, k) : lerpPose(rick, P, k);
    w = Math.max(w, k);
  }
  if (!out) return rick;
  // the hat stays on once it has appeared
  if (b > 69.2 && b < 72.4) out.hat = 1;
  return out;
}

// ---- 50-sim.js
// ============================================================
// Secondary motion: coat skirt, belt ends, mic cable, quiff and mic follow-through.
// Fixed 120 Hz verlet, deterministic from a pre-roll, so any frame can be reproduced.
// ============================================================
const SIM = {
  dt: 1 / 120, t: 0, ready: false, n: 0,
  x: new Float64Array(160), y: new Float64Array(160), z: new Float64Array(160),
  ox: new Float64Array(160), oy: new Float64Array(160), oz: new Float64Array(160), w: new Float64Array(160),
  cons: [], cols: [], belts: [[], []], cable: [],
  hair: null, mic: null, trails: {}
};
const COAT_COLS = [
  { x: -8.5, z: 13.5, panel: 0 }, { x: -16, z: 11, panel: 0 }, { x: -22.5, z: 2, panel: 0 },
  { x: 8.5, z: 13.5, panel: 1 }, { x: 16, z: 11, panel: 1 }, { x: 22.5, z: 2, panel: 1 },
  { x: -20.5, z: -9, panel: 2 }, { x: -7, z: -13.5, panel: 2 }, { x: 7, z: -13.5, panel: 2 }, { x: 20.5, z: -9, panel: 2 }
];
const SKIRT_Y = 12;
const CABLE_N = 44, CABLE_SEG = 8.2;
const CABLE_END = V(-265, 0.8, 45);
const BELT_N = 4, BELT_SEG = 5.8;
const TRAIL_N = 30;

// piece time for the choreography: the intro runs at negative times, then everything loops
const pieceT = T => (T < 0 ? T : modT(T));

function simP(p, pinned) {
  const i = SIM.n++;
  SIM.x[i] = SIM.ox[i] = p.x; SIM.y[i] = SIM.oy[i] = p.y; SIM.z[i] = SIM.oz[i] = p.z;
  SIM.w[i] = pinned ? 0 : 1;
  return i;
}
function simPin(i, p) { SIM.x[i] = SIM.ox[i] = p.x; SIM.y[i] = SIM.oy[i] = p.y; SIM.z[i] = SIM.oz[i] = p.z; }
function simC(i, j, k, rest) {
  const r = rest !== undefined ? rest : Math.hypot(SIM.x[j] - SIM.x[i], SIM.y[j] - SIM.y[i], SIM.z[j] - SIM.z[i]);
  SIM.cons.push([i, j, r, k]);
}
const simGet = i => V(SIM.x[i], SIM.y[i], SIM.z[i]);

function micFrame(J, lagDir) {
  const fore = vnorm(vsub(J.wrM, J.elM));
  const grip = vmad(J.wrM, fore, 6.5);
  const up = vnorm(mv(J.Rc, V(0.12, 1, 0.3)));
  let d = vnorm(vadd(vmul(fore, 0.5), up));
  const ps = J.pose;
  if (ps.micAim > 0.001) d = vnorm(vlerp(d, vnorm(vsub(J.mouth, grip)), ps.micAim));
  if (lagDir) d = lagDir;
  let head = vmad(grip, d, 12), bottom = vmad(grip, d, -11);
  const tw = ps.twirl || 0;
  if (tw > 0.001) {
    // released on its cable: orbit around the fist in a plane facing the camera
    const e = smoothstep(0, 1, tw);
    const u1 = V(-1, 0, 0), u2 = vnorm(V(0, 1, 0.3));
    const radial = vadd(vmul(u1, Math.cos(ps.twA)), vmul(u2, Math.sin(ps.twA)));
    const ob = vmad(grip, radial, 36), oh = vmad(ob, radial, 23);
    bottom = vlerp(bottom, ob, e); head = vlerp(head, oh, e);
    d = vnorm(vsub(head, bottom));
    return { grip, d, head, bottom, fore, lasso: e };
  }
  return { grip, d, head, bottom, fore, lasso: 0 };
}

function coatRest(J, c) {
  const Ry = rotYXZ(J.pose.pyaw, 0, 0);
  const a = xf(J.pelvis, J.Rp, c.x, SKIRT_Y, c.z);
  return {
    a,
    m: vadd(a, mv(Ry, V(c.x * 0.1, -33, c.z * 0.08))),
    h: vadd(a, mv(Ry, V(c.x * 0.3, -66.5, c.z * 0.24)))
  };
}

function simReset(t0) {
  SIM.n = 0; SIM.cons = []; SIM.cols = []; SIM.belts = [[], []]; SIM.cable = [];
  const J = solveRig(danceAt(pieceT(t0)));
  for (const c of COAT_COLS) {
    const r = coatRest(J, c);
    const col = { x: c.x, z: c.z, panel: c.panel, a: simP(r.a, true), m: simP(r.m, false), h: simP(r.h, false) };
    SIM.cols.push(col);
    simC(col.a, col.m, 1); simC(col.m, col.h, 1);
  }
  const link = (i, j, k) => { simC(SIM.cols[i].m, SIM.cols[j].m, k); simC(SIM.cols[i].h, SIM.cols[j].h, k); };
  link(0, 1, 0.6); link(1, 2, 0.6); link(3, 4, 0.6); link(4, 5, 0.6);
  link(6, 7, 0.6); link(7, 8, 0.6); link(8, 9, 0.6); link(2, 6, 0.35); link(5, 9, 0.35);
  // belt ends hanging from the side loops
  for (let s = 0; s < 2; s++) {
    const sg = s === 0 ? -1 : 1;
    const a = xf(J.pelvis, J.Rp, sg * 21, 11, -4);
    const chain = [simP(a, true)];
    for (let k = 1; k <= BELT_N; k++) { chain.push(simP(V(a.x + sg * 0.5 * k, a.y - BELT_SEG * k, a.z + 1), false)); simC(chain[k - 1], chain[k], 1, BELT_SEG); }
    SIM.belts[s] = chain;
  }
  // microphone cable from the handle to a pin on the floor, off stage left
  const mf = micFrame(J);
  const c0 = simP(mf.bottom, true);
  SIM.cable.push(c0);
  for (let k = 1; k < CABLE_N; k++) {
    const t = k / (CABLE_N - 1);
    const p = vlerp(mf.bottom, CABLE_END, t);
    p.y = Math.max(0.8, lerp(mf.bottom.y, 0, Math.min(1, t * 3)));
    const i = simP(p, k === CABLE_N - 1);
    simC(SIM.cable[k - 1], i, 1, CABLE_SEG);
    SIM.cable.push(i);
  }
  const hairT = xf(J.head, J.Rh, 0, 16, 3);
  SIM.hair = { p: hairT, v: V(0, 0, 0), off: V(0, 0, 0) };
  SIM.mic = { p: mf.head, v: V(0, 0, 0), d: mf.d };
  SIM.trails = { mic: [], free: [], hand: [] };
  SIM.t = t0; SIM.ready = true;
}

function pushOut(i, A, B, r) {
  const X = SIM.x, Y = SIM.y, Z = SIM.z;
  const abx = B.x - A.x, aby = B.y - A.y, abz = B.z - A.z;
  const apx = X[i] - A.x, apy = Y[i] - A.y, apz = Z[i] - A.z;
  const ab2 = abx * abx + aby * aby + abz * abz || 1e-6;
  const t = clamp((apx * abx + apy * aby + apz * abz) / ab2, 0, 1);
  const dx = X[i] - (A.x + abx * t), dy = Y[i] - (A.y + aby * t), dz = Z[i] - (A.z + abz * t);
  const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (d < r && d > 1e-6) { const k = (r - d) / d; X[i] += dx * k; Y[i] += dy * k; Z[i] += dz * k; }
}

function simStep(T) {
  const J = solveRig(danceAt(pieceT(T)));
  const dt = SIM.dt, X = SIM.x, Y = SIM.y, Z = SIM.z, OX = SIM.ox, OY = SIM.oy, OZ = SIM.oz, W = SIM.w;
  const floor = Math.min(0.8, J.ground + 0.8);
  // pinned anchors
  const rests = [];
  for (const c of SIM.cols) { const r = coatRest(J, c); rests.push(r); simPin(c.a, r.a); }
  for (let s = 0; s < 2; s++) simPin(SIM.belts[s][0], xf(J.pelvis, J.Rp, (s === 0 ? -1 : 1) * 21, 11, -4));
  // mic follow-through spring
  const mf0 = micFrame(J);
  const mic = SIM.mic;
  const tgt = mf0.head;
  const km = 1500, cm = 2 * 0.32 * Math.sqrt(km);
  if (mf0.lasso > 0.001) {
    mic.p = vmad(mf0.grip, vnorm(vsub(tgt, mf0.grip)), 12); mic.v = V(0, 0, 0); mic.d = mf0.d;
  } else {
    mic.v = vadd(mic.v, vmul(vsub(vmul(vsub(tgt, mic.p), km), vmul(mic.v, cm)), dt));
    mic.p = vmad(mic.p, mic.v, dt);
    const md = vsub(mic.p, mf0.grip);
    mic.d = vlen(md) > 1e-3 ? vnorm(md) : mf0.d;
  }
  const mf = micFrame(J, mic.d);
  simPin(SIM.cable[0], mf.lasso > 0.001 ? mf.grip : mf.bottom);
  // quiff spring (exaggerated bounce)
  const hair = SIM.hair;
  const ht = xf(J.head, J.Rh, 0, 16, 3);
  const kh = 650, ch = 2 * 0.2 * Math.sqrt(kh);
  hair.v = vadd(hair.v, vmul(vsub(vmul(vsub(ht, hair.p), kh), vmul(hair.v, ch)), dt));
  hair.p = vmad(hair.p, hair.v, dt);
  hair.off = vsub(hair.p, ht);
  // verlet integrate
  const g = -980 * dt * dt;
  for (let i = 0; i < SIM.n; i++) {
    if (!W[i]) continue;
    const damp = 0.988;
    const vx = (X[i] - OX[i]) * damp, vy = (Y[i] - OY[i]) * damp, vz = (Z[i] - OZ[i]) * damp;
    OX[i] = X[i]; OY[i] = Y[i]; OZ[i] = Z[i];
    X[i] += vx; Y[i] += vy + g; Z[i] += vz;
  }
  // coat keeps its flare
  for (let k = 0; k < SIM.cols.length; k++) {
    const c = SIM.cols[k], r = rests[k];
    X[c.m] += (r.m.x - X[c.m]) * 0.03; Y[c.m] += (r.m.y - Y[c.m]) * 0.03; Z[c.m] += (r.m.z - Z[c.m]) * 0.03;
    X[c.h] += (r.h.x - X[c.h]) * 0.016; Y[c.h] += (r.h.y - Y[c.h]) * 0.016; Z[c.h] += (r.h.z - Z[c.h]) * 0.016;
  }
  const legs = [[J.hipL, J.knL, 10.5], [J.knL, J.anL, 8.5], [J.hipR, J.knR, 10.5], [J.knR, J.anR, 8.5], [J.hipL, J.hipR, 12]];
  for (let it = 0; it < 6; it++) {
    for (let q = 0; q < SIM.cons.length; q++) {
      const cc = SIM.cons[q], i = cc[0], j = cc[1];
      const wi = W[i], wj = W[j], ws = wi + wj;
      if (!ws) continue;
      const dx = X[j] - X[i], dy = Y[j] - Y[i], dz = Z[j] - Z[i];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6;
      const diff = (d - cc[2]) / d * cc[3] / ws;
      X[i] += dx * diff * wi; Y[i] += dy * diff * wi; Z[i] += dz * diff * wi;
      X[j] -= dx * diff * wj; Y[j] -= dy * diff * wj; Z[j] -= dz * diff * wj;
    }
    if (it % 2 === 1) {
      for (const c of SIM.cols) for (const L of legs) { pushOut(c.m, L[0], L[1], L[2]); pushOut(c.h, L[0], L[1], L[2]); }

  const tr = SIM.trails;
  tr.mic.push(mf.head); if (tr.mic.length > TRAIL_N) tr.mic.shift();
  const fore = vnorm(vsub(J.wrF, J.elF));
  tr.free.push(vmad(J.wrF, fore, 7)); if (tr.free.length > TRAIL_N) tr.free.shift();
  tr.hand.push(mf.grip); if (tr.hand.length > TRAIL_N) tr.hand.shift();
}

function simAdvance(tAbs) {
  if (!SIM.ready || tAbs < SIM.t - 1e-6 || tAbs - SIM.t > 2.5) simReset(tAbs - 2.0);
  let steps = 0;
  while (SIM.t + SIM.dt <= tAbs + 1e-9 && steps < 800) { simStep(SIM.t + SIM.dt); SIM.t += SIM.dt; steps++; }
}

const MAT = {

// material ids for the pop-art prints

function shade(mat, n, jit) {
  const dw = vdot(n, G.wDir), dc = vdot(n, G.cDir);
  const lw = clamp(smoothstep(-0.45, 0.8, dw) * G.wI, 0, 1.25);

}
const rowAt = (r, f) => {
  if (r.length === 3) return f < 0.5 ? vlerp(r[0], r[1], f * 2) : vlerp(r[1], r[2], (f - 0.5) * 2);

};
const gridAt = (rows, r, f) => {

  return vlerp(rowAt(rows[i], f), rowAt(rows[i + 1], f), r - i);
};
function screenAng(p, q) {
  const a = G.proj(p), b = G.proj(q);
  return Math.atan2(b.y - a.y, b.x - a.x);
}
function perpToward(dir, toward) {
  let p = vcross(dir, V(0, 0, 1));
  if (vlen(p) < 1e-4) p = V(1, 0, 0);
  p = vnorm(p);
  return vdot(p, toward) < 0 ? vmul(p, -1) : p;
}

function coatGrid(J, off) {
  const Rc = J.Rc;
  const out = {};
  const g = i => off ? vadd(simGet(i), off) : simGet(i);
  for (const sg of [-1, 1]) {
    const cols = SIM.cols.slice(sg < 0 ? 0 : 3, sg < 0 ? 3 : 6);
    const sh = sg < 0 ? J.shM : J.shF;
    out[sg < 0 ? 'L' : 'R'] = [
      [xf(J.neck, Rc, sg * 6.5, 1, 5.5), xf(J.neck, Rc, sg * 14, 0.5, 3), xf(sh, Rc, sg * 7, 1.5, 0)],
      [xf(J.chest, Rc, sg * 8.5, 2, 12.5), xf(J.chest, Rc, sg * 15.5, 1, 10.5), xf(J.chest, Rc, sg * 22.5, 0, 1.5)],
      cols.map(c => g(c.a)),
      cols.map(c => g(c.m)),
      cols.map(c => g(c.h))
    ];
  }
  const back = SIM.cols.slice(6, 10);
  out.B = [back.map(c => g(c.a)), back.map(c => g(c.m)), back.map(c => g(c.h))];
  return out;
}

function drawBackPanel(C) {
  G.mid = ID.lining;

  st(rows[2], 2.4, MAT.coat.d, { dry: 0.3, a: 0.9 });
}

function drawLegs(J) {

    const shoe = shade(MAT.shoe, vnorm(V(sg * 0.2, 0.6, 0.8)));
    st([vadd(an, V(0, -1.5, 0.5)), vadd(ft.ball, V(0, 2.6, 0.5)), vadd(ft.toe, V(0, 1.7, 0))], [8.6, 10.2, 9.4], shoe, { dry: 0.1, h: 0.45, gloss: 0.9, w0: 0.95, tip: 0.9, tE: 0.2 });
    st([vadd(ft.heel, V(-sg * 1, 1.2, 0)), vadd(ft.ball, V(0, 0.4, 0)), vadd(ft.toe, V(0, 0.6, 0.6))], [8.8, 10.4, 9.2], MAT.shoe.s, { a: 0.9, dry: 0.15, h: 0.3, w0: 0.95, tip: 0.9 });
    dab(vadd(ft.toe, V(-1.6, 3.1, -0.6)), 1.5, 2.6, [0.44, 0.38, 0.4], { dry: 0.3, gloss: 1, a: 0.65, noShadow: true });
    // trouser leg down to the hem

    st([top, hip, kn, an, hem], [17.5, 17, 13.5, 12, 12.6], shade(MAT.blk, vnorm(V(sg * 0.3, 0, 1))), { dry: 0.26, h: 0.32, tip: 0.95, tE: 0.12, sq: 0.6 });
    const lit = vnorm(V(-1, 0.2, 0.5)), cool = vnorm(V(1, 0.2, 0.5));
    st([vadd(kn, V(-4.8, 1, 2)), vadd(an, V(-4, 1, 2)), vadd(hem, V(-4.4, 1, 0))], 3.2, shade(MAT.blk, lit), { a: 0.85, dry: 0.5, h: 0.3 });
    st([vadd(kn, V(4.8, 1, 2)), vadd(an, V(4, 1, 2)), vadd(hem, V(4.4, 1, 0))], 2.4, shade(MAT.blk, cool), { a: 0.8, dry: 0.55, h: 0.3 });

    st([vadd(hem, V(-5.6, 1.4, -1)), vadd(hem, V(0, 0.4, 1.5)), vadd(hem, V(5.6, 1.4, -1))], 1.8, MAT.blk.s, { a: 0.75, dry: 0.3, noShadow: true });

function drawBelts(J) {

}

function drawTorso(J) {

function drawFrontPanels(J, C) {
  G.mid = ID.coat;
  for (const side of ['L', 'R']) {
    const sg = side === 'L' ? -1 : 1;
    const rows = C[side];
    const wr = r => Math.max(5, Math.abs(rowAt(r, 0).x - rowAt(r, 1).x) + 1.5);
    const nMid = mv(J.Rc, vnorm(V(sg * 0.5, 0.1, 1)));
    // flat underpainting so no ground shows through the panel
    const base = shade(MAT.coat, nMid, -0.12);
    st([rowAt(rows[0], 0.5), rowAt(rows[1], 0.5), gridAt(rows, 2.3, 0.5)], [wr(rows[0]), wr(rows[1]), wr(rows[2])], base, { dry: 0.05, h: 0.25, w0: 0.95, tip: 0.95, tS: 0.05, tE: 0.08 });
    const wr3 = r => Math.max(5, vlen(vsub(rowAt(r, 0), rowAt(r, 1))) * 0.85);
    st([gridAt(rows, 1.8, 0.5), rowAt(rows[3], 0.5), rowAt(rows[4], 0.5)], [wr(rows[2]), wr3(rows[3]), wr3(rows[4])], base, { dry: 0.05, h: 0.25, w0: 0.95, tip: 0.95, tS: 0.05, tE: 0.08 });
    const fs = [0.08, 0.3, 0.52, 0.74, 0.93];
    for (let k = 0; k < fs.length; k++) {
      const f = fs[k];
      const n = mv(J.Rc, vnorm(V(sg * f * 1.15, 0.15, 1.0 - 0.5 * f)));
      st([rowAt(rows[0], f), rowAt(rows[1], f), gridAt(rows, 2.25, f)], [8, 9, 9.5],
        shade(MAT.coat, n, (hash(k * 3.1 + sg) - 0.5) * 0.08), { dry: 0.14, h: 0.45 });
    }
    const fl = [0.04, 0.2, 0.36, 0.52, 0.68, 0.84, 0.97];
    const w3 = Math.max(9, wr3(rows[3]) / 4.2), w4 = Math.max(9.5, wr3(rows[4]) / 4.2);
    for (let k = 0; k < fl.length; k++) {
      const f = fl[k];
      const a = rowAt(rows[3], Math.max(0, f - 0.12)), b = rowAt(rows[3], Math.min(1, f + 0.12));
      const vt = vsub(rowAt(rows[4], f), rowAt(rows[2], f));
      let n = vnorm(vcross(vsub(b, a), vt));
      if (sg > 0) n = vmul(n, -1);
      const c0 = shade(MAT.coat, n, (hash(k * 7.7 + sg * 3) - 0.5) * 0.1);
      const c1 = shade(MAT.coat, vnorm(vadd(n, V(0, -0.35, 0))), -0.08);
      st([gridAt(rows, 1.85, f), rowAt(rows[3], f), rowAt(rows[4], f)], [9.5, w3, w4], [c0, c0, c1], { dry: 0.15, h: 0.45, tip: 0.75 });
    }
    // strokes that follow the form: diagonals running down from the shoulder with the lapel,
    // and a few cross-contour strokes round the swing of the skirt
    for (let k = 0; k < 3; k++) {
      const f0 = 0.55 + k * 0.17, f1 = 0.12 + k * 0.14;
      const n = mv(J.Rc, vnorm(V(sg * (0.35 + 0.25 * k), 0.25, 0.9)));
      st([gridAt(rows, 0.35, f0), gridAt(rows, 1.1, lerp(f0, f1, 0.55)), gridAt(rows, 1.9, f1)], [5.5, 6.5, 5], shade(MAT.coat, n, 0.04 - 0.05 * k), { a: 0.7, dry: 0.3, h: 0.5, tip: 0.4, noShadow: true });
    }
    for (const r of [2.6, 3.25]) {
      const n = mv(J.Rc, vnorm(V(sg * 0.4, -0.3, 0.9)));
      st([gridAt(rows, r, 0.05), gridAt(rows, r + 0.06, 0.45), gridAt(rows, r - 0.02, 0.9)], 3.2, shade(MAT.coat, n, -0.06), { a: 0.45, dry: 0.45, h: 0.4, noShadow: true });
    }
    // belt band across the waist
    const bY = V(0, 1.5, 0.6);
    st([vadd(rowAt(rows[2], 0), bY), vadd(rowAt(rows[2], 0.5), bY), vadd(rowAt(rows[2], 1), bY)], 4.6, shade(MAT.coat, nMid, -0.18), { dry: 0.15, h: 0.5, w0: 0.9, tip: 0.9, noShadow: true });
    st([vadd(rowAt(rows[2], 0), V(0, -0.8, 1)), vadd(rowAt(rows[2], 0.5), V(0, -0.8, 1)), vadd(rowAt(rows[2], 1), V(0, -0.8, 0.6))], 0.8, MAT.coat.d, { a: 0.7, dry: 0.3, noShadow: true });
    // folds swinging with the skirt
    for (const f of [0.2, 0.63]) {
      st([gridAt(rows, 2.25, f), gridAt(rows, 3, f + 0.03 * sg), gridAt(rows, 3.95, f - 0.02)], [0.8, 2.2, 1.5], MAT.coat.d, { a: 0.75, dry: 0.5, w0: 0.3, tip: 0.5, noShadow: true });
      st([gridAt(rows, 2.35, f + 0.07), gridAt(rows, 3.1, f + 0.1), gridAt(rows, 3.9, f + 0.08)], [0.6, 1.4, 1.0], shade(MAT.coat, V(-0.7, 0.4, 0.6)), { a: 0.6, dry: 0.55, w0: 0.3, tip: 0.5, noShadow: true });
    }
    // outer contour: shadowed side, lit side
    const ctr = [rowAt(rows[0], 1), rowAt(rows[1], 1), rowAt(rows[2], 1), rowAt(rows[3], 1), rowAt(rows[4], 1)];
    st(ctr.slice(1), [2.6, 3, 3, 2.4], sg > 0 ? shade(MAT.coat, V(0.8, 0, -0.2), -0.25) : shade(MAT.coat, V(-0.9, 0.3, 0.3), 0.06), { a: 0.85, dry: 0.45, noShadow: true });
    st(ctr.slice(1).map(p => vadd(p, V(sg * 1.4, 0, 0))), 1.1, rimCol(sg), { a: 0.55, dry: 0.55, noShadow: true, exact: true });
    // front opening edge and hem
    st([rowAt(rows[1], 0), rowAt(rows[2], 0), rowAt(rows[3], 0), rowAt(rows[4], 0)], [1.6, 2, 2, 1.8], shade(MAT.coat, V(-0.5, 0.6, 0.7), 0.1), { a: 0.9, dry: 0.3, noShadow: true });
    st(rows[4], 2.8, MAT.coat.d, { dry: 0.3, a: 0.95 });
    // slanted pocket welt and two buttons
    st([gridAt(rows, 2.25, 0.42), gridAt(rows, 2.55, 0.8)], 1.3, MAT.coat.d, { a: 0.85, dry: 0.3, noShadow: true });
    for (const r of [1.3, 1.7]) {
      dab(gridAt(rows, r, 0.3), 1.9, 1.9, [0.17, 0.11, 0.09], { dry: 0.1, gloss: 0.7, noShadow: true });
    }
  }
  // rim light catching the shoulder line (warm key on the left, cool on the right)
  for (const sg of [-1, 1]) {
    const sh = sg < 0 ? J.shM : J.shF;
    st([xf(J.neck, J.Rc, sg * 9, 3.2, 0), xf(sh, J.Rc, sg * 3, 3.6, -0.5), xf(sh, J.Rc, sg * 7.2, 0.5, -1)], 1.2, rimCol(sg), { a: 0.75, dry: 0.45, noShadow: true, exact: true });
  }
  // epaulettes / padded shoulders
  for (const sg of [-1, 1]) {
    const sh = sg < 0 ? J.shM : J.shF;
    st([xf(J.neck, J.Rc, sg * 8, 1.5, 1), xf(sh, J.Rc, sg * 3.5, 2.5, 0.5)], 3.2, shade(MAT.coat, mv(J.Rc, V(sg * 0.3, 1, 0.5)), 0.05), { dry: 0.3, h: 0.5, noShadow: true });
  }
}
// rim-light colours follow the scene's two lights
function rimCol(sg) {
  if (G.pop) return [0.95, 0.95, 0.95];
  return sg < 0 ? (G.rimW || [1.0, 0.86, 0.6]) : (G.rimC || [0.7, 0.6, 1.0]);
}

function drawLapels(J) {
  G.mid = ID.coat;
  const Rc = J.Rc;
  for (const sg of [-1, 1]) {
    const top = xf(J.neck, Rc, sg * 5.8, 4, 5);
    const notchIn = xf(J.chest, Rc, sg * 11.5, 9.5, 11.6);
    const notch = xf(J.chest, Rc, sg * 15.8, 6, 11.4);
    const brk = xf(J.chest, Rc, sg * 8.2, -21, 12.8);
    const n = mv(Rc, vnorm(V(sg * 0.55, 0.35, 1)));
    st([xf(J.neck, Rc, sg * 3.5, 6.2, -3), xf(J.neck, Rc, sg * 8.5, 4.2, 2.2), notchIn], [2.8, 3.6, 3], shade(MAT.coat, mv(Rc, vnorm(V(sg * 0.6, 0.6, 0.6)))), { dry: 0.25, h: 0.5 });
    st([top, vlerp(top, notch, 0.55), notch, vlerp(notch, brk, 0.45), brk], [3.2, 5, 5.2, 4.2, 1.4], shade(MAT.coat, n, 0.02), { dry: 0.22, h: 0.55, tip: 0.5 });
    st([top, vadd(vlerp(top, brk, 0.5), mv(Rc, V(sg * 1.2, 0, 0.6))), brk], 1.5, shade(MAT.coat, V(-0.4, 0.7, 0.6), 0.12), { a: 0.9, dry: 0.3, noShadow: true });
    st([vadd(notch, mv(Rc, V(sg * 1.3, -1.2, -0.5))), vadd(vlerp(notch, brk, 0.5), mv(Rc, V(sg * 1.8, 0, -0.5))), vadd(brk, mv(Rc, V(sg * 1.5, -2, 0)))], 1.8, MAT.coat.d, { a: 0.7, dry: 0.45, noShadow: true });
    dab(vlerp(notch, notchIn, 0.5), 1.2, 1.8, MAT.coat.d, { a: 0.9, noShadow: true });
  }
}

function drawArm(J, which) {
  const M = which === 'M';
  const sg = M ? -1 : 1;
  const sh = M ? J.shM : J.shF, el = M ? J.elM : J.elF, wr = M ? J.wrM : J.wrF;
  const up = vnorm(vsub(el, sh)), fo = vnorm(vsub(wr, el));
  const top = xf(sh, J.Rc, sg * 2.5, 2.5, 0);
  const cuff = vmad(wr, fo, -1.5);
  const pU = perpToward(up, G.wDir), pF = perpToward(fo, G.wDir), pE = vnorm(vadd(pU, pF));
  const nBase = vnorm(V(sg * 0.6, 0.15, 0.8));
  G.mid = ID.coat;
  st([top, el, cuff], [15.5, 14, 12.8], shade(MAT.coat, nBase), { dry: 0.22, h: 0.45, tip: 0.9, w0: 0.9 });
  const nl = vnorm(vadd(pE, V(0, 0.2, 0.9)));
  st([vmad(top, pU, 4.3), vmad(el, pE, 4.4), vmad(cuff, pF, 4)], [5.2, 5, 4.4], shade(MAT.coat, nl, 0.05), { a: 0.92, dry: 0.4, h: 0.5, noShadow: true });
  const ns = vnorm(vadd(vmul(pE, -1), V(0, -0.1, 0.5)));
  st([vmad(top, pU, -5), vmad(el, pE, -4.8), vmad(cuff, pF, -4.4)], [3.6, 4, 3.4], shade(MAT.coat, ns, -0.1), { a: 0.9, dry: 0.45, h: 0.45, noShadow: true });
  st([vmad(el, up, -4), vmad(vmad(el, pE, -1.5), V(0, 0, 1), 3), vmad(el, fo, 3.5)], [0.6, 1.6, 0.6], MAT.coat.d, { a: 0.7, dry: 0.4, noShadow: true });
  const rimSide = perpToward(vnorm(vadd(up, fo)), V(sg, 0, 0));
  st([vmad(top, rimSide, 6.6), vmad(el, rimSide, 6.4), vmad(cuff, rimSide, 5.6)], 1.1, rimCol(sg), { a: 0.6, dry: 0.5, noShadow: true, exact: true });
  const cf = vmad(wr, fo, -4.5);
  st([vmad(cf, pF, 6), vmad(vmad(cf, pF, 0), V(0, 0, 1), 2.5), vmad(cf, pF, -6)], 2.6, MAT.coat.d, { a: 0.9, dry: 0.25, noShadow: true });
  if (M) {
    G.mid = ID.mic;
    drawSmear(SIM.trails.mic, [0.86, 0.87, 0.95], 9);
    drawMic(J, 0);
    drawHand(J, 'M');
    drawMic(J, 1);
  } else {
    drawHand(J, 'F');
  }
}

function drawHand(J, which) {
  const M = which === 'M';
  const ps = J.pose;
  const el = M ? J.elM : J.elF, wr = M ? J.wrM : J.wrF;
  const fore = vnorm(vsub(wr, el));
  let dir = fore;
  if (!M) dir = vnorm(vadd(fore, V(0, 0.25, 0.2)));
  const lat = perpToward(dir, V(M ? -1 : 1, 0, 0));
  const knuck = vmad(wr, dir, 8.2);
  G.mid = ID.skin;
  const cS = shade(MAT.skin, vnorm(V(M ? -0.4 : 0.3, 0.3, 0.9)));
  const cL = shade(MAT.skin, vnorm(V(-0.6, 0.5, 0.7)), 0.04);
  const open = M ? 0 : ps.fOpen * (1 - ps.fPoint);
  st([vmad(wr, dir, 0.5), vmad(wr, dir, 4.8), knuck], [6.6, 8.2, 8.4 - open * 0.8], cS, { dry: 0.14, h: 0.45, w0: 0.9, tip: 0.85 });
  if (open > 0.05) {
    for (let i = 0; i < 4; i++) {
      const o = (i - 1.5);
      const base = vmad(knuck, lat, o * 1.9);
      const fd = vnorm(vadd(dir, vmul(lat, o * 0.16 * open)));
      const tip = vmad(vmad(base, fd, 1 + 6.2 * open), V(0, 0, 1), 0.6 * open);
      st([vmad(base, fd, -1), tip], [2.0, 1.6], i === 0 ? cL : cS, { dry: 0.15, h: 0.4, tip: 0.7, w0: 0.9 });
    }
  } else {
    st([vmad(knuck, lat, -3.8), vmad(vmad(knuck, V(0, 0, 1), 1.4), lat, 0), vmad(knuck, lat, 3.8)], 2.4, cL, { a: 0.85, dry: 0.3, noShadow: true });
  }
  if (!M && ps.fPoint > 0.05) {
    const base = vmad(knuck, lat, -2.2);
    st([vmad(base, dir, -1), vmad(base, dir, 1 + 7.5 * ps.fPoint)], [2.1, 1.7], cL, { dry: 0.12, h: 0.4, tip: 0.8, w0: 0.9 });
  }
  const th0 = vmad(vmad(wr, lat, -3.2), dir, 1.5);
  st([th0, vmad(vmad(th0, dir, 4.2), lat, -1.2 - open * 1.5)], [2.5, 2.0], cS, { dry: 0.15, h: 0.4, tip: 0.8, w0: 0.9 });
}

function drawLasso(mf) {
  if (mf.lasso < 0.02) return;
  const mid = vadd(vlerp(mf.grip, mf.bottom, 0.5), V(0, -3 * mf.lasso, 0));
  st([mf.grip, mid, mf.bottom], 2.0, [0.85, 0.36, 0.1], { c2: [1.0, 0.7, 0.3], dry: 0.1, h: 0.3, gloss: 0.8, w0: 1, tip: 1, tS: 0.01, tE: 0.01 });
}
function drawMic(J, stage) {
  // the "microphone" is a brass star-lantern on a handle: it glows, and the glow pulses on the beat
  G.mid = ID.mic;
  const mf = micFrame(J, SIM.mic.d);
  const hdl = { s: [0.2, 0.09, 0.03], m: [0.5, 0.26, 0.08], l: [0.9, 0.6, 0.25], c: [0.4, 0.3, 0.6] };
  if (stage === 0) {
    drawLasso(mf);
    const topH = vmad(mf.head, mf.d, -4.4);
    st([mf.bottom, topH], [3.4, 4.6], shade(hdl, V(0, 0, 1)), { dry: 0.08, h: 0.35, gloss: 1, w0: 0.95, tip: 1 });
    const p = perpToward(mf.d, G.wDir);
    st([vmad(vmad(mf.bottom, p, 0.9), V(0, 0, 1), 1), vmad(vmad(topH, p, 1.3), V(0, 0, 1), 1)], 0.7, [1.0, 0.85, 0.55], { a: 0.75, dry: 0.3, noShadow: true });
  } else {
    const ang = screenAng(mf.bottom, mf.head);
    const pulse = 0.5 + 0.5 * Math.pow(0.5 + 0.5 * Math.cos(TAU * G.b), 2);
    dab(mf.head, 30 + 10 * pulse, 30 + 10 * pulse, [1.0, 0.72, 0.28], { kind: 1, a: 0.16 + 0.14 * pulse, noShadow: true });
    dab(vmad(mf.head, mf.d, -3.8), 6, 2.2, shade(MAT.chrome, V(0, 0.2, 1)), { ang: ang + Math.PI / 2, dry: 0.1, gloss: 1 });
    dab(mf.head, 10, 9, shade(MAT.chrome, V(0, 0.2, 1)), { ang, dry: 0.08, h: 0.6, gloss: 1 });
    G.mid = ID.white;
    dab(mf.head, 6.4, 5.6, [1.0, 0.94, 0.62], { ang, dry: 0.05, gloss: 1, noShadow: true });
    dab(vmad(vmad(mf.head, V(-1, 1, 0), 1.6), mf.d, 0.4), 2, 2, [1, 1, 0.92], { dry: 0.05, gloss: 1, noShadow: true });
    G.mid = ID.mic;
    const p = perpToward(mf.d, G.wDir);
    for (const k of [-3.4, 3.4]) st([vmad(vmad(mf.head, mf.d, k), p, 3.4), vmad(vmad(vmad(mf.head, mf.d, k), p, 0), V(0, 0, 1), 3.6), vmad(vmad(mf.head, mf.d, k), p, -3.4)], 0.6, MAT.chrome.s, { a: 0.6, dry: 0.4, noShadow: true });
  }
}

function drawCable(micOff) {
  if (G.cableA <= 0.01) return;
  G.mid = ID.mic;
  const pts = SIM.cable.map((i, k) => micOff ? vmad(simGet(i), micOff, Math.max(0, 1 - k / 14)) : simGet(i));
  st(pts, 2.3, [0.85, 0.36, 0.1], { c2: [1.0, 0.7, 0.3], dry: 0.12, h: 0.4, gloss: 0.7, w0: 1, tip: 1, tS: 0.01, tE: 0.01, a: G.cableA });
}

function drawSmear(trail, col, w) {
  if (G.mode === 'mask' || !trail || trail.length < 12) return;
  const n = trail.length;
  const speed = vlen(vsub(trail[n - 1], trail[n - 9])) / (8 * SIM.dt);
  const a = smoothstep(330, 600, speed) * 0.5;
  if (a < 0.03) return;
  const pts = [];
  for (let i = 0; i < n; i += 4) pts.push(trail[i]);
  if ((n - 1) % 4) pts.push(trail[n - 1]);
  st(pts, pts.map((_, i) => w * (0.12 + 0.88 * i / (pts.length - 1))), col, { a, dry: 0.7, w0: 0.3, tS: 0.3, tip: 0.85, tE: 0.05, h: 0.15, exact: true });
}

function drawHead(J) {
  const H = J.head, R = J.Rh, ps = J.pose;
  const hp = (x, y, z) => xf(H, R, x, y, z);
  const hn = (x, y, z) => mv(R, vnorm(V(x, y, z)));
  const skin = (x, y, z, j) => shade(MAT.skin, hn(x, y, z), j);
  G.mid = ID.skin;
  // block in the head in a darker skin tone first, so no gaps open between the planes
  st([hp(0, 8.5, 4.5), hp(0, 1, 5.5), hp(0, -7, 5.5), hp(0, -10, 5)], [13.4, 14.6, 13, 8], skin(0.2, -0.1, 0.5, -0.18), { dry: 0.05, h: 0.3, w0: 0.9, tip: 0.8 });
  for (const sg of [-1, 1]) {
    st([hp(sg * 6.6, 5, 1.5), hp(sg * 7.0, 0, 1.2), hp(sg * 6.4, -5, 1.8)], [3.2, 3.6, 3], skin(sg, 0, 0.2, -0.12), { dry: 0.15, h: 0.35 });
    st([hp(sg * 7.2, 2.4, -0.4), hp(sg * 7.7, -0.3, -0.3), hp(sg * 7.0, -3.4, 0.2)], [2.0, 2.5, 1.8], skin(sg, 0, 0.35, -0.05), { dry: 0.2, h: 0.4 });
  }
  st([hp(0, 8.6, 7.6), hp(0, 3, 9.6), hp(0, -3, 9.8), hp(0, -8, 8.8), hp(0.1, -11.1, 7.2)], [12.2, 13.9, 13.2, 10.2, 5.4],
    [skin(0, 0.5, 1), skin(0, 0.1, 1), skin(0, -0.1, 1), skin(0, -0.4, 1, -0.04), skin(0, -0.8, 0.6, -0.08)], { dry: 0.08, h: 0.35, w0: 0.9, tip: 0.8, c2: G.pop ? undefined : [0.86, 0.5, 0.42] });
  st([hp(-3.7, 7.6, 8.2), hp(-4.7, 2, 8.6), hp(-4.4, -3.5, 8.4), hp(-3.1, -8, 7.8)], [4.4, 5, 4.6, 3.3],
    [skin(-0.7, 0.4, 0.7, 0.05), skin(-0.8, 0, 0.6, 0.05), skin(-0.8, -0.2, 0.6, 0.03), skin(-0.6, -0.5, 0.6)], { dry: 0.2, h: 0.4 });
  st([hp(5.6, 6.2, 6.4), hp(6.2, 1, 6.6), hp(5.7, -4.5, 6.0), hp(3.8, -8.8, 6.2)], [2.8, 3.2, 3.0, 2.3],
    [skin(0.9, 0.2, 0.3, -0.1), skin(1, 0, 0.3, -0.12), skin(0.9, -0.2, 0.3, -0.12), skin(0.6, -0.6, 0.4, -0.1)], { a: 0.7, dry: 0.3, h: 0.4 });
  st([hp(-3, 6.3, 9.2), hp(1.5, 6.7, 9.4)], 2.2, skin(-0.3, 0.6, 0.8, 0.08), { a: 0.7, dry: 0.4, noShadow: true });
  for (const sg of [-1, 1]) {
    if (!G.pop) dab(hp(sg * 4.3, -2.8, 8.5), 3.2, 3, [0.9, 0.46, 0.42], { kind: 1, a: 0.3, noShadow: true });
    dab(hp(sg * 3.1, 1.3, 9.0), 3.2, 3.8, G.pop ? [0.45, 0.45, 0.45] : mixc(MAT.skin.s, MAT.skin.m, 0.45), { kind: 1, a: 0.45, ang: 0, noShadow: true });
  }
  // brows
  G.mid = ID.ink;
  const br = ps.brow * 0.8;
  for (const sg of [-1, 1]) st([hp(sg * 1.3, 3.3 + br * 0.6, 9.8), hp(sg * 3.4, 3.95 + br, 9.6), hp(sg * 5.6, 3.3 + br * 0.5, 8.6)], [1.1, 1.3, 0.9], [0.4, 0.18, 0.11], { dry: 0.25, noShadow: true });
  // eyes (free-side eye can wink)
  for (const sg of [-1, 1]) {
    const shut = clamp(ps.blink + (sg > 0 ? ps.wink : 0), 0, 1);
    G.mid = ID.ink;
    if (shut > 0.6) {
      st([hp(sg * 1.9, 1.3, 9.4), hp(sg * 3.1, 0.8, 9.5), hp(sg * 4.4, 1.2, 9.0)], 0.6, [0.2, 0.1, 0.1], { dry: 0.2, noShadow: true });
    } else {
      st([hp(sg * 1.9, 1.2, 9.4), hp(sg * 3.1, 1.6 - shut + ps.brow * 0.25, 9.45), hp(sg * 4.4, 1.15, 9.0)], 0.9, [0.15, 0.08, 0.08], { dry: 0.1, w0: 0.8, tip: 0.6, noShadow: true });
      dab(hp(sg * 3.0, 0.85, 9.45), 1.2 * (1 - shut) + 0.2 + ps.brow * 0.25, 1.1, [0.19, 0.12, 0.12], { ang: 0, noShadow: true });
      G.mid = ID.white;
      dab(hp(sg * 3.0 - 0.4, 1.2, 9.6), 0.4, 0.4, [0.95, 0.9, 0.88], { a: 0.75 * (1 - shut), noShadow: true });
    }
  }
  // nose
  G.mid = ID.skin;
  st([hp(0.9, 2.2, 10.2), hp(1.3, -1.5, 11.0), hp(1.0, -3.3, 11.1)], [1.0, 1.25, 1.1], G.pop ? [0.3, 0.3, 0.3] : mixc(MAT.skin.s, MAT.skin.m, 0.35), { a: 0.75, dry: 0.3, noShadow: true });
  dab(hp(-0.3, -2.6, 11.7), 1.6, 1.4, skin(-0.4, 0, 1, 0.08), { a: 0.8, noShadow: true });
  dab(hp(0.2, -4.1, 10.9), 1.0, 2.4, G.pop ? [0.3, 0.3, 0.3] : [0.55, 0.3, 0.3], { a: 0.75, ang: 0, noShadow: true });
  // mouth
  const mo = ps.mouth, sm = ps.smile, mO = ps.mO || 0;
  if (mO > 0.25) {
    // a round "oh!" of surprise
    G.mid = ID.ink;
    dab(hp(0, -7.2, 9.8), 1.4 + 2.0 * mO, 1.8 + 2.4 * mO, [0.2, 0.06, 0.08], { ang: Math.PI / 2, dry: 0.05, noShadow: true });
    G.mid = ID.lips;
    st([hp(-1.2 - mO, -6.6, 9.4), hp(0, -5.6 + 0.2 * mO, 10.0), hp(1.2 + mO, -6.6, 9.4)], 0.8, [0.72, 0.36, 0.34], { dry: 0.2, noShadow: true });
    st([hp(-1.1 - mO, -7.6, 9.4), hp(0, -8.9 - 0.9 * mO, 9.8), hp(1.1 + mO, -7.6, 9.4)], 1.0, [0.8, 0.44, 0.4], { dry: 0.2, noShadow: true });
  } else if (mo > 0.15) {
    G.mid = ID.ink;
    dab(hp(0, -6.9 - mo * 0.5, 9.7), 1.0 + mo * 2.0, 3.0, [0.2, 0.06, 0.08], { ang: 0, dry: 0.05, noShadow: true });
    G.mid = ID.lips;
    st([hp(-2.5, -5.9, 9.1), hp(0, -5.8, 10.0), hp(2.5, -5.9, 9.1)], 0.8, [0.7, 0.34, 0.32], { dry: 0.2, noShadow: true });
    st([hp(-2.0, -7.5 - mo * 1.0, 9.2), hp(0, -8.0 - mo * 1.1, 9.7), hp(2.0, -7.5 - mo * 1.0, 9.2)], 1.0, [0.8, 0.44, 0.4], { dry: 0.2, noShadow: true });
  } else if (sm > 0.8) {
    // the grin: teeth between the lips, corners pulled up
    const k = (sm - 0.8) / 0.2;
    G.mid = ID.ink;
    st([hp(-3.0, -5.7 + sm * 0.5, 8.9), hp(0, -6.35, 10.0), hp(3.0, -5.7 + sm * 0.5, 8.9)], 0.75, [0.42, 0.14, 0.15], { dry: 0.15, noShadow: true });
    G.mid = ID.white;
    st([hp(-2.3, -6.1 + sm * 0.25, 9.3), hp(0, -6.75, 10.0), hp(2.3, -6.1 + sm * 0.25, 9.3)], 0.55 + 0.35 * k, [0.94, 0.9, 0.84], { dry: 0.2, noShadow: true, exact: true });
    G.mid = ID.ink;
    st([hp(-2.1, -6.6 + sm * 0.2, 9.3), hp(0, -7.25, 9.9), hp(2.1, -6.6 + sm * 0.2, 9.3)], 0.5, [0.35, 0.1, 0.12], { dry: 0.2, a: 0.8, noShadow: true });
    G.mid = ID.lips;
    st([hp(-1.6, -7.7, 9.5), hp(1.6, -7.7, 9.5)], 1.0, [0.82, 0.48, 0.44], { a: 0.7, dry: 0.3, noShadow: true });
  } else {
    G.mid = ID.ink;
    st([hp(-2.8, -6.0 + sm * 0.7, 9.0), hp(0, -6.5, 10.0), hp(2.8, -6.0 + sm * 0.7, 9.0)], 0.8, [0.45, 0.15, 0.16], { dry: 0.15, noShadow: true });
    G.mid = ID.lips;
    st([hp(-1.5, -7.3, 9.5), hp(1.5, -7.3, 9.5)], 1.1, [0.82, 0.48, 0.44], { a: 0.75, dry: 0.3, noShadow: true });
  }
  G.mid = ID.skin;
  dab(hp(-0.5, -9.6, 8.3), 2, 2.4, skin(-0.3, -0.5, 0.9, 0.06), { a: 0.5, noShadow: true });
  drawHair(J);
}

function drawHair(J) {
  // a retro space-cap: white shell, orange rim, goggles pushed up, ear pods, and a wobbling antenna
  G.mid = ID.hair;
  const H = J.head, R = J.Rh;
  let off = mvT(R, SIM.hair.off);
  off = V(clamp(off.x * 1.6, -6, 6), clamp(off.y * 1.6, -6, 6), clamp(off.z * 1.6, -6, 6));
  const hp = (x, y, z, k) => xf(H, R, x + off.x * (k || 0), y + off.y * (k || 0), z + off.z * (k || 0));
  const hn = (x, y, z) => mv(R, vnorm(V(x, y, z)));
  const shell = (x, y, z, j) => shade(MAT.hair, hn(x, y, z), j);
  const dark = G.pop ? [0.35, 0.35, 0.35] : mixc(MAT.hair.s, MAT.hair.m, 0.5);
  // crown block-in, then broad shaded planes over it
  st([hp(-7.8, 5.2, 4.6, 0), hp(-7.6, 11, 6.2, 0.2), hp(-4.6, 15.6, 7, 0.4), hp(0, 17.4, 7.4, 0.5), hp(4.6, 15.6, 7, 0.4), hp(7.6, 11, 6.2, 0.2), hp(7.8, 5.2, 4.6, 0)],
    9, dark, { dry: 0.15, h: 0.4, w0: 0.9, tip: 0.9 });
  for (let i = 0; i < 6; i++) {
    const x0 = -6 + i * 2.4, q = x0 * x0;
    const cols = [shell(x0 * 0.1, 0.2, 1, -0.1), shell(x0 * 0.08, 0.7, 0.9, 0.02), shell(x0 * 0.05, 1, 0.4, 0.08)];
    st([hp(x0, 7.6, 9.2 - 0.06 * q, 0), hp(x0 * 0.95, 12, 9.0 - 0.05 * q, 0.3), hp(x0 * 0.8, 16.3, 6.6 - 0.04 * q, 0.6)], [4, 4.6, 3.6], cols,
      { dry: 0.3, h: 0.55, gloss: 0.7, tip: 0.6 });
  }
  st([hp(-6.6, 14.6, 6, 0.7), hp(-3, 16.9, 8, 0.85), hp(2.4, 17, 7.6, 0.9)], [1.4, 2.2, 1.6], MAT.hair.l, { a: 0.9, dry: 0.4, h: 0.6, gloss: 1, noShadow: true });
  // orange rim across the forehead
  G.mid = ID.lining;
  const rim = (x, y, z) => shade(MAT.lining, hn(x, y * 0.3 + 0.6, z));
  st([hp(-8, 5.4, 4, 0), hp(-6.4, 7.4, 8.4, 0), hp(0, 8.4, 10.4, 0), hp(6.4, 7.4, 8.4, 0), hp(8, 5.4, 4, 0)], 3.4,
    [rim(-1, 0, 0.3), rim(-0.6, 0, 1), rim(0, 0, 1), rim(0.6, 0, 1), rim(1, 0, 0.3)], { dry: 0.15, h: 0.5, gloss: 0.8, w0: 0.95, tip: 0.9 });
  // goggles pushed up onto the shell
  for (const sg of [-1, 1]) {
    G.mid = ID.mic;
    dab(hp(sg * 3.6, 11.4, 9.4), 6.4, 6.4, shade(MAT.chrome, hn(sg * 0.2, 0.5, 1)), { dry: 0.08, gloss: 1, h: 0.5 });
    G.mid = ID.blk;
    dab(hp(sg * 3.6, 11.4, 10.0), 4.6, 4.6, shade(MAT.glass, hn(sg * 0.3, 0.6, 1)), { dry: 0.05, gloss: 1, h: 0.4 });
    G.mid = ID.white;
    dab(hp(sg * 3.6 - 0.9, 12.3, 10.4), 1.3, 1.1, [0.95, 0.99, 1], { a: 0.85, noShadow: true });
  }
  G.mid = ID.lining;
  st([hp(-0.2, 11.4, 9.8), hp(0.2, 11.4, 9.8)], 2.4, shade(MAT.lining, hn(0, 0.3, 1)), { dry: 0.1, noShadow: true });
  // ear pods
  for (const sg of [-1, 1]) {
    G.mid = ID.lining;
    dab(hp(sg * 8.1, 2.2, 2.6), 5.6, 7.4, shade(MAT.lining, hn(sg, 0, 0.4)), { dry: 0.1, h: 0.5, gloss: 0.9, ang: Math.PI / 2 });
    G.mid = ID.mic;
    dab(hp(sg * 8.9, 2.2, 2.8), 2.4, 3.6, shade(MAT.chrome, hn(sg, 0, 0.4)), { dry: 0.1, gloss: 1, noShadow: true });
  }
  // antenna with a glowing bulb that lags behind the head
  G.mid = ID.mic;
  const a0 = hp(1.6, 16.8, 5.6, 0.5), a1 = hp(2.4, 22.5, 5.6, 1.1), a2 = hp(3.2, 28.5, 5.6, 1.9);
  st([a0, a1, a2], [1.5, 1.2, 1.1], [0.62, 0.62, 0.72], { dry: 0.1, h: 0.4, gloss: 1, w0: 1, tip: 1, tS: 0.02, tE: 0.02 });
  dab(a2, 13, 13, [1.0, 0.6, 0.2], { kind: 1, a: 0.38, noShadow: true });
  G.mid = ID.lining;
  dab(a2, 5.6, 5.6, shade(MAT.lining, V(0, 0.4, 1), 0.2), { dry: 0.05, gloss: 1, h: 0.6 });
  G.mid = ID.white;
  dab(vadd(a2, V(-0.8, 0.9, 0)), 1.4, 1.2, [1, 0.95, 0.75], { a: 0.9, noShadow: true });
}

// ---------------------------------------------------------------- seen from behind (mid-spin)
function drawHeadBack(J) {
  const H = J.head, R = J.Rh;
  let off = mvT(R, SIM.hair.off);
  off = V(clamp(off.x * 1.6, -6, 6), clamp(off.y * 1.6, -6, 6), clamp(off.z * 1.6, -6, 6));
  const hp = (x, y, z, k) => xf(H, R, x + off.x * (k || 0), y + off.y * (k || 0), z + off.z * (k || 0));
  const hn = (x, y, z) => mv(R, vnorm(V(x, y, z)));
  G.mid = ID.skin;
  st([hp(0, -13, -2.5), hp(0, -6, -3.5)], 9.6, shade(MAT.skin, hn(0, -0.2, -1)), { dry: 0.15, w0: 0.9, tip: 0.9 });
  for (const sg of [-1, 1]) st([hp(sg * 6.8, 5, 0.5), hp(sg * 7.2, 0, 0.2), hp(sg * 6.6, -5, 0.8)], [3.2, 3.6, 3], shade(MAT.skin, hn(sg, 0, -0.3), -0.1), { dry: 0.15, h: 0.35 });
  G.mid = ID.hair;
  st([hp(0, -7.5, -4.5), hp(0, 0, -7.2), hp(0, 8, -6.2), hp(0, 13.5, -1, 0.6)], [11.5, 14.5, 14, 11], shade(MAT.hair, hn(0, 0.1, -1), -0.12), { dry: 0.15, h: 0.45, w0: 0.9, tip: 0.8 });
  st([hp(-6.5, 10.5, 5, 0.5), hp(0, 16, 4, 1), hp(6.5, 10.5, 5, 0.5)], 7, shade(MAT.hair, hn(0, 1, 0.2)), { dry: 0.2, h: 0.5 });
  for (let i = 0; i < 7; i++) {
    const x = -5.4 + i * 1.8, r = hash(i * 4.1);
    const cols = [shade(MAT.hair, hn(x * 0.1, -0.3, -1), -0.15), shade(MAT.hair, hn(x * 0.1, 0.3, -1)), shade(MAT.hair, hn(x * 0.1, 1, -0.3), 0.08)];
    st([hp(x * 0.8, -6.5, -5.2), hp(x * 1.05, 3, -7.4), hp(x * 0.95, 11 + r, -4.8, 0.6), hp(x * 0.7, 15.5, 0.5, 1)], [2.2, 3.2, 3.0, 2.0], [cols[0], cols[1], cols[2], cols[2]], { dry: 0.35, h: 0.6, gloss: 0.4, tip: 0.5 });
  }  // the cap's orange band at the nape, and the antenna seen from behind
  G.mid = ID.lining;
  st([hp(-7.4, 4.6, -1.5, 0.2), hp(-4, 4, -7, 0.2), hp(0, 3.8, -7.8, 0.2), hp(4, 4, -7, 0.2), hp(7.4, 4.6, -1.5, 0.2)], 3, shade(MAT.lining, hn(0, 0.2, -1)), { dry: 0.2, h: 0.5, w0: 0.95, tip: 0.9 });
  G.mid = ID.mic;
  const b0 = hp(1.6, 16.8, 3, 0.5), b1 = hp(2.4, 22.5, 3, 1.1), b2 = hp(3.2, 28.5, 3, 1.9);
  st([b0, b1, b2], [1.5, 1.2, 1.1], [0.62, 0.62, 0.72], { dry: 0.1, h: 0.4, gloss: 1, w0: 1, tip: 1 });
  dab(b2, 13, 13, [1.0, 0.6, 0.2], { kind: 1, a: 0.38, noShadow: true });
  G.mid = ID.lining;
  dab(b2, 5.6, 5.6, shade(MAT.lining, V(0, 0.4, -1), 0.2), { dry: 0.05, gloss: 1, h: 0.6 });
}

function drawCoatBack(J, C) {
  const Rc = J.Rc, Rw = J.Rw;
  G.mid = ID.coat;
  const rows = C.B;
  const nb = (x, y) => mv(Rc, vnorm(V(x, y, -1)));
  // shoulders to waist, then the skirt, as one broad camel shell
  const fs = [0, 0.18, 0.36, 0.54, 0.72, 0.9, 1.0];
  for (let k = 0; k < fs.length; k++) {
    const f = fs[k], x = lerp(-1, 1, f);

  const bY = V(0, 1.5, -0.6);
  st([vadd(rowAt(rows[0], 0), bY), vadd(rowAt(rows[0], 0.5), bY), vadd(rowAt(rows[0], 1), bY)], 4.6, shade(MAT.coat, nb(0, 0), -0.18), { dry: 0.15, h: 0.5, w0: 0.9, tip: 0.9, noShadow: true });
  st([rowAt(rows[1], 0.5), rowAt(rows[2], 0.5)], 1.4, MAT.coat.d, { a: 0.8, dry: 0.35, noShadow: true });
  st(rows[2], 2.6, MAT.coat.d, { dry: 0.3, a: 0.9 });

  for (const sg of [-1, 1]) {
