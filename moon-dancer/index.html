}

// ---------------------------------------------------------------- whole figure
// how far in front of the chest (toward the camera) the forearm is
function armDepth(J, which) {
  const el = which === 'M' ? J.elM : J.elF, wr = which === 'M' ? J.wrM : J.wrF;
  const mid = vlerp(el, wr, 0.6);
  return mid.z - J.chest.z;
}

function drawFigure(J) {
  const facing = mv(J.Rc, V(0, 0, 1)).z;
  if (facing < -0.3) return drawFigureBack(J);
  const C = coatGrid(J);
  drawBackPanel(C);
  drawLegs(J);
  drawBelts(J);
  drawTorso(J);
  const mz = armDepth(J, 'M'), fz = armDepth(J, 'F');
  if (mz < -3) drawArm(J, 'M');
  if (fz < -3) drawArm(J, 'F');
  drawFrontPanels(J, C);
  drawLapels(J);
  if (mv(J.Rh, V(0, 0, 1)).z < -0.25) drawHeadBack(J); else drawHead(J);
  if (mz >= -3) drawArm(J, 'M');
  if (fz >= -3) drawArm(J, 'F');
  drawCable();
}

function drawFigureBack(J) {
  const C = coatGrid(J);
  const mz = armDepth(J, 'M'), fz = armDepth(J, 'F');
  if (mz < -3) drawArm(J, 'M');
  if (fz < -3) drawArm(J, 'F');
  drawFrontPanels(J, C);
  drawLegs(J);
  drawCoatBack(J, C);
  drawBelts(J);
  drawHeadBack(J);
  if (mz >= -3) drawArm(J, 'M');
  if (fz >= -3) drawArm(J, 'F');
  drawCable();
}

// Simplified silhouette for the shadow masks. J may be an exaggerated, slightly late copy of
// the pose (or the shadow's own routine); off / micOff move the simulated coat, belts and cable with it.
function drawSilhouette(J, off, micOff) {
  const C = coatGrid(J, off);
  const flat = { sq: 0.6 };
  for (const s of ['L', 'R']) {
    const hip = J['hip' + s], an = J['an' + s], ft = J['foot' + s];
    st([vadd(hip, V(0, 7, 0)), hip, J['kn' + s], an, vadd(vlerp(an, ft.ball, 0.4), V(0, -0.6, 1.5))], [18, 17, 14, 12.5, 12.5], null, flat);
    st([vadd(an, V(0, -1.5, 0.5)), vadd(ft.ball, V(0, 2, 0)), ft.toe], [9, 10.5, 9], null);
  }
  for (const f of [0.1, 0.5, 0.9]) st([rowAt(C.B[0], f), rowAt(C.B[1], f), rowAt(C.B[2], f)], 17, null, flat);
  for (const side of ['L', 'R']) {
    const rows = C[side];
    for (const f of [0.12, 0.5, 0.88]) st(rows.map(r => rowAt(r, f)), [11, 12, 12.5, 13.5, 14], null, flat);
  }
  st([J.chest, J.waist, J.pelvis], 30, null, flat);
  st([xf(J.shM, J.Rc, -3, 1, 0), J.neck, xf(J.shF, J.Rc, 3, 1, 0)], 15, null);
  st([J.chest, J.neck, J.neckTop, J.head], [18, 12, 11, 13], null);
  for (const M of [true, false]) {
    const sh = M ? J.shM : J.shF, el = M ? J.elM : J.elF, wr = M ? J.wrM : J.wrF;
    st([sh, el, wr], [15, 13.5, 12], null);
    const fo = vnorm(vsub(wr, el));
    dab(vmad(wr, fo, 5), 9, 9, null, { ang: screenAng(wr, vmad(wr, fo, 8)) });
  }
  const mf = micFrame(J, SIM.mic.d);
  st([mf.bottom, mf.head], [4, 5.4], null);
  dab(mf.head, 8.6, 7.6, null);
  if (mf.lasso > 0.02) st([mf.grip, mf.bottom], 1.8, null);
  const H = J.head, R = J.Rh;
  st([xf(H, R, 0, -11, 5), xf(H, R, 0, -2, 7), xf(H, R, 0, 8, 6), xf(H, R, 0, 15.5, 5)], [11, 16, 18.5, 15], null);
  st([xf(H, R, 1.6, 16, 3), xf(H, R, 3.2, 28, 3)], 2.2, null);
  dab(xf(H, R, 3.2, 28.5, 3), 6.4, 6.4, null);
  for (let s = 0; s < 2; s++) st(SIM.belts[s].map(i => off ? vadd(simGet(i), off) : simGet(i)), 4, null);
  drawCable(micOff);
  // the shadow's top hat (the man himself has no hat)
  const ps = J.pose;
  if (ps.hat > 0.5) {
    const L = ps.hatLift || 0;
    let base = xf(H, R, 0, 12.5, 1);
    const hand = vmad(J.wrF, vnorm(vsub(J.wrF, J.elF)), 7);
    base = vlerp(base, vadd(hand, V(-2, 3, 0)), L);
    const tilt = 0.55 * L - 0.08;
    const up = V(-Math.sin(tilt), Math.cos(tilt), 0), side = V(Math.cos(tilt), Math.sin(tilt), 0);
    st([vmad(base, up, 1), vmad(base, up, 20)], [15, 14], null, { sq: 0.8 });
    st([vmad(base, side, -14), vmad(base, side, 14)], 3.6, null, { sq: 0.5 });
  }
}

// ---- 65-camera.js
// ============================================================
// Cameras and projection. A camera may carry a 2D "view" (scale + offset in device px)
// applied after projection: that is how the pop-art panel and the gallery frame shrink
// the whole painting without re-framing it.
// ============================================================
const WALL_Z = -150;
const CAM_DIST = 560;
const IDENT_VIEW = { s: 1, ox: 0, oy: 0 };

function makeCam(pos, target, fovY, roll, view) {
  const f = vnorm(vsub(target, pos));
  const r = vnorm(vcross(f, V(0, 1, 0)));
  const u = vcross(r, f);
  const c = Math.cos(roll), s = Math.sin(roll);
  return {
    pos, f, r: vadd(vmul(r, c), vmul(u, s)), u: vsub(vmul(u, c), vmul(r, s)),
    focal: (CH / 2) / Math.tan(fovY / 2), cx: CW / 2, cy: CH / 2, view: view || IDENT_VIEW
  };
}
const withView = (cam, view) => Object.assign({}, cam, { view });
function project(cam, p) {
  const dx = p.x - cam.pos.x, dy = p.y - cam.pos.y, dz = p.z - cam.pos.z;
  const x = dx * cam.r.x + dy * cam.r.y + dz * cam.r.z;
  const y = dx * cam.u.x + dy * cam.u.y + dz * cam.u.z;
  const z = Math.max(1, dx * cam.f.x + dy * cam.f.y + dz * cam.f.z);
  const s = cam.focal / z;
  const v = cam.view;
  return { x: (cam.cx + x * s) * v.s + v.ox, y: (cam.cy - y * s) * v.s + v.oy, s: s * v.s };
}
// shadow of p cast by a point light onto the floor (y=0) or the back wall
function shadowPoint(Lp, p) {
  const d = vsub(p, Lp);
  let tb = Infinity;
  if (d.z < -1e-4) { const t = (WALL_Z + 0.5 - Lp.z) / d.z; if (t > 1) tb = t; }
  if (d.y < -1e-4) { const t = (0.3 - Lp.y) / d.y; if (t > 1 && t < tb) tb = t; }
  if (!isFinite(tb)) tb = 1;
  return { p: vmad(Lp, d, tb), t: tb };
}
function projectShadow(cam, Lp, p, lean) {
  const sp = shadowPoint(Lp, p);
  if (lean && sp.p.y > 0.5) sp.p.x += lean * sp.p.y;   // pivot about the floor line
  const q = project(cam, sp.p);
  q.s *= sp.t;
  return q;
}
// GPU view-projection matrix for the static world strokes, including the 2D view
function camVP(cam) {
  const sx = 2 * cam.focal / CW, sy = 2 * cam.focal / CH;
  const r = cam.r, u = cam.u, f = cam.f, p = cam.pos;
  const tr = -vdot(r, p), tu = -vdot(u, p), tf = -vdot(f, p);
  const M = new Float32Array([
    sx * r.x, sy * u.x, 0.5 * f.x, f.x,
    sx * r.y, sy * u.y, 0.5 * f.y, f.y,
    sx * r.z, sy * u.z, 0.5 * f.z, f.z,
    sx * tr, sy * tu, 0.5 * tf, tf
  ]);
  const v = cam.view;
  if (v.s !== 1 || v.ox || v.oy) {
    const ax = v.s - 1 + 2 * v.ox / CW, ay = 1 - v.s - 2 * v.oy / CH;
    for (let c = 0; c < 4; c++) {
      M[c * 4] = v.s * M[c * 4] + ax * M[c * 4 + 3];
      M[c * 4 + 1] = v.s * M[c * 4 + 1] + ay * M[c * 4 + 3];
    }
  }
  return M;
}
// where a camera ray through p meets the plane z = zPlane (for putting things "behind" p)
function rayToPlaneZ(cam, p, zPlane) {
  const d = vsub(p, cam.pos);
  const t = (zPlane - cam.pos.z) / (d.z || -1e-6);
  return vmad(cam.pos, d, t);
}

// ---- 70-sets.js
// ============================================================
// The painted worlds. Each set is built once in world space and projected by the GPU.
// Every stroke gets a paint-in and a lift-off delay from the set's ORDER functions;
// at draw time they are measured against that set's own clocks.
// ============================================================
let ORDER = { in: null, out: null };
function wst(pts, w, col, o, floor, normal) {
  const idx = G.buf.count;
  const c = vlerp(pts[0], pts[pts.length - 1], 0.5);
  const hs = hash(idx * 7.13 + 3.1);
  const rin = ORDER.in ? ORDER.in(c, hs) : NO_IN;
  const rout = ORDER.out ? ORDER.out(c, hs) : NO_OUT;
  strokeWorld(pts, w, col, o || {}, floor ? V(0, 1, 0) : (normal || V(0, 0, 1)), [rin, rout]);
}
function wdab(p, w, len, col, o) {
  wst([V(p.x - len / 2, p.y, p.z), V(p.x + len / 2, p.y, p.z)], w, col, o);
}
const sweepX = (x0, x1, dur, jit) => (c, hs) => dur * clamp((c.x - x0) / (x1 - x0), 0, 1) + (jit === undefined ? 0.08 : jit) * hs;
// a swirl: strokes go in order of angle and distance from a centre, spiralling outward
const spiralOrder = (cx, cy, R, dur) => (c, hs) => {
  const y = c.y > 0.5 ? c.y : -(c.z - WALL_Z) * 0.35;
  const dx = c.x - cx, dy = y - cy;
  const r = Math.hypot(dx, dy), th = (Math.atan2(dy, dx) + Math.PI) / TAU;
  return dur * clamp(0.6 * r / R + 0.4 * th, 0, 1) + 0.06 * hs;
};

// ---------------------------------------------------------------- 1. the bait: a lunar nocturne
// A still, mirror-dark lunar sea, a gantry across the top, colony lights along a crater rim,
// a rising Earth, meteors falling in sparks, a field of stars.
const MOON_N = V(235, 150, WALL_Z + 0.5);
const NOCT_PIERS = [-480, -140, 140, 480];
const NOCT_BZ = -80;
const NOCT_DECK = 182;
function buildNocturne() {
  const rnd = mulberry(1871);
  const W = WALL_Z;
  const skyAt = y => mixc([0.12, 0.17, 0.34], [0.02, 0.03, 0.10], smoothstep(50, 330, y));
  // underpainting, so no bare ground shows between the thin washes
  for (let y = 20; y < 470; y += 22) {
    for (let x = -820; x < 820; x += 300) wst([V(x, y, W - 0.3), V(x + 170, y + (rnd() - 0.5) * 6, W - 0.3), V(x + 340, y, W - 0.3)], 46, scalec(skyAt(y), 0.92), { recv: 1, dry: 0.05, h: 0.06 });
  }
  for (let y = -170; y < 50; y += 20) {
    for (let x = -820; x < 820; x += 300) wst([V(x, y, W - 0.3), V(x + 170, y, W - 0.3), V(x + 340, y, W - 0.3)], 40, mixc([0.07, 0.12, 0.15], [0.14, 0.22, 0.25], smoothstep(-170, 50, y)), { recv: 1, dry: 0.05, h: 0.06 });
  }
  for (let z = W; z < 340; z += 26) {
    for (let x = -840; x < 840; x += 300) wst([V(x, -0.2, z), V(x + 170, -0.2, z), V(x + 340, -0.2, z)], 40, [0.08, 0.13, 0.16], { recv: 1, dry: 0.05, h: 0.05, gloss: 0.6 }, true);
  }
  // sky: long thin washes, darker toward the top
  for (let y = 56; y < 470; y += 9) {
    const base = skyAt(y);
    let x = -800 + rnd() * 60;
    while (x < 800) {
      const len = 160 + rnd() * 260;
      const c = scalec(base, 0.88 + rnd() * 0.22);
      const yy = y + (rnd() - 0.5) * 6;
      wst([V(x, yy, W), V(x + len * 0.5, yy + (rnd() - 0.5) * 5, W), V(x + len, yy + (rnd() - 0.5) * 6, W)], 14 + rnd() * 6, c, { recv: 1, dry: 0.4, h: 0.12, w0: 0.7, tip: 0.3 });
      x += len * (0.7 + rnd() * 0.2);
    }
  }
  // the far reach of the river, painted on the backdrop
  for (let y = -170; y < 42; y += 7) {
    const k = smoothstep(-170, 42, y);
    const base = mixc([0.07, 0.13, 0.18], [0.15, 0.24, 0.29], k);
    let x = -800 + rnd() * 50;
    while (x < 800) {
      const len = 120 + rnd() * 200;
      wst([V(x, y, W + 0.1), V(x + len * 0.5, y + (rnd() - 0.5) * 2, W + 0.1), V(x + len, y, W + 0.1)], 9, scalec(base, 0.88 + rnd() * 0.22), { recv: 1, dry: 0.35, h: 0.12, gloss: 0.4 });
      x += len * (0.75 + rnd() * 0.2);
    }
  }
  // mist over the far bank
  for (let i = 0; i < 7; i++) {
    const y = 40 + rnd() * 40;
    wst([V(-820, y, W + 0.2), V(0, y + (rnd() - 0.5) * 10, W + 0.2), V(820, y, W + 0.2)], 26 + rnd() * 20, [0.25, 0.33, 0.33], { kind: 1, a: 0.22, recv: 1 });
  }
  // the far shore: a low dark bank, roofs, a few chimneys and a church tower, softened by haze
  wst([V(-820, 42, W + 0.6), V(0, 44, W + 0.6), V(820, 42, W + 0.6)], 10, [0.06, 0.09, 0.1], { recv: 1, dry: 0.3, h: 0.2 });
  for (let x = -800; x < 800; x += 14 + rnd() * 20) {
    const h = 52 + rnd() * 30 * (0.4 + 0.6 * Math.abs(Math.sin(x / 130))), bw = 26 + rnd() * 26;
    const c = mixc([0.05, 0.07, 0.11], [0.12, 0.15, 0.22], rnd() * 0.7);
    wst([V(x, 40, W + 0.7), V(x + (rnd() - 0.5) * 18, h, W + 0.7)], bw, c, { recv: 1, dry: 0.25, h: 0.2, w0: 1, tip: 0.04, tS: 0.01, tE: 0.9 });
    if (rnd() < 0.5) wst([V(x - bw * 0.15, h * 0.92, W + 0.72), V(x + bw * 0.2, 44, W + 0.72)], 4, [0.35, 0.42, 0.62], { recv: 1, a: 0.4, dry: 0.5, w0: 0.9, tip: 0.2 });
  }
  wst([V(-420, 40, W + 0.75), V(-421, 98, W + 0.75)], 14, [0.055, 0.085, 0.1], { recv: 1, sq: 0.9, w0: 1, tip: 1 });
  wst([V(-421, 98, W + 0.76), V(-421, 122, W + 0.76)], 5, [0.055, 0.085, 0.1], { recv: 1, w0: 1, tip: 0.2 });
  wst([V(-820, 58, W + 0.78), V(0, 60, W + 0.78), V(820, 58, W + 0.78)], 22, [0.2, 0.26, 0.42], { kind: 1, a: 0.3, recv: 1 });
  for (const [x, h] of [[-250, 118], [330, 104], [520, 124]]) {

    wst([V(x, h + 2, W + 0.82), V(x + 30, h + 14, W + 0.82), V(x + 90, h + 20, W + 0.82), V(x + 170, h + 22, W + 0.82)], [7, 12, 18, 24], [0.2, 0.26, 0.29], { kind: 1, a: 0.35, recv: 1 });
  }
  // lights along the far bank, each with a broken reflection
  for (let i = 0; i < 40; i++) {
    const x = -660 + rnd() * 1320, y = 42 + rnd() * 18;
    const c = rnd() < 0.55 ? [0.45, 0.85, 1.0] : (rnd() < 0.5 ? [1.0, 0.62, 0.25] : [0.95, 0.98, 1.0]);
    wdab(V(x, y, W + 0.9), 3.2, 3.6, c, { recv: 1, dry: 0.1, h: 0.5 });
    if (rnd() < 0.5) wdab(V(x, y, W + 0.85), 12, 12, scalec(c, 0.45), { kind: 1, a: 0.3, recv: 1 });
    for (let k = 0; k < 4; k++) {
      const yy = 34 - k * 10 - rnd() * 4;
      wst([V(x + (rnd() - 0.5) * 2, yy, W + 0.8), V(x + (rnd() - 0.5) * 2, yy - 5 - rnd() * 3, W + 0.8)], 2.4 - k * 0.35, scalec(c, 0.8 - k * 0.13), { recv: 1, dry: 0.4, a: 0.8 });

  wdab(vadd(MOON_N, V(0, 0, -0.2)), 170, 160, [0.12, 0.24, 0.42], { kind: 1, a: 0.4, recv: 1 });
  wdab(vadd(MOON_N, V(0, 0, -0.1)), 74, 70, [0.25, 0.45, 0.7], { kind: 1, a: 0.4, recv: 1 });
  const ER = 24;

  }
  for (let i = 0; i < 14; i++) {
    const a = rnd() * TAU, r = rnd() * ER * 0.78;
    const x = MOON_N.x + Math.cos(a) * r, y = MOON_N.y + Math.sin(a) * r;
    const ln = 4 + rnd() * 9;
    wst([V(x - ln / 2, y, MOON_N.z + 0.1), V(x + ln / 2, y + (rnd() - 0.5) * 3, MOON_N.z + 0.1)], 2.6 + rnd() * 1.6, mixc([0.24, 0.62, 0.32], [0.55, 0.66, 0.34], rnd()), { recv: 1, dry: 0.3, h: 0.6, a: 0.95 });
  }
  for (let i = 0; i < 7; i++) {
    const y = MOON_N.y - ER * 0.8 + i * ER * 0.27, hw = Math.sqrt(Math.max(0, ER * ER - (y - MOON_N.y) ** 2)) * 0.85;
    const x0 = MOON_N.x - hw * (0.2 + rnd() * 0.7);
    wst([V(x0, y, MOON_N.z + 0.2), V(x0 + hw * (0.4 + rnd() * 0.6), y + (rnd() - 0.5) * 3, MOON_N.z + 0.2)], 1.6, [0.94, 0.97, 1.0], { recv: 1, a: 0.7, dry: 0.5 });

  wst([V(MOON_N.x - 60, MOON_N.y - 6, MOON_N.z + 0.3), V(MOON_N.x, MOON_N.y - 3, MOON_N.z + 0.3), V(MOON_N.x + 70, MOON_N.y - 9, MOON_N.z + 0.3)], 4, [0.10, 0.14, 0.26], { recv: 1, a: 0.6, dry: 0.5 });

// ---------------------------------------------------------------- 2. the station airlock arch: riveted hull plates, orange trim, open space beyond
const ARCH_R = 96, ARCH_SPRING = 138;
const BRICKS = [[0.24, 0.34, 0.48], [0.20, 0.28, 0.42], [0.30, 0.42, 0.56], [0.16, 0.23, 0.36], [0.36, 0.44, 0.52], [0.13, 0.20, 0.34], [0.62, 0.34, 0.16]];
function insideArch(x, y, pad) {
  const r = ARCH_R - (pad || 0);
  if (Math.abs(x) > r) return false;
  return y < ARCH_SPRING + Math.sqrt(Math.max(0, r * r - x * x));
}
function buildArch() {
  const rnd = mulberry(90210);
  const W = WALL_Z;
  // 0. dark underpainting of wall and floor, so gaps read as mortar and grime rather than holes
  for (let y = 0; y < 520; y += 40) {

      if (insideArch(x + 105, y + 10, 30)) continue;
      wst([V(x, y + rnd() * 8, W - 0.2), V(x + 110, y + rnd() * 8, W - 0.2), V(x + 230, y + rnd() * 8, W - 0.2)], 52, [0.07 + rnd() * 0.03, 0.10, 0.17], { recv: 1, dry: 0.15, h: 0.12 });

  }
  // 1. broad wall strokes (mortar tone shows between later bricks)
  for (let y = -6; y < 510; y += 21) {
    let x = -660 + rnd() * 40;
    while (x < 660) {
      const len = 70 + rnd() * 110;

      const y0 = y + rnd() * 4, y1 = y + (rnd() - 0.5) * 5, y2 = y + rnd() * 4;
      if (!insideArch(x + len / 2, y, 8)) wst([V(x, y0, W), V(x + len / 2, y1, W), V(x + len, y2, W)], 25, scalec(c, k), { recv: 1, dry: 0.5, h: 0.28, sq: 0.55 });
      x += len * (0.72 + rnd() * 0.2);

  }
  // 2. brick dabs in courses
  for (let row = 0; row < 60; row++) {
    const y = 3 + row * 8.6;
    for (let x = -660 + (row % 2) * 11.5; x < 660; x += 23) {
      const r1 = rnd(), r2 = rnd(), r3 = rnd(), r4 = rnd();
      if (r1 > 0.46) continue;
      if (insideArch(x, y, -34)) continue;
      const c = BRICKS[(r2 * BRICKS.length) | 0];
      const k = 0.8 + r3 * 0.4;
      const hl = 7 + r4 * 3.5, dx = (r3 - 0.5) * 3;
      wst([V(x + dx - hl, y + (r4 - 0.5) * 1.2, W + 0.2), V(x + dx + hl, y + (r3 - 0.5) * 1.2, W + 0.2)], 5.4 + r2 * 1.8, scalec(c, k), { recv: 1, dry: 0.3, h: 0.55, w0: 0.95, tip: 0.9, sq: 0.75, a: 0.75 + 0.25 * r1 / 0.46 });
    }
  }
  // 3. grime
  for (let i = 0; i < 18; i++) {
    const x = -560 + rnd() * 1120, y0 = 330 + rnd() * 160, y1 = y0 - 90 - rnd() * 140;
    if (Math.abs(x) < ARCH_R + 40) continue;
    wst([V(x, y0, W + 0.3), V(x + (rnd() - 0.5) * 8, (y0 + y1) / 2, W + 0.3), V(x, y1, W + 0.3)], 10 + rnd() * 12, [0.05, 0.07, 0.13], { recv: 1, a: 0.32, dry: 0.7, w0: 0.9, tip: 0.2 });
  }
  // 4. the tunnel through the arch
  for (let x = -ARCH_R + 4; x <= ARCH_R - 4; x += 12) {
    const top = ARCH_SPRING + Math.sqrt(Math.max(0, ARCH_R * ARCH_R - x * x)) - 2;
    const c = [0.045 + rnd() * 0.02, 0.05 + rnd() * 0.02, 0.09 + rnd() * 0.03];
    wst([V(x, -2, W + 0.4), V(x + (rnd() - 0.5) * 4, top * 0.5, W + 0.4), V(x, top, W + 0.4)], 17, c, { recv: 0.12, dry: 0.3, h: 0.25, w0: 0.9, tip: 0.8 });
  }
  wdab(V(0, 70, W + 0.5), 140, 120, [0.05, 0.1, 0.19], { kind: 1, a: 0.28 });
  // open space through the airlock: stars and a ringed planet
  for (let i = 0; i < 90; i++) {
    const x = -ARCH_R + 10 + rnd() * (2 * ARCH_R - 20), y = 12 + rnd() * (ARCH_SPRING + ARCH_R - 24);

  wdab(V(-30, 60, W + 0.6), 150, 90, [0.16, 0.10, 0.34], { kind: 1, a: 0.35 });
  for (let dy = -13; dy <= 13; dy += 3) {
    const hw = Math.sqrt(Math.max(0, 14 * 14 - dy * dy));
    wst([V(52 - hw, 190 + dy, W + 0.65), V(52 + hw, 190 + dy, W + 0.65)], 3.6, mixc([0.86, 0.6, 0.4], [0.42, 0.26, 0.5], (dy + 13) / 26), { dry: 0.15, h: 0.5, w0: 0.9, tip: 0.9 });
  }
  wst([V(24, 184, W + 0.7), V(52, 196, W + 0.7), V(82, 186, W + 0.7)], 2.2, [0.98, 0.86, 0.6], { dry: 0.3, a: 0.85 });
  for (let i = 0; i < 9; i++) {
    const x = -70 + rnd() * 140, y = 2 + rnd() * 14;
    wst([V(x, y, W + 0.5), V(x + 10 + rnd() * 16, y + (rnd() - 0.5), W + 0.5)], 1.4, [0.2, 0.3, 0.42], { a: 0.35, dry: 0.5 });
  }
  for (const sg of [-1, 1]) wst([V(sg * (ARCH_R - 12), 4, W + 0.5), V(sg * (ARCH_R - 13), 70, W + 0.5), V(sg * (ARCH_R - 16), ARCH_SPRING + 30, W + 0.5)], 3, [0.14, 0.18, 0.3], { a: 0.35, dry: 0.6 });
  // 5. arch reveal (soffit + jambs), then the voussoir rings
  for (const sg of [-1, 1]) wst([V(sg * (ARCH_R - 5), -2, W + 0.8), V(sg * (ARCH_R - 5), ARCH_SPRING * 0.6, W + 0.8), V(sg * (ARCH_R - 5), ARCH_SPRING, W + 0.8)], 10, [0.30, 0.16, 0.08], { recv: 0.8, dry: 0.4, h: 0.4 });

  for (let ring = 0; ring < 2; ring++) {
    const r0 = ARCH_R + 1 + ring * 15, r1 = r0 + 13.5;
    const n = 30 + ring * 3;
    for (let i = 0; i <= n; i++) {
      const a = (i + ring * 0.5) / n * Math.PI;
      if (a > Math.PI) continue;
      const ca = Math.cos(a), sa = Math.sin(a);

  const F = [[0.22, 0.28, 0.38], [0.18, 0.23, 0.33], [0.28, 0.34, 0.42], [0.14, 0.19, 0.29]];
  for (let z = WALL_Z; z < 300; z += 9) {
    let x = -760 + rnd() * 60;

      x += len * (0.8 + rnd() * 0.15);

  for (let z = WALL_Z + 20; z < 300; z += 34) wst([V(-760, 0.05, z), V(760, 0.05, z)], 1.6, [0.08, 0.07, 0.1], { recv: 0.6, a: 0.5, dry: 0.6 }, true);
  for (let x = -720; x <= 720; x += 55) wst([V(x, 0.05, WALL_Z), V(x * 1.02, 0.05, 300)], 1.4, [0.08, 0.07, 0.1], { recv: 0.6, a: 0.45, dry: 0.6 }, true);
  for (let i = 0; i < 22; i++) {
    const x = -300 + rnd() * 600, z = -120 + rnd() * 330;

function skyFlow(x, y) {

// 0..1: inside the bright bands that ring each whirlpool, and the long wave across the sky
function swirlBand(x, y) {

// ============================================================
// The running order of the worlds, and everything decided per scene:
// which sets are on the canvas (with their paint clocks), camera, lights, composite.
// Beats:  0 river nocturne | 16 drop: railway arch | 40 pop-art prints |
//        56 theatre | 71.6 swirl into the starry night | 101 gallery pull-back |
//       112 the painting repaints itself as the nocturne | 120 = loop
// ============================================================
const B = { drop: 16, pop: 40, thea: 56, swirl: 71.55, star: 72, gal: 101, repaint: 112, end: 120 };
const SET = {};
function buildSets() {
  const mk = (fn, ord) => { const b = new StrokeBuf(true); G.buf = b; G.layer = 'bg'; ORDER = ord; fn(); b.dirty = true; return b; };
  SET.noct = mk(buildNocturne, { in: sweepX(-380, 380, 1.25, 0.1), out: sweepX(-300, 300, 0.55, 0.08) });
  SET.arch = mk(buildArch, { in: null, out: null });
  SET.pop = mk(buildPopGround, { in: null, out: null });
  SET.theaB = mk(buildTheatreBack, { in: null, out: spiralOrder(40, 110, 560, 0.75) });
  SET.theaF = mk(buildTheatreFront, { in: null, out: spiralOrder(40, 110, 560, 0.45) });
  SET.star = mk(buildStarry, { in: null, out: sweepX(-420, 420, 0.55, 0.08) });
  ORDER = { in: null, out: null };
}

function sceneName(b) {
  if (b < B.drop) return 'noct';
  if (b < B.pop) return 'arch';
  if (b < B.thea) return 'pop';
  if (b < B.star) return 'thea';
  return 'star';
}

// static sets to draw into the background, bottom first, with their clocks
function setDrawList(t) {
  const b = t / BEAT, L = [];
  if (b < B.drop + 1.5) {
    if (b > B.drop - 0.5) L.push({ buf: SET.arch });
    L.push({ buf: SET.noct, tIn: t + 1.7, tOut: t - (B.drop * BEAT - 0.06) });
  } else if (b < B.pop) L.push({ buf: SET.arch });
  else if (b < B.thea) L.push({ buf: SET.pop, flat: true });
  else if (b < B.star + 1.6) {
    if (b > B.swirl - 0.3) L.push({ buf: SET.star });
    L.push({ buf: SET.theaB, tOut: t - B.swirl * BEAT });
  } else {
    const tRe = B.repaint * BEAT;
    L.push({ buf: SET.star, tOut: t - (tRe - 0.15) });
    if (b > B.repaint - 0.2) L.push({ buf: SET.noct, tIn: t - tRe, tOut: -1e4, noctCam: true });
  }
  return L;
}

    const col = hash(i * 5.3) < 0.6 ? [1, 0.9, 0.55] : [0.9, 0.95, 1];
    st([vadd(p, V(-R, 0, 0)), vadd(p, V(R, 0, 0))], 2.4 * (1 - u), col, { a: 1 - u, still: true, exact: true, dry: 0.1, w0: 0.1, tip: 0.1, tS: 0.5, tE: 0.5 });
    st([vadd(p, V(0, -R, 0)), vadd(p, V(0, R, 0))], 2.4 * (1 - u), col, { a: 1 - u, still: true, exact: true, dry: 0.1, w0: 0.1, tip: 0.1, tS: 0.5, tE: 0.5 });
    dab(p, 12 * (1 - u), 12 * (1 - u), col, { kind: 1, a: 0.6 * (1 - u), still: true });
  }
  // a shooting star as he winks
  const ss = seg(b, 96.9, 98.3);
  if (ss > 0 && ss < 1) {
    const e = easeOutCubic(ss);
    const P0 = V(-470, 470, Z + 3), P1 = V(330, 300, Z + 3);
    const head = vlerp(P0, P1, e), tail = vlerp(P0, P1, Math.max(0, e - 0.32));
    st([tail, vlerp(tail, head, 0.6), head], [0.5, 3.5, 7], [1.0, 0.97, 0.82], { a: 0.95 * (1 - ss * 0.8), dry: 0.3, still: true, exact: true });
    dab(head, 14, 14, [1, 0.97, 0.8], { kind: 1, a: 0.85 * (1 - ss), still: true });
  }
  drawContact(J, 0.7);
}
// the theatre is swallowed by a whirlpool of brushstrokes, and the starry night pours out of it
function drawSwirlVortex(t, b, cx, cy) {
  const u = seg(b, B.swirl - 0.45, B.swirl + 1.4);
  if (u <= 0 || u >= 1) return;
  const grow = smoothstep(0, 0.3, u), fade = 1 - smoothstep(0.55, 1, u);
  const spin = 9 * (t - (B.swirl - 0.45) * BEAT) - 3 * u * u;
  const R = Math.hypot(CW, CH) * 0.62;
  const cols = [[0.2, 0.33, 0.63], [0.42, 0.6, 0.82], [0.72, 0.83, 0.86], [0.98, 0.86, 0.45], [0.12, 0.19, 0.47], [0.9, 0.92, 0.84]];
  for (let i = 0; i < 120; i++) {
    const r0 = R * (0.04 + 0.96 * Math.sqrt(hash(i * 1.7))) * (0.35 + 0.65 * grow);
    const a0 = i / 120 * TAU * 5 + spin * (0.6 + 0.4 * hash(i * 2.9)) * (1.2 - r0 / R);
    const len = (1.1 + 1.2 * hash(i * 4.1)) * fade;
    if (len < 0.05) continue;
    const pts = [];
    for (let k = 0; k <= 5; k++) {
      const a = a0 + k / 5 * len, r = r0 * (1 - 0.12 * k / 5);
      pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.82, w: (18 + 26 * hash(i * 3.3)) * DPR * (0.4 + 0.6 * grow) * (0.5 + r0 / R), c: cols[i % cols.length] });
    }
    strokeScreen(pts, { dry: 0.3, h: 0.6, tip: 0.25, still: true });
  }
}
// a whip-pan: long streaks of paint tear across the frame on the last beat of the spin, and
// the pop-art print slams in behind them
function drawWhipSmear(b) {
  const u = seg(b, B.pop - 0.42, B.pop);
  if (u <= 0 || u >= 1) return;
  const e = easeInCubic(u);
  const cols = [[0.55, 0.3, 0.2], [0.97, 0.35, 0.6], [1.0, 0.87, 0.18], [0.3, 0.22, 0.4], [0.72, 0.52, 0.31], [0.95, 0.9, 0.8]];
  for (let i = 0; i < 34; i++) {
    const y = (i + 0.5) / 34 * CH + (hash(i * 7.1) - 0.5) * CH / 34;
    const lead = e * 1.6 - hash(i * 3.3) * 0.6;
    if (lead <= 0) continue;
    const x1 = -0.1 * CW + lead * CW * 1.2, x0 = x1 - CW * (0.3 + 0.5 * hash(i * 1.9));
    const w = CH / 34 * (1.6 + hash(i * 5.7));
    strokeScreen([{ x: x0, y, w: w * 0.6, c: cols[i % 6] }, { x: (x0 + x1) / 2, y: y + (hash(i) - 0.5) * 6 * DPR, w, c: cols[(i + 3) % 6] }, { x: x1, y, w: w * 0.8, c: cols[(i + 1) % 6] }],
      { dry: 0.45, h: 0.6, still: true, tip: 0.4, w0: 0.2, rev: [NO_IN, NO_OUT], recv: 0 });
  }
}
// painted swooshes whipping round him while he spins
function drawSpinSwoosh(J, b) {
  let sp = 0;
  for (const s0 of [38, 72]) sp = Math.max(sp, Math.sin(Math.PI * seg(b, s0 + 0.4, s0 + 1.55)));
  if (sp < 0.05) return;
  const c = J.pelvis, yaw = J.pose.pyaw;
  const cols = [[1, 0.95, 0.85], [0.95, 0.8, 0.55], [0.9, 0.92, 1]];
  for (let k = 0; k < 3; k++) {
    const y = c.y - 35 + k * 42, r = 52 + 10 * k;
    const pts = [];
    for (let i = 0; i <= 8; i++) { const a = yaw + Math.PI * 0.2 + i / 8 * 2.2 + k * 0.7; pts.push(V(c.x + Math.sin(a) * r, y + 4 * Math.sin(a * 2), c.z + Math.cos(a) * r * 0.5)); }
    st(pts, pts.map((_, i) => 1 + 5 * Math.sin(Math.PI * i / 8)), cols[k], { a: 0.55 * sp, dry: 0.6, exact: true, still: true, w0: 0.2, tip: 0.2 });
  }
}
// comic snap marks at his fingertips on every finger-snap
function drawSnapMarks(J, t, b) {
  if (b < 23.8 || b > 28.3) return;
  for (const [age] of recentHits('snap', t, 0.2)) {
    const u = age / 0.2;
    const fore = vnorm(vsub(J.wrF, J.elF));
    const tip = vmad(J.wrF, fore, 11);
    const q = G.proj(tip);
    for (let k = 0; k < 4; k++) {
      const a = -Math.PI / 2 + (k - 1.5) * 0.55 + 0.35;
      const r0 = (9 + 10 * u) * DPR, r1 = r0 + (8 - 5 * u) * DPR;
      strokeScreen([{ x: q.x + Math.cos(a) * r0, y: q.y + Math.sin(a) * r0, w: 2.2 * DPR, c: [1, 0.95, 0.8] }, { x: q.x + Math.cos(a) * r1, y: q.y + Math.sin(a) * r1, w: 1.4 * DPR, c: [1, 0.95, 0.8] }],
        { a: 1 - u, dry: 0.1, exact: true, still: true, tip: 0.3, rev: [NO_IN, NO_OUT] });
    }
  }
}
// a little star of light on a wink
function drawWinkGlint(J, amt) {
  if (amt < 0.05) return;
  const p = xf(J.head, J.Rh, 5.2, 3.2, 10.5);
  const q = G.proj(p);
  const r = 7 * DPR * amt;
  G.mid = ID.white;
  strokeScreen([{ x: q.x - r, y: q.y, w: 1.6 * DPR, c: [1, 0.97, 0.85] }, { x: q.x + r, y: q.y, w: 1.6 * DPR, c: [1, 0.97, 0.85] }], { dry: 0.1, exact: true, w0: 0.1, tip: 0.1, tS: 0.5, tE: 0.5, recv: ID.white / 10 });
  strokeScreen([{ x: q.x, y: q.y - r, w: 1.6 * DPR, c: [1, 0.97, 0.85] }, { x: q.x, y: q.y + r, w: 1.6 * DPR, c: [1, 0.97, 0.85] }], { dry: 0.1, exact: true, w0: 0.1, tip: 0.1, tS: 0.5, tE: 0.5, recv: ID.white / 10 });
}

// ============================================================
// Lettering and the gallery: the title card that bait-and-switches, and the museum wall
// the whole painting turns out to be hanging on.
// ============================================================
const SERIF = 'italic 400 % Georgia, "Times New Roman", serif';
const ROMAN = '400 % Georgia, "Times New Roman", serif';
const SCRIPT = '400 % "Snell Roundhand", "Brush Script MT", "Segoe Script", "Apple Chancery", cursive';

// The title card on bare linen. sec: seconds since the page opened (paints the letters in).
function drawTitle(sec) {
  const cx = CW / 2, cy = CH / 2;
  const sz = Math.min(CW * 0.064, CH * 0.105);
  const ink = [0.12, 0.19, 0.31], gold = [0.52, 0.37, 0.13];
  // a small gold crescent moon above the words
  const mx = cx, my = cy - sz * 2.05, mr = sz * 0.34;
  for (let i = 0; i < 6; i++) {
    const r = mr * (1 - i * 0.07), a0 = -2.2 + i * 0.04, a1 = 1.9 - i * 0.02;
    const pts = [];
    for (let k = 0; k <= 6; k++) { const a = lerp(a0, a1, k / 6); pts.push({ x: mx + Math.cos(a) * r, y: my + Math.sin(a) * r, w: sz * 0.09, c: mixc([0.62, 0.46, 0.18], [0.85, 0.66, 0.28], i / 5) }); }
    strokeScreen(pts, { dry: 0.3, h: 0.5, jit: 0.3 });
  }
  paintText('Lunar Nocturne', SERIF, cx, cy - sz * 0.75, sz, ink, { dry: 0.2, h: 0.5, jit: 0.25, rows: 24 });
  // a gold hairline between the title and the line beneath it
  strokeScreen([{ x: cx - sz * 2.6, y: cy - sz * 0.02, w: sz * 0.035, c: gold }, { x: cx + sz * 2.6, y: cy + sz * 0.01, w: sz * 0.035, c: gold }], { dry: 0.35, h: 0.4, w0: 0.2, tip: 0.2, tS: 0.4, tE: 0.4, jit: 0.2 });
  paintText('a quiet study in oils  \u00b7  one minute', SERIF, cx, cy + sz * 0.42, sz * 0.46, gold, { dry: 0.1, h: 0.4, jit: 0.15, rows: 16, wk: 1.9 });
  const pulse = 0.5 + 0.5 * Math.sin(sec * 2.4);
  paintText('click anywhere to begin \u2014 with sound', ROMAN, cx, cy + sz * 1.62, sz * 0.33, [0.2, 0.2, 0.26], { dry: 0.1, h: 0.3, jit: 0.15, rows: 16, wk: 1.9, a: 0.45 + 0.55 * pulse });
  // a butterfly monogram, the way Whistler signed his nocturnes
  const bx = CW - sz * 1.4, by = CH - sz * 1.2, bs = sz * 0.36;
  const bc = [0.3, 0.26, 0.24];
  for (const sg of [-1, 1]) {
    strokeScreen([{ x: bx, y: by, w: bs * 0.12, c: bc }, { x: bx + sg * bs * 0.55, y: by - bs * 0.55, w: bs * 0.2, c: bc }, { x: bx + sg * bs * 0.8, y: by - bs * 0.15, w: bs * 0.14, c: bc }, { x: bx + sg * bs * 0.2, y: by + bs * 0.05, w: bs * 0.08, c: bc }], { dry: 0.3, h: 0.4, jit: 0.2 });
    strokeScreen([{ x: bx, y: by + bs * 0.05, w: bs * 0.08, c: bc }, { x: bx + sg * bs * 0.4, y: by + bs * 0.35, w: bs * 0.12, c: bc }, { x: bx + sg * bs * 0.15, y: by + bs * 0.45, w: bs * 0.06, c: bc }], { dry: 0.3, h: 0.4, jit: 0.2 });
  }
  strokeScreen([{ x: bx, y: by - bs * 0.2, w: bs * 0.07, c: bc }, { x: bx, y: by + bs * 0.35, w: bs * 0.05, c: bc }, { x: bx + bs * 0.3, y: by + bs * 0.9, w: bs * 0.03, c: bc }], { dry: 0.3, h: 0.4, jit: 0.2, tip: 0.1 });
}

// ---------------------------------------------------------------- the gallery wall
// Everything is laid out in units of the frame's height on screen, around the frame centre.
const GAL = { strike: 106.6, script: 107.1, laugh: 108.3 };
function drawGallery(t, b, gv) {
  const S = CH * gv.s, cx = CW / 2, cy = gv.cy, A = CW / CH;
  const P = (u, v, w, c, a) => ({ x: cx + u * S, y: cy + v * S, w: w * S, c, a });
  const fw = 0.085, hx = A / 2, hy = 0.5;
  const rnd = mulberry(4040);
  G.boil = Math.floor(t * 6); G.jit = 0.3; G.mid = 0;
  G.rev = null;
  const uMax = A * 0.5 / gv.s + 0.2, vMin = -0.5 / gv.s - 0.15, vMax = 0.5 / gv.s + 0.25;
  const dado = hy + fw + 0.36;
  const inner = hx + fw * 0.4;
  // the wall: deep oxblood, laid in with broad, slightly diagonal strokes around the picture
  for (let v = vMin; v < dado; v += 0.042) {
    let u = -uMax - rnd() * 0.1;
    while (u < uMax) {
      const len = 0.24 + rnd() * 0.34;
      const c = mixc([0.44, 0.1, 0.1], [0.5, 0.13, 0.12], rnd());
      const segs = Math.abs(v) < hy + fw * 0.4 ? [[u, Math.min(u + len, -inner)], [Math.max(u, inner), u + len]] : [[u, u + len]];
      for (const [a0, a1] of segs) {
        if (a1 - a0 < 0.03) continue;
        const dv = (rnd() - 0.5) * 0.03;
        strokeScreen([P(a0, v - dv * 0.5, 0.066, c), P((a0 + a1) / 2, v, 0.066, c), P(a1, v + dv * 0.5, 0.066, c)], { dry: 0.3, h: 0.22 });
      }
      u += len * (0.72 + rnd() * 0.2);
    }
  }
  // a quiet damask, one shade darker, repeated across the wall
  const dk = [0.3, 0.05, 0.06], lt = [0.62, 0.2, 0.15];
  for (let gy = vMin + 0.05, row = 0; gy < dado - 0.06; gy += 0.21, row++) {
    for (let gx = -uMax + (row % 2) * 0.1; gx < uMax; gx += 0.2) {
      if (Math.abs(gy) < hy + fw + 0.06 && Math.abs(gx) < hx + fw + 0.06) continue;
      const u = gx, v = gy;
      // a fleur-de-lis: a tall central petal, two petals curling out and down, a band, a foot
      strokeScreen([P(u, v + 0.012, 0.016, dk), P(u, v - 0.02, 0.013, dk), P(u, v - 0.05, 0.002, dk)], { dry: 0.15, h: 0.3, jit: 0.08, w0: 1, tip: 0.1 });
      for (const sx of [-1, 1]) {
        strokeScreen([P(u + sx * 0.006, v + 0.004, 0.008, dk), P(u + sx * 0.024, v - 0.018, 0.009, dk), P(u + sx * 0.038, v - 0.006, 0.007, dk), P(u + sx * 0.032, v + 0.012, 0.003, dk)], { dry: 0.2, h: 0.3, jit: 0.08, tip: 0.2 });
      }
      strokeScreen([P(u - 0.02, v + 0.014, 0.006, dk), P(u + 0.02, v + 0.014, 0.006, dk)], { dry: 0.2, h: 0.3, jit: 0.08, sq: 0.6 });
      strokeScreen([P(u, v + 0.018, 0.009, dk), P(u, v + 0.04, 0.002, dk)], { dry: 0.2, h: 0.3, jit: 0.08, w0: 1, tip: 0.1 });
      strokeScreen([P(u - 0.003, v - 0.035, 0.0035, lt), P(u - 0.003, v - 0.008, 0.0035, lt)], { dry: 0.3, a: 0.55, jit: 0.08 });
    }
  }
  // dado rail and the darker panelling below it
  strokeScreen([P(-uMax, dado, 0.026, [0.62, 0.48, 0.25]), P(uMax, dado, 0.026, [0.62, 0.48, 0.25])], { dry: 0.3, h: 0.6, sq: 1, w0: 1, tip: 1 });
  strokeScreen([P(-uMax, dado + 0.018, 0.01, [0.16, 0.05, 0.05]), P(uMax, dado + 0.018, 0.01, [0.16, 0.05, 0.05])], { dry: 0.4, sq: 1, w0: 1, tip: 1 });
  for (let v = dado + 0.03; v < vMax; v += 0.04) {
    strokeScreen([P(-uMax, v, 0.05, [0.23, 0.055, 0.065]), P(0, v + 0.004, 0.05, [0.27, 0.065, 0.07]), P(uMax, v, 0.05, [0.23, 0.055, 0.065])], { dry: 0.35, h: 0.25 });
  }
  for (let u = -uMax + 0.1; u < uMax; u += 0.42) {
    strokeScreen([P(u, dado + 0.08, 0.008, [0.5, 0.36, 0.2]), P(u + 0.34, dado + 0.08, 0.008, [0.5, 0.36, 0.2])], { dry: 0.4, a: 0.6 });
  }
  // the gilded frame: moulding strokes graded from a pale slip and dark lip to a bright bead and a bronze edge
  const band = [[0.0, 0.012, [0.83, 0.77, 0.6]], [0.013, 0.012, [0.24, 0.15, 0.06]], [0.024, 0.018, [0.72, 0.55, 0.22]],
                [0.04, 0.009, [0.98, 0.86, 0.5]], [0.05, 0.02, [0.66, 0.49, 0.18]], [0.068, 0.012, [0.45, 0.31, 0.11]], [0.079, 0.01, [0.26, 0.17, 0.07]]];
  for (const [d, w, c] of band) {
    const x = hx + d + w / 2, y = hy + d + w / 2;
    const lit = mixc(c, [1, 0.93, 0.7], 0.14), dim = scalec(c, 0.78);
    const o = { dry: 0.2, h: 0.7, gloss: 0.8, sq: 0.9, w0: 1, tip: 1 };
    strokeScreen([P(-x, -y, w, lit), P(0, -y, w, lit), P(x, -y, w, lit)], o);
    strokeScreen([P(-x, y, w, dim), P(0, y, w, dim), P(x, y, w, dim)], o);
    strokeScreen([P(-x, -y, w, lit), P(-x, 0, w, c), P(-x, y, w, dim)], o);
    strokeScreen([P(x, -y, w, c), P(x, 0, w, dim), P(x, y, w, dim)], o);
  }
  // carved ornament: gold leaves along the moulding and a cartouche at each corner
  for (let i = 0; i < 40; i++) {
    const f = (i + 0.5) / 40, d = 0.058;
    const pts = [[-hx - d + f * (2 * hx + 2 * d), -hy - d], [-hx - d + f * (2 * hx + 2 * d), hy + d], [-hx - d, -hy - d + f * (2 * hy + 2 * d)], [hx + d, -hy - d + f * (2 * hy + 2 * d)]];
    for (const [u, v] of pts) strokeScreen([P(u, v, 0.012, [0.95, 0.8, 0.42])], { len: 0.02 * S, ang: (i % 2 ? 0.7 : -0.7), dry: 0.2, h: 0.8, gloss: 0.9 });
  }
  for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const u = sx * (hx + 0.045), v = sy * (hy + 0.045);
    for (let k = 0; k < 6; k++) {
      const a = k / 6 * TAU;
      strokeScreen([P(u + Math.cos(a) * 0.022, v + Math.sin(a) * 0.022, 0.018, [0.92, 0.76, 0.36])], { len: 0.032 * S, ang: a, dry: 0.2, h: 0.8, gloss: 0.9 });
    }
    strokeScreen([P(u, v, 0.03, [1.0, 0.9, 0.55])], { len: 0.03 * S, ang: 0.5, dry: 0.1, h: 0.9, gloss: 1 });
  }
  // a brass picture light, and the warm glow it throws down the canvas
  const lv = -hy - fw - 0.07;
  strokeScreen([P(0, lv + 0.035, 0.16, [1.0, 0.85, 0.55])], { kind: 1, len: 0.75 * S, ang: 0, a: 0.25 });
  strokeScreen([P(-0.27, lv, 0.028, [0.72, 0.58, 0.3]), P(0.27, lv, 0.028, [0.72, 0.58, 0.3])], { dry: 0.2, h: 0.7, gloss: 1, sq: 0.8 });
  strokeScreen([P(-0.26, lv + 0.012, 0.008, [1, 0.96, 0.75]), P(0.26, lv + 0.012, 0.008, [1, 0.96, 0.75])], { dry: 0.2, a: 0.95 });
  for (const sx of [-1, 1]) strokeScreen([P(sx * 0.12, lv, 0.01, [0.55, 0.43, 0.2]), P(sx * 0.1, -hy - fw + 0.005, 0.01, [0.55, 0.43, 0.2])], { dry: 0.3 });
  // the museum label: cream card, black letters... which someone is about to deface
  const lk = Math.min(1, A * 1.05 / 0.92);
  const cV = hy + fw + 0.155 * lk, cW = 0.92 * lk, cH = 0.2 * lk;
  strokeScreen([P(-cW / 2 + 0.014, cV + 0.014, cH, [0.1, 0.02, 0.02]), P(cW / 2 + 0.014, cV + 0.014, cH, [0.1, 0.02, 0.02])], { sq: 1, w0: 1, tip: 1, dry: 0.05, a: 0.55, kind: 1 });
  for (let k = 0; k < 7; k++) {
    const v = cV - cH / 2 + (k + 0.5) * cH / 7;
    strokeScreen([P(-cW / 2, v, cH / 7 * 1.35, [0.95, 0.92, 0.84]), P(cW / 2, v, cH / 7 * 1.35, [0.97, 0.94, 0.87])], { sq: 1, w0: 1, tip: 1, dry: 0.06, h: 0.12 });
  }
  const s1 = 0.064 * S * lk;
  const tw = paintText('Lunar Nocturne', SERIF, cx, cy + (cV - 0.045 * lk) * S, s1, [0.06, 0.05, 0.08], { dry: 0.02, h: 0.4, jit: 0.06, rows: 18, wk: 2.1, w0: 1, tip: 1 });
  paintText('oil and code on canvas  \u00b7  2026', ROMAN, cx, cy + (cV + 0.025 * lk) * S, s1 * 0.46, [0.25, 0.23, 0.25], { dry: 0.02, h: 0.3, jit: 0.06, rows: 12, wk: 2.0, w0: 1, tip: 1 });
  const red = [0.88, 0.1, 0.08];
  const y1 = cy + (cV - 0.045 * lk) * S;
  strokeScreen([{ x: cx - tw.w * 0.56, y: y1 + s1 * 0.14, w: s1 * 0.22, c: red }, { x: cx, y: y1 - s1 * 0.02, w: s1 * 0.25, c: red }, { x: cx + tw.w * 0.56, y: y1 - s1 * 0.18, w: s1 * 0.2, c: red }],
    { dry: 0.3, h: 0.75, rev: [GAL.strike * BEAT, NO_OUT] });
  const t2 = GAL.script * BEAT;
  const sx0 = cx - tw.w * 0.62, sw = tw.w * 1.24;
  paintText('(you\u2019ve been Rickrolled)', SCRIPT, cx + 0.02 * S * lk, cy + (cV + 0.072 * lk) * S, s1 * 1.5, red, {

// a gallery-goer in a bowler hat, seen from behind; his shoulders shake when the joke lands,
// and he wanders off before we go back into the painting
function drawVisitor(t, b, P, A, gv) {

  strokeScreen([P(bx + 0.05, bot - 0.228 + sh, 0.008, rim), P(bx + 0.13, bot - 0.212 + sh, 0.01, rim), P(bx + 0.205, bot - 0.15 + sh, 0.01, rim)], { dry: 0.3, a: 0.5 });

  strokeScreen([P(bx - 0.065, bot - 0.19 + sh, 0.04, coatL), P(bx, bot - 0.205 + sh, 0.042, coatL), P(bx + 0.065, bot - 0.19 + sh, 0.04, coatL)], { dry: 0.15 });

  strokeScreen([P(hx0 - 0.03, hc + 0.05, 0.008, [0.42, 0.3, 0.22]), P(hx0 - 0.035, hc - 0.01, 0.008, [0.42, 0.3, 0.22])], { dry: 0.4, a: 0.6 });
  // the bowler: a domed crown on an upturned brim, a band, a glint of lamplight
  const hb = hc - 0.045;
  const dome = [[-0.078, 0], [-0.07, -0.05], [-0.035, -0.083], [0, -0.09], [0.035, -0.083], [0.07, -0.05], [0.078, 0]];
  strokeScreen(dome.map(([u, v]) => P(hx0 + u + tilt * 0.3, hb + v * 0.5, 0.06, hat)), { dry: 0.05, h: 0.5 });
  strokeScreen([P(hx0 - 0.06 + tilt * 0.3, hb - 0.02, 0.07, hat), P(hx0 + 0.06 + tilt * 0.3, hb - 0.02, 0.07, hat)], { dry: 0.05, h: 0.5 });
  strokeScreen([P(hx0 - 0.078 + tilt * 0.3, hb - 0.002, 0.012, [0.16, 0.15, 0.18]), P(hx0 + 0.078 + tilt * 0.3, hb - 0.002, 0.012, [0.16, 0.15, 0.18])], { dry: 0.2 });
  strokeScreen([P(hx0 - 0.125, hb + 0.002 + tilt * 0.3, 0.014, hat), P(hx0 - 0.09, hb + 0.012, 0.018, hat), P(hx0 + 0.09, hb + 0.012, 0.018, hat), P(hx0 + 0.125, hb + 0.002 - tilt * 0.3, 0.014, hat)], { dry: 0.05, h: 0.5 });

}

// ---- 80-audio.js
// ============================================================
// The soundtrack: an original score, synthesised live with WebAudio and locked to the picture.
// A D-minor piano nocturne (the bait), a record scratch, a drum fill, then a space-disco groove
// with rolling octave bass, off-beat stabs and a cascading bell hook; a jazzy theatre break;
// a key change up to E minor for the last chorus, ending on a bright E major; a music box home.
// No samples, and nothing borrowed.
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);

function audioSetup() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  let ctx;
  try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { return false; }

}
// the mixing desk: a bus into shelving EQ and a glue compressor; hall, gated and echo sends

// Debug: render beats [b0, b1) of the score offline through the same desk and measure it.
async function audioMeasure(b0, b1, only) {
  const sr = 22050, t0 = b0 * BEAT, t1 = b1 * BEAT;
  const off = new OfflineAudioContext(2, Math.ceil(sr * (t1 - t0 + 2)), sr);
  const saved = Object.assign({}, AUDIO);
  Object.assign(AUDIO, { ctx: off }, buildGraph(off));
  let errs = 0;
  for (const e of SCORE) if (e.t >= t0 && e.t < t1 && (!only || only.includes(e.fn))) { try { e.fn(e.t - t0 + 0.01, ...e.a); } catch (x) { errs++; } }

    for (let i = k * spb; i < (k + 1) * spb && i < L.length; i++) { s2 += L[i] * L[i] + R[i] * R[i]; p = Math.max(p, Math.abs(L[i]), Math.abs(R[i])); }

async function audioRenderWav(sr, peakDb) {

function impulse(ctx, dur, decay, gated) {
  const n = Math.floor(ctx.sampleRate * dur), b = ctx.createBuffer(2, n, ctx.sampleRate);

function send(node, dest, amt) { if (amt > 0) { const g = A_gain(amt); node.connect(g); g.connect(dest); } }

// ---------------------------------------------------------------- instruments
const I = {};
I.kick = (t, v = 1) => {
  const ctx = AUDIO.ctx;
  const o = osc('sine', 160, t, t + 0.45);
  o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(46, t + 0.12);

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1.05 * v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);

};

  noiseHit(t, 0.19, 'bandpass', 1900, 0.8 * v, 0.7, 0.08, 1.0);
  noiseHit(t, 0.07, 'highpass', 4800, 0.4 * v, 0.7, 0.04, 0.35);

function drums(bar, o) {
  const b0 = bar * 4;
  for (let q = 0; q < 4; q++) {

function octBass(bar, ch, from, to, tr) {
  for (let i = (from || 0) * 4; i < (to === undefined ? 16 : to * 4); i++) {

function buildScore() {
  // ---- bars 0-2: the nocturne (the bait). A slow D-minor piano, a music box doubling the tune.
  const arps = [[38, 45, 53, 57, 62, 57, 53, 45], [34, 41, 50, 53, 58, 53, 50, 41], [43, 50, 55, 58, 62, 58, 55, 50]];
  for (let bar = 0; bar < 3; bar++) for (let i = 0; i < 8; i++) ev(bar * 4 + i * 0.5, I.piano, arps[bar][i], BEAT * 1.2, i === 0 ? 0.8 : 0.55);

  for (const [bt, n, d] of mel) { ev(bt, I.piano, n, d * BEAT, 1.0); ev(bt, I.mbox, n + 12, 0.35); }
  // something stirs: bubbles, and plips as the antenna breaks the surface
  for (let i = 0; i < 9; i++) ev(6.4 + i * 0.27 + hash(i) * 0.2, I.bloop, 380 + hash(i * 3.3) * 520, 0.8);
  for (const bt of [8.4, 9.3, 10.2, 11.1]) ev(bt, I.bloop, 260, 0.6);
  // ...the record scratches to a halt. Eyes dart left, right. Eyebrows up.
  ev(12, I.scratch);
  ev(11.85, I.blip, 84); ev(12.65, I.blip, 88);
  ev(13.3, I.ding, 96, 0.8);
  // the drum fill, and he comes flying out of the river
  for (let i = 0; i < 6; i++) ev(14 + i * 0.25, I.snare, 0.35 + i * 0.1);
  [50, 47, 43, 40].forEach((n, i) => ev(15 + i * 0.25, I.tom, n, 0.9));
  ev(14.45, I.splash, 1); ev(14.45, I.whoosh, 0.45, 0.7);
  ev(16, I.splash, 0.5);

  // ---- bars 4-9: the station airlock, D minor. Rolling bass, gated snare, off-beat stabs, cascading bells.
  const verse = ['Dm', 'Bb', 'Gm', 'A', 'Dm', 'Bb'];
  ev(16, I.crash, 1);
  for (let k = 0; k < 6; k++) {
    const bar = 4 + k, ch = CHD[verse[k]];
    if (k < 4) drums(bar, { open: true, clap: k >= 2 });
    else drums(bar, { light: true });
    if (k < 5) octBass(bar, ch); else { octBass(bar, ch, 0, 2); octBass(bar, CHD.A, 2, 4); }
    if (k < 4) { stabs(bar, ch); tune(bar, HOOK[k], I.bell, 0, 1, [1, 3]); }
    else ev(bar * 4, I.pad, ch.s, BEAT * 4, 1);
    if (k === 2) for (let q = 0; q < 4; q++) ev(bar * 4 + q, I.snap, 0.9);
  }

  const verseTune = [[32.5, 69, 0.5, 'a'], [33, 74, 1, 'o'], [34, 72, 0.5, 'a'], [34.5, 69, 0.5, 'e'], [35, 65, 0.75, 'o'], [35.75, 64, 0.25, 'a'], [36, 70, 1, 'o'], [37, 72, 0.5, 'a'], [37.5, 69, 0.5, 'e']];
  for (const [bt, n, d, vw] of verseTune) sung(bt, n, d, vw);
  ev(38, I.riser, BEAT * 2, 0.9); ev(38.35, I.whoosh, 0.6, 0.8, 0.6);
  for (let i = 0; i < 8; i++) ev(38 + i * 0.25, I.snare, 0.3 + i * 0.09);

  // ---- bars 10-13: the pop-art chorus. Every new grid of prints lands on a crash.
  const chorus = ['Bb', 'F', 'Gm', 'A'];
  for (let k = 0; k < 4; k++) {
    const bar = 10 + k, ch = CHD[chorus[k]];
    ev(bar * 4, I.crash, k === 0 ? 1 : 0.7);

    const J2 = solveRig(P2);
    const sOff = vsub(J2.pelvis, J.pelvis);
    const mOff = vsub(micFrame(J2, SIM.mic.d).bottom, micFrame(J, SIM.mic.d).bottom);
    const z0 = J2.pelvis.z, pc = J2.pelvis;
    const ca = Math.cos(P2.flip || 0), sa = Math.sin(P2.flip || 0);
    // depth is flattened so the shadow reads as a front-on pose (a shadow-puppet cheat); a cartwheel turns it in the wall plane
    const flat = p => {
      let q = squash(V(p.x, p.y, z0 + (p.z - z0) * 0.4));
      if (P2.flip) { const dx = q.x - pc.x, dy = q.y - pc.y; q = V(pc.x + dx * ca - dy * sa, pc.y + dx * sa + dy * ca, q.z); }
      return q;
    };
    if (name === 'arch') {
      const lean = (REDUCED ? 0.05 : 0.13) * sideHit(b, 0.2, 0.3, 0.45, 1.8);
      G.maskCol = [1, 0, 0]; G.proj = p => projectShadow(camV, Ls.w, flat(p), lean); drawSilhouette(J2, sOff, mOff);
      G.maskCol = [0, 1, 0]; G.proj = p => projectShadow(camV, Ls.c, flat(p), lean); drawSilhouette(J2, sOff, mOff);
    } else if (spotOn(b) > 0.05) {
      G.maskCol = [1, 0, 0]; G.proj = p => projectShadow(camV, Ls.w, flat(p), 0); drawSilhouette(J2, sOff, mOff);
    }
  }
  // ---- the dancer
  G.buf = bufFG; bufFG.reset(); G.mode = 'paint'; G.layer = 'fg'; G.proj = figProj; G.pop = pop;
  G.boil = Math.floor(t * (REDUCED ? 4 : 12)); G.jit = REDUCED ? 0.35 : 0.7;
  G.cableA = b < B.drop ? 0 : smoothstep(B.drop, B.drop + 1.2, b);
  G.rev = liftAtEnd ? endRev(-0.05) : null;
  if (J.ground > -205) drawFigure(J);
  drawWinkGlint(J, smoothstep(0.75, 1, J.pose.wink));
  if (!pop) drawSpinSwoosh(J, b);
  drawSnapMarks(J, t, b);
  G.pop = false; G.proj = camProj; G.mid = 0;
  if (b > 14.3 && b < 17.8) drawSplash(t, b);
  if (name === 'thea') drawCurtain(b);
  if (name === 'arch') drawWhipSmear(b);
  // the title lifting off as the nocturne paints itself in (first play only)
  if (t < 0) {
    G.layer = 'title'; G.rev = (idx, x) => [NO_IN, -INTRO + 0.04 + 0.5 * clamp(x / CW, 0, 1) + 0.08 * hash(idx * 3.1)];
    G.boil = Math.floor(tp * 8); G.jit = 0.4;
    drawTitle(tp + 10);
  }
  // ---- the gallery wall
  if (galOn) { G.buf = bufGal; bufGal.reset(); G.layer = 'gal'; G.mode = 'paint'; drawGallery(t, b, gv); }

  // ---- GPU passes
  const draws = setDrawList(t);
  const vpScene = camVP(camV), vpFlat = camVP(cam);
  const boilBG = Math.floor(t * (REDUCED ? 2 : 6));
  let first = true;
  for (const d of draws) {
    const vp = d.flat ? vpFlat : d.noctCam ? camVP(nocturneCam({ s: gv.s, ox: gv.ox, oy: gv.oy })) : vpScene;
    glDrawStrokes(d.buf, T_BG, { world: true, vp, boil: boilBG, jit: 0.6, tIn: d.tIn !== undefined ? d.tIn : 1e4, tOut: d.tOut !== undefined ? d.tOut : -1e4, noClear: !first });
    first = false;
  }
  if (first) glClearTarget(T_BG);
  glDrawStrokes(bufBGd, T_BG, { noClear: true, tIn: t, tOut: t });
  glDrawStrokes(bufSH, T_SH, { mask: true, tIn: t, tOut: t });
  glDrawStrokes(bufFG, T_FG, { tIn: t, tOut: t });
  if (name === 'thea' || (b >= B.star && b < B.star + 1.6)) {
    glDrawStrokes(SET.theaF, T_FG, { world: true, vp: vpScene, boil: boilBG, jit: 0.6, noClear: true, tIn: 1e4, tOut: t - (B.swirl - 0.3) * BEAT });
  }
  if (galOn) glDrawStrokes(bufGal, T_GAL, { tIn: t, tOut: t });

  // ---- composite
  const U = baseComposite({ time: t, grain: (Math.floor(t * 12) % 61) * 1.37, flash: flashAt(b) });
  // a breath of exposure on every backbeat while the band is playing
  if (!REDUCED && b > B.drop && b < 100.5) {
    const sn = Math.max(hitPulse('snare', t, 0.09), hitPulse('clap', t, 0.09));
    const k = (pop ? 0.05 : 0.035) * sn;
    if (k > U.flash[3]) U.flash = [1, 0.97, 0.92, k];
  }
  if (t < 0) U.ground = mixc(LINEN, DARKGROUND, smoothstep(-1.2, 0, t));
  // bare linen shows while the painting inside the frame is scraped and repainted
  if (b > B.repaint - 0.4) U.ground = mixc(DARKGROUND, LINEN, smoothstep(B.repaint - 0.3, B.repaint + 0.3, b) * (1 - smoothstep(B.repaint + 1.8, B.repaint + 2.8, b)));
  if (b < B.drop + 1.5) {
    const k = smoothstep(B.drop + 0.85, B.drop + 1.3, b);    // lights up once the knife has passed
    U.amb = mixc([1, 1, 1], [0.2, 0.19, 0.33], k);
    U.refl = 0.45; U.relief = lerp(1.5, 2.1, k); U.vig = 1.0;
    U.floorY = CH - project(camV, V(b > B.drop ? J.pelvis.x : 0, 0, 2)).y;
    if (b < B.drop + 0.6) U.waterY = CH - project(camV, V(0, 0, 0)).y;
    if (b > B.drop) {
      const pw = pool2(camV, Ls.w, J, 170, Ls.w.x * 0.18), pc = pool2(camV, Ls.c, J, 160, Ls.c.x * 0.18);
      U.wCol = scalec([1.32 * Ls.wI, 0.84 * Ls.wI, 0.5 * Ls.wI], k); U.cCol = scalec([0.62 * Ls.cI, 0.45 * Ls.cI, 1.18 * Ls.cI], k);
      U.wPool = pw[0]; U.wPool2 = pw[1]; U.cPool = pc[0]; U.cPool2 = pc[1];
    }
  } else if (name === 'arch') {
    const pw = pool2(camV, Ls.w, J, 170, Ls.w.x * 0.18), pc = pool2(camV, Ls.c, J, 160, Ls.c.x * 0.18);
    Object.assign(U, {
      amb: [0.2, 0.19, 0.33], wCol: [1.32 * Ls.wI, 0.84 * Ls.wI, 0.5 * Ls.wI], cCol: [0.62 * Ls.cI, 0.45 * Ls.cI, 1.18 * Ls.cI],
      wPool: pw[0], wPool2: pw[1], cPool: pc[0], cPool2: pc[1], refl: 0.3,
      floorY: CH - project(camV, V(J.pelvis.x, 0, 2)).y
    });
  } else if (pop) {
    Object.assign(U, { pop: 1, grid, popSeed: popSeed(b), relief: 1.1, vig: 0.3, ground: [0.96, 0.94, 0.9] });
  } else if (name === 'thea') {
    const on = spotOn(b);
    const sc = shadowPoint(Ls.w, J.chest).p;
    const mid = project(camV, V(lerp(J.chest.x, sc.x, 0.45), lerp(J.chest.y, sc.y, 0.5) - 10, lerp(J.chest.z, sc.z, 0.6)));
    const r = 250 * mid.s * (0.3 + 0.7 * easeOutBack(seg(b, 56.2, 56.85), 1.6));   // the follow-spot irises open
    const f = project(camV, V(J.pelvis.x + 20, 0, 20));
    Object.assign(U, {
      amb: [0.13, 0.11, 0.17], wCol: scalec([1.55, 1.3, 0.95], on), cCol: [0.18, 0.16, 0.34],
      wPool: [mid.x, CH - mid.y, r * 1.25, r], wPool2: [f.x, CH - f.y, 200 * f.s, 70 * f.s],
      cPool: [f.x, CH - f.y, 320 * f.s, 120 * f.s], cPool2: NOPOOL, refl: 0.14, relief: 2.0,
      floorY: CH - project(camV, V(J.pelvis.x, 0, 2)).y
    });
  } else {
    Object.assign(U, { relief: 2.5, refl: 0, vig: 0.85 });
  }
  if (galOn) {
    const x0 = gv.ox, x1 = gv.ox + CW * gv.s, yT = gv.oy, yB = gv.oy + CH * gv.s;
    const lamp = { x: CW / 2, y: gv.cy - CH * gv.s * 0.62 };
    Object.assign(U, {
      gal: 1, frame: [x0, CH - yB, x1, CH - yT],
      galAmb: [0.6, 0.53, 0.5], galWarm: [0.7, 0.55, 0.36],
      galPool: [lamp.x, CH - lamp.y, CW * gv.s * 0.8, CH * gv.s * 1.05]
    });
    U.vig = lerp(U.vig, 0.7, 1 - gv.s);
  }
  glComposite(U);
  STATS.frames++;
  STATS.lastMs = performance.now() - t0ms;
  STATS.strokes = bufBGd.count + bufSH.count + bufFG.count + bufGal.count + draws.reduce((s, d) => s + d.buf.count, 0);
  STATS.verts = bufBGd.nv + bufSH.nv + bufFG.nv + bufGal.nv + draws.reduce((s, d) => s + d.buf.nv, 0);
}

// ============================================================
// Clock, input, hooks
// ============================================================
const QS = new URLSearchParams(location.search);
const FIXED_T = QS.has('t') ? parseFloat(QS.get('t')) : null;
let mode = QS.has('autoplay') ? 'play' : 'title';
const loadMs = performance.now();
let startMs = mode === 'play' ? loadMs + INTRO * 1000 : null;
let errors = 0, paused = false, pausedAt = 0;

function start() {
  if (mode !== 'title') { if (AUDIO.ctx && AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume(); return; }
  mode = 'play';
  cv.style.cursor = 'default';
  startMs = performance.now() + INTRO * 1000;
  try { audioStart(-INTRO); } catch (e) { console.warn('audio unavailable', e); AUDIO.running = false; }
}
cv.addEventListener('pointerdown', start);
// double-click for fullscreen: it is meant to be watched as a picture
cv.addEventListener('dblclick', () => {
  const d = document;
  if (d.fullscreenElement) d.exitFullscreen && d.exitFullscreen();
  else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
});
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') audioMute(!AUDIO.muted);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); start(); }
});

// Picture time follows the audio clock while the music is actually playing; otherwise the
// page clock. If the audio starts late (a suspended context), the score is re-anchored to the
// picture rather than the picture jumping back to meet it.
let audioWasRunning = false;
function nowPieceTime(now) {
  const tPerf = (now - startMs) / 1000;
  const running = AUDIO.running && AUDIO.ctx && AUDIO.ctx.state === 'running';
  if (running && !audioWasRunning && Math.abs(audioPieceTime() - tPerf) > 0.08) audioAnchor(tPerf);
  audioWasRunning = running;
  if (!running) return tPerf;
  const ta = audioPieceTime();
  startMs = now - ta * 1000;
  return ta;
}
function tick(now) {
  if (paused) return;
  try {
    if (mode === 'title') renderTitle((now - loadMs) / 1000);
    else { audioPump(); renderFrame(nowPieceTime(now)); }
  } catch (e) { if (errors++ < 3) console.error(e); }
  requestAnimationFrame(tick);
}
// test hooks (no visible UI): render a given piece time, read stats, pause/resume the clock
window.__rick = {
  render: t => { renderFrame(t); return STATS; },
  title: s => { renderTitle(s); return STATS; },
  stats: () => STATS,
  pause: () => { if (!paused) { paused = true; pausedAt = performance.now(); } },
  resume: () => { if (paused) { paused = false; if (startMs !== null) startMs += performance.now() - pausedAt; requestAnimationFrame(tick); } },
  score: () => SCORE.length,
  audioWav: (sr, peakDb) => audioRenderWav(sr, peakDb),
  audio: async (b0, b1, only) => { const r = await audioMeasure(b0, b1, only); window.__mix = r.buf; delete r.buf; return r; },
  // debug contact sheet: render piece times into a grid over the page (no UI unless called)
  sheet: (times, cols, scale) => {
    cols = cols || 4; scale = scale || 0.25;
    const w = Math.round(CW * scale), h = Math.round(CH * scale), rows = Math.ceil(times.length / cols);
    let c = document.getElementById('__sheet');
    if (!c) { c = document.createElement('canvas'); c.id = '__sheet'; c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#111;z-index:9'; document.body.appendChild(c); }
    c.width = w * cols; c.height = h * rows;
    const x = c.getContext('2d');
    x.font = `${Math.round(h * 0.07)}px sans-serif`;
    times.forEach((t, i) => {
      renderFrame(t);
      x.drawImage(cv, (i % cols) * w, Math.floor(i / cols) * h, w, h);
      x.fillStyle = '#ff0'; x.fillText(`t=${t.toFixed(2)}  b=${(t / BEAT).toFixed(1)}`, (i % cols) * w + 6, Math.floor(i / cols) * h + h * 0.09);
    });
    return times.length;
  },
  unsheet: () => { const c = document.getElementById('__sheet'); if (c) c.remove(); },
  // debug: render piece time t and blow up a region (fractions of the canvas) over the page
  zoom: (t, fx0, fy0, fx1, fy1) => {
    renderFrame(t);
    let c = document.getElementById('__sheet');
    if (!c) { c = document.createElement('canvas'); c.id = '__sheet'; c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#111;z-index:9'; document.body.appendChild(c); }
    const sx = fx0 * CW, sy = fy0 * CH, sw = (fx1 - fx0) * CW, sh = (fy1 - fy0) * CH;
    c.width = Math.round(sw); c.height = Math.round(sh);
    c.getContext('2d').drawImage(cv, sx, sy, sw, sh, 0, 0, c.width, c.height);
    return [c.width, c.height];
  }
};
if (FIXED_T !== null && isFinite(FIXED_T)) { mode = 'fixed'; renderFrame(FIXED_T); }
else requestAnimationFrame(tick);

</script>
