<script>
// ---- 00-core.js
"use strict";
// ============================================================
// Ranking dos Políticos: a 15-second vertical motion piece (1080x1920).
// 8 bars of 4/4 at 128 BPM = 32 beats = exactly 15.0 s. Everything is a pure function of time,
// so the same code plays live in the browser and renders frame by frame to video.
// ============================================================
const W = 1080, H = 1920;
const TAU = Math.PI * 2;
const BPM = 128;
const BEAT = 60 / BPM;

// ------------------------------------------------------------
// The edit was designed as 32 "story beats". The 45-second cut plays the same story on a slower
// clock: every animation runs at 30-60% speed and each key moment holds (a slow crawl, so nothing
// ever freezes dead) long enough to be read. Pairs of [output beat, story beat]; scene cuts land
// on output bar lines (multiples of 4) so the music can follow. 96 output beats = 45.0 s.
const REMAP = [
  [0, 0], [3, 1.0], [5, 1.9], [6, 2.0], [10, 2.9], [12, 4],                 // hook
  [15, 5.4], [17, 5.5], [20, 6.35], [22, 7.2], [26, 7.3], [28, 8],          // flag -> Congress (hold on 81 / 513)
  [31, 9.9], [34, 10.3], [36, 11],                                          // plenary
  [39, 13.3], [42, 13.65], [44, 14],                                        // consulte o ranking
  [48, 15.2], [50, 16.4], [54, 16.5], [56, 17],                             // critério + re-sort
  [59, 19.25], [62.5, 19.4], [64, 20],                                      // 2 minutos
  [66, 21.4], [68, 22.0], [70, 22.9], [74, 23.25], [76, 24],                // urna
  [80, 25.1], [84, 26.35], [88, 28], [91, 29.9], [96, 32],                  // logo, end card
];
const OUT_BEATS = REMAP[REMAP.length - 1][0];
const DUR = OUT_BEATS * BEAT;
// monotone cubic (Fritsch-Carlson) through REMAP: the speed changes smoothly, never backwards
const _RM = (() => {
  const n = REMAP.length, x = REMAP.map(p => p[0]), y = REMAP.map(p => p[1]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((y[i + 1] - y[i]) / (x[i + 1] - x[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], c = m[i + 1] / d[i], h = a * a + c * c;
    if (h > 9) { const t = 3 / Math.sqrt(h); m[i] = t * a * d[i]; m[i + 1] = t * c * d[i]; }
  }
  return { x, y, m };
})();
function storyBeat(ob) {
  const { x, y, m } = _RM;
  if (ob <= x[0]) return y[0];
  if (ob >= x[x.length - 1]) return y[y.length - 1];
  let i = 0;
  while (ob > x[i + 1]) i++;
  const h = x[i + 1] - x[i], t = (ob - x[i]) / h, t2 = t * t, t3 = t2 * t;
  return (2 * t3 - 3 * t2 + 1) * y[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * y[i + 1] + (t3 - t2) * h * m[i + 1];
}
// inverse (story beat -> output beat), for the sound effects that follow the picture
function outBeat(sb) {
  let lo = 0, hi = OUT_BEATS;
  for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; if (storyBeat(mid) < sb) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// Scene cuts, in beats. The middle of the piece is phrased in groups of three beats (a hemiola against
// the 4/4 drums), so the cuts at 11, 14 and 17 land off the bar line and push the edit forward.
const SC = { hook: 0, flag: 4, hemi: 8, ui: 11, crit: 14, clock: 17, urna: 20, confirm: 22, logo: 24, cta: 28, end: 32 };

// Brand palette. The logo is white on transparent, so the colour lives in the backgrounds and accents.
const C = {
  ink: '#060A22', navy: '#0B1440', navy2: '#13205C', deep: '#040716',
  blue: '#2F5BFF', sky: '#8FA8FF', green: '#16C66E', yellow: '#FFD23F', red: '#FF4D5E', orange: '#F28C28',
  white: '#FFFFFF', mute: '#A7B2DD', paper: '#F4F6FC', line: '#DCE2F2', text: '#101A46',
  flagGreen: '#009C3B', flagYellow: '#FEDF00', flagBlue: '#002776', concrete: '#EEF1F8', beige: '#E8E2D2'
};

const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (x, a, b) => clamp((x - a) / (b - a), 0, 1);
const smoothstep = (e0, e1, x) => { const t = seg(x, e0, e1); return t * t * (3 - 2 * t); };
const hash = n => { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- easing
const E = {
  lin: t => t,
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outQuint: t => 1 - Math.pow(1 - t, 5),
  inOutQuint: t => (t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2),
  inExpo: t => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
  outExpo: t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  inOutExpo: t => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2),
  outBack: (t, s) => { const c = s === undefined ? 1.70158 : s; t -= 1; return t * t * ((c + 1) * t + c) + 1; },
  inBack: (t, s) => { const c = s === undefined ? 1.70158 : s; return t * t * ((c + 1) * t - c); },
  outElastic: t => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
  // an underdamped spring settling on 1
  spring: (t, k, d) => (t <= 0 ? 0 : 1 - Math.exp(-(d || 7) * t) * Math.cos((k || 16) * t)),

const pr = (b, b0, b1, e) => (e || E.outExpo)(seg(b, b0, b1));
// an exponentially decaying kick after beat b0 (0 before it)
const kick = (b, b0, rate) => (b < b0 ? 0 : Math.exp(-(b - b0) * (rate || 6)));

// ---------- colour
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
const _rgbCache = new Map();
function rgbOf(h) { let v = _rgbCache.get(h); if (!v) { v = hexRgb(h); _rgbCache.set(h, v); } return v; }
function mix(a, b, t) {
  const x = rgbOf(a), y = rgbOf(b);
  return `rgb(${Math.round(lerp(x[0], y[0], t))},${Math.round(lerp(x[1], y[1], t))},${Math.round(lerp(x[2], y[2], t))})`;
}
function rgba(h, a) { const x = rgbOf(h); return `rgba(${x[0]},${x[1]},${x[2]},${a})`; }

// ---------- 2D helpers
function rrect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// cubic bezier through keyframes [[b, x, y], ...] with ease between them (for the pointer)
function pathAt(keys, b, e) {
  if (b <= keys[0][0]) return [keys[0][1], keys[0][2]];
  for (let i = 1; i < keys.length; i++) {
    const k0 = keys[i - 1], k1 = keys[i];
    if (b <= k1[0]) {
      const u = (e || E.inOutCubic)(seg(b, k0[0], k1[0]));
      // a slight arc so moves never look robotic
      const mx = (k0[1] + k1[1]) / 2 + (k1[2] - k0[2]) * 0.18, my = (k0[2] + k1[2]) / 2 - (k1[1] - k0[1]) * 0.18;
      const x = (1 - u) * (1 - u) * k0[1] + 2 * (1 - u) * u * mx + u * u * k1[1];
      const y = (1 - u) * (1 - u) * k0[2] + 2 * (1 - u) * u * my + u * u * k1[2];
      return [x, y];
    }
  }
  const k = keys[keys.length - 1];
  return [k[1], k[2]];
}

// ---- 02-load.js
// ============================================================
// Fonts and the logo atlas. Nothing renders until both are decoded, so the very first frame is
// already set in Poppins (a font swap mid-render would show up as a jump in the video).
// ============================================================
const ASSETS = { ready: false, atlas: null, glyph: {} };

async function loadAssets() {
  const faces = Object.keys(FONT_SRC).map(w => new FontFace('Poppins', `url(${FONT_SRC[w]})`, { weight: w, style: 'normal' }));
  await Promise.all(faces.map(f => f.load().then(ff => document.fonts.add(ff))));
  const img = new Image();
  img.src = LOGO_ATLAS_SRC;
  await img.decode();
  ASSETS.atlas = img;
  for (const g of LOGO_GLYPHS) ASSETS.glyph[g.name] = g;
  // touch every weight once so the rasteriser has them before frame 0
  const c = document.createElement('canvas').getContext('2d');
  for (const w of Object.keys(FONT_SRC)) { c.font = `${w} 40px Poppins`; c.fillText('ÁÉÍÓÚÃÕÇ Ranking 0123456789', 0, 40); }
  ASSETS.ready = true;
}

const FONT = (w, s) => `${w} ${s}px Poppins`;

// ---- 10-morph.js
// ============================================================
// Metamorphic shapes. Every shape is the same number of points, resampled by arc length, starting
// at the top and running clockwise, so any two can be blended point by point: a circle can become a
// rhombus, a bar, a star or the dome of the Congress, and the morph always turns the same way round.
// ============================================================
const NP = 160;

function resample(verts) {
  // verts: [[x, y], ...] closed polyline (dense enough to be the real outline)
  const n = verts.length, cum = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) {
    const a = verts[i], b = verts[(i + 1) % n];
    cum[i + 1] = cum[i] + Math.hypot(b[0] - a[0], b[1] - a[1]);
  }
  const L = cum[n];
  // clockwise on screen (y down) has a positive shoelace sum
  let area = 0;
  for (let i = 0; i < n; i++) { const a = verts[i], b = verts[(i + 1) % n]; area += a[0] * b[1] - b[0] * a[1]; }
  const pts = new Float32Array(NP * 2);
  let j = 0;
  for (let k = 0; k < NP; k++) {
    const s = (k / NP) * L;
    while (j < n - 1 && cum[j + 1] < s) j++;
    const a = verts[j], b = verts[(j + 1) % n];
    const u = (s - cum[j]) / ((cum[j + 1] - cum[j]) || 1);
    pts[k * 2] = lerp(a[0], b[0], u);
    pts[k * 2 + 1] = lerp(a[1], b[1], u);
  }
  let out = pts;
  if (area < 0) {                       // flip to clockwise
    out = new Float32Array(NP * 2);
    for (let k = 0; k < NP; k++) { out[k * 2] = pts[(NP - 1 - k) * 2]; out[k * 2 + 1] = pts[(NP - 1 - k) * 2 + 1]; }
  }
  // start at the point straight above the centroid
  let cx = 0, cy = 0;
  for (let k = 0; k < NP; k++) { cx += out[k * 2]; cy += out[k * 2 + 1]; }
  cx /= NP; cy /= NP;
  let best = 0, bd = 1e9;
  for (let k = 0; k < NP; k++) {
    const dx = out[k * 2] - cx, dy = out[k * 2 + 1] - cy;
    const ang = Math.atan2(dy, dx);
    const d = Math.abs(((ang + Math.PI / 2 + Math.PI) % TAU + TAU) % TAU - Math.PI);
    if (d < bd - 1e-9 || (Math.abs(d - bd) < 1e-9 && dy < out[best * 2 + 1] - cy)) { bd = d; best = k; }
  }
  const rot = new Float32Array(NP * 2);
  for (let k = 0; k < NP; k++) { rot[k * 2] = out[((k + best) % NP) * 2]; rot[k * 2 + 1] = out[((k + best) % NP) * 2 + 1]; }
  return rot;
}

// ---------- outlines (screen space)
function vCircle(cx, cy, r, n) { const v = []; n = n || 240; for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (i / n) * TAU; v.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return v; }
function vEllipse(cx, cy, rx, ry) { const v = []; for (let i = 0; i < 240; i++) { const a = -Math.PI / 2 + (i / 240) * TAU; v.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return v; }
function vRRect(x, y, w, h, r, rs) {
  // rs: per-corner radii [tl, tr, br, bl] (optional)
  const R = rs || [r, r, r, r], v = [];
  const corner = (cx, cy, rr, a0) => { for (let i = 0; i <= 12; i++) { const a = a0 + (i / 12) * (Math.PI / 2); v.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); } };
  const tl = Math.min(R[0], w / 2, h / 2), tr = Math.min(R[1], w / 2, h / 2), br = Math.min(R[2], w / 2, h / 2), bl = Math.min(R[3], w / 2, h / 2);
  if (tl > 0.01) corner(x + tl, y + tl, tl, Math.PI); else v.push([x, y]);
  if (tr > 0.01) corner(x + w - tr, y + tr, tr, -Math.PI / 2); else v.push([x + w, y]);
  if (br > 0.01) corner(x + w - br, y + h - br, br, 0); else v.push([x + w, y + h]);
  if (bl > 0.01) corner(x + bl, y + h - bl, bl, Math.PI / 2); else v.push([x, y + h]);
  return v;
}
function vPoly(cx, cy, r, n, rot) { const v = []; for (let i = 0; i < n; i++) { const a = (rot || 0) - Math.PI / 2 + (i / n) * TAU; v.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return v; }
function vStar(cx, cy, r1, r2, n, rot) { const v = []; for (let i = 0; i < n * 2; i++) { const a = (rot || 0) - Math.PI / 2 + (i / (n * 2)) * TAU; const r = i % 2 ? r2 : r1; v.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return v; }
function vRhombus(cx, cy, w, h) { return [[cx, cy - h / 2], [cx + w / 2, cy], [cx, cy + h / 2], [cx - w / 2, cy]]; }
// half ellipse: dome (curve up, flat side at cy) or bowl (curve down, flat side at cy)
function vHalf(cx, cy, rx, ry, dome) {
  const v = [];
  for (let i = 0; i <= 120; i++) { const a = Math.PI + (i / 120) * Math.PI; v.push([cx + Math.cos(a) * rx, cy + (dome ? 1 : -1) * Math.sin(a) * ry]); }
  return dome ? v : v.reverse();
}

const S_ = {
  circle: (cx, cy, r) => resample(vCircle(cx, cy, r)),
  ellipse: (cx, cy, rx, ry) => resample(vEllipse(cx, cy, rx, ry)),
  rrect: (x, y, w, h, r, rs) => resample(vRRect(x, y, w, h, r, rs)),
  rect: (cx, cy, w, h, r) => resample(vRRect(cx - w / 2, cy - h / 2, w, h, r || 0)),
  poly: (cx, cy, r, n, rot) => resample(vPoly(cx, cy, r, n, rot)),
  star: (cx, cy, r1, r2, n, rot) => resample(vStar(cx, cy, r1, r2, n || 5, rot)),
  rhombus: (cx, cy, w, h) => resample(vRhombus(cx, cy, w, h)),
  half: (cx, cy, rx, ry, dome) => resample(vHalf(cx, cy, rx, ry, dome)),
};

// unit shapes (radius ~1 about the origin) for the free-floating morphers
const UNIT = {
  circle: S_.circle(0, 0, 1),
  square: S_.rect(0, 0, 1.7, 1.7, 0.18),
  rhombus: S_.rhombus(0, 0, 2.1, 2.1),
  tri: S_.poly(0, 0.18, 1.2, 3),
  star: S_.star(0, 0, 1.2, 0.52, 5),
  pill: S_.rect(0, 0, 2.3, 0.9, 0.45),
  hex: S_.poly(0, 0, 1.08, 6, Math.PI / 6),
  bar: S_.rrect(-0.35, -1.1, 0.7, 2.2, 0, [0.35, 0, 0, 0]),
};
const CYCLE = ['circle', 'rhombus', 'square', 'tri', 'star', 'hex', 'pill', 'bar'];

function morphPts(A, B, t, out) {
  out = out || new Float32Array(NP * 2);
  for (let i = 0; i < NP * 2; i++) out[i] = A[i] + (B[i] - A[i]) * t;
  return out;
}
// a shape that keeps turning into the next one in CYCLE: phase in "shapes" (1.0 = one full morph)
const _cyc = new Float32Array(NP * 2);
function cyclePts(phase, list) {
  list = list || CYCLE;
  const n = list.length, i = ((Math.floor(phase) % n) + n) % n, f = phase - Math.floor(phase);
  // hold each shape for a moment, then snap-morph with an ease: reads as deliberate, not mushy
  const u = E.inOutCubic(smoothstep(0.35, 1, f));
  return morphPts(UNIT[list[i]], UNIT[list[(i + 1) % n]], u, _cyc);
}
function xformPts(P, cx, cy, s, rot, out, sy) {
  out = out || new Float32Array(NP * 2);
  const c = Math.cos(rot || 0), si = Math.sin(rot || 0), syy = sy === undefined ? s : sy;
  for (let k = 0; k < NP; k++) {
    const x = P[k * 2] * s, y = P[k * 2 + 1] * syy;
    out[k * 2] = cx + x * c - y * si;
    out[k * 2 + 1] = cy + x * si + y * c;
  }
  return out;
}
function tracePts(ctx, P) {
  ctx.beginPath();
  ctx.moveTo(P[0], P[1]);
  for (let k = 1; k < NP; k++) ctx.lineTo(P[k * 2], P[k * 2 + 1]);
  ctx.closePath();
}
function fillPts(ctx, P, style) { tracePts(ctx, P); ctx.fillStyle = style; ctx.fill(); }
function ptsCentroid(P) { let x = 0, y = 0; for (let k = 0; k < NP; k++) { x += P[k * 2]; y += P[k * 2 + 1]; } return [x / NP, y / NP]; }

// ---- 15-type.js
// ============================================================
// Kinetic type. Lines are laid out letter by letter (advances measured from prefixes, so Poppins'
// kerning survives) and every letter animates on its own clock: masked rises, slams, pops.
// ============================================================
const _adv = new Map();
function layoutLine(ctx, text, weight, size, track) {
  const key = `${weight}|${size}|${track}|${text}`;
  let L = _adv.get(key);
  if (L) return L;
  ctx.save();
  ctx.font = FONT(weight, size);
  const xs = [];
  for (let i = 0; i < text.length; i++) xs.push(ctx.measureText(text.slice(0, i)).width + i * track);
  const w = ctx.measureText(text).width + (text.length - 1) * track;
  const ws = [];
  for (let i = 0; i < text.length; i++) ws.push(ctx.measureText(text[i]).width);
  ctx.restore();
  L = { xs, ws, w };
  _adv.set(key, L);
  return L;
}
// the largest size <= size at which the line fits in maxW
function fitSize(ctx, text, weight, size, track, maxW) {
  const L = layoutLine(ctx, text, weight, size, track);
  return L.w <= maxW ? size : Math.floor(size * maxW / L.w);
}

// o: { text, x, y (baseline), size, weight, color, align ('center'|'left'|'right'), track,
//      tIn, tOut (beats), style ('rise'|'slam'|'pop'|'drop'), stagger (beats), dur (beats),
//      mask (clip rises to the line box), maxW, hl: {from, to, color, text, b} marker highlight }
// b: current beat. Returns the laid-out box (for leaders, markers...).
function kLine(ctx, b, o) {
  const weight = o.weight || 800, track = o.track || 0;
  let size = o.size;
  if (o.maxW) size = fitSize(ctx, o.text, weight, size, track, o.maxW);
  const L = layoutLine(ctx, o.text, weight, size, track);
  const x0 = o.align === 'left' ? o.x : o.align === 'right' ? o.x - L.w : o.x - L.w / 2;
  const box = { x: x0, y: o.y, w: L.w, size, top: o.y - size * 0.78, bot: o.y + size * 0.22 };
  if (b < o.tIn - 0.01 || (o.tOut !== undefined && b > o.tOut + (o.outDur || 0.6) + 0.2)) return box;
  const style = o.style || 'rise', st = o.stagger === undefined ? 0.045 : o.stagger, dur = o.dur || 0.9;
  const n = o.text.length;
  ctx.save();
  ctx.font = FONT(weight, size);
  ctx.textBaseline = 'alphabetic';
  if (o.mask) {
    ctx.beginPath();
    ctx.rect(x0 - size, o.y - size * 1.05, L.w + size * 2, size * 1.42);
    ctx.clip();
  }
  // highlight marker behind a span of letters
  if (o.hl && b >= o.hl.b) {
    const h = o.hl, p = pr(b, h.b, h.b + 0.55, E.outExpo);
    const hx0 = x0 + L.xs[h.from] - size * 0.12, hx1 = x0 + L.xs[h.to - 1] + L.ws[h.to - 1] + size * 0.12;
    ctx.fillStyle = h.color;
    ctx.save();
    ctx.transform(1, 0, -0.18, 1, o.y * 0.18, 0);
    ctx.fillRect(hx0, o.y - size * 0.8, (hx1 - hx0) * p, size * 0.98);
    ctx.restore();
  }
  for (let i = 0; i < n; i++) {
    const ch = o.text[i];
    if (ch === ' ') continue;
    const bi = o.tIn + i * st;
    const pIn = seg(b, bi, bi + dur);
    let pOut = 0;
    if (o.tOut !== undefined) { const bo = o.tOut + i * (o.outStagger === undefined ? st * 0.6 : o.outStagger); pOut = seg(b, bo, bo + (o.outDur || 0.5)); }
    if (pIn <= 0 || pOut >= 1) continue;
    let dx = 0, dy = 0, sc = 1, al = 1, rot = 0;
    if (style === 'rise') { dy = (1 - E.outExpo(pIn)) * size * 1.1; }
    else if (style === 'drop') { dy = -(1 - E.outExpo(pIn)) * size * 1.1; }
    else if (style === 'pop') { sc = E.outBack(pIn, 2.2); al = Math.min(1, pIn * 4); rot = (1 - E.outCubic(pIn)) * (hash(i + n) - 0.5) * 0.9; }
    else if (style === 'slam') { const q = E.outExpo(pIn); sc = lerp(2.6, 1, q); al = Math.min(1, pIn * 5); }
    if (pOut > 0) {
      const q = E.inExpo(pOut);
      if (o.outStyle === 'fall') dy += q * size * 1.2;
      else if (o.outStyle === 'fade') al *= 1 - q;
      else dy -= q * size * 1.15;
    }
    if (al <= 0.001 || sc <= 0.001) continue;
    const cx = x0 + L.xs[i] + L.ws[i] / 2, cy = o.y - size * 0.35;
    ctx.save();
    ctx.globalAlpha *= al;
    ctx.translate(cx + dx, cy + dy);
    if (rot) ctx.rotate(rot);
    if (sc !== 1) ctx.scale(sc, sc);
    let col = o.color || C.white;
    if (o.hl && i >= o.hl.from && i < o.hl.to && b >= o.hl.b && o.hl.text) col = mix(col, o.hl.text, pr(b, o.hl.b, o.hl.b + 0.3));
    if (o.colors && o.colors[i]) col = o.colors[i];
    ctx.fillStyle = col;
    ctx.fillText(ch, -L.ws[i] / 2, size * 0.35);
    // slam smear: a couple of fading ghosts trailing the letter as it lands
    if (style === 'slam' && pIn < 0.45) {
      ctx.globalAlpha *= 0.25;
      ctx.scale(1.18, 1.18); ctx.fillText(ch, -L.ws[i] / 2, size * 0.35);
      ctx.scale(1.18, 1.18); ctx.fillText(ch, -L.ws[i] / 2, size * 0.35);
    }
    ctx.restore();
  }
  ctx.restore();
  return box;
}

// small caps label with wide tracking
function label(ctx, text, x, y, size, color, align, track, weight) {
  ctx.save();
  ctx.font = FONT(weight || 700, size);
  const L = layoutLine(ctx, text, weight || 700, size, track || 0);
  const x0 = align === 'left' ? x : align === 'right' ? x - L.w : x - L.w / 2;
  ctx.fillStyle = color;
  if (!track) ctx.fillText(text, x0, y);
  else for (let i = 0; i < text.length; i++) ctx.fillText(text[i], x0 + L.xs[i], y);
  ctx.restore();
  return L.w;
}

// ---- 20-fx.js
// ============================================================
// Shared pieces: backgrounds, the pointer, tap ripples, confetti of morphing shapes.
// ============================================================
function bgNavy(ctx, b, top, bot, glowY) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, top || C.ink);
  g.addColorStop(1, bot || C.navy);
  ctx.fillStyle = g;
  ctx.fillRect(-W, -H, W * 3, H * 3);
  if (glowY !== undefined) {
    const r = ctx.createRadialGradient(W / 2, glowY, 0, W / 2, glowY, 900);
    r.addColorStop(0, 'rgba(60,100,255,0.28)');
    r.addColorStop(1, 'rgba(60,100,255,0)');
    ctx.fillStyle = r;
    ctx.fillRect(-W, -H, W * 3, H * 3);
  }
}
// a faint dot grid drifting upward: the "data" texture under the UI scenes
function dotGrid(ctx, b, alpha, step) {
  step = step || 54;
  const off = (b * 9) % step;
  ctx.fillStyle = `rgba(160,180,255,${alpha})`;
  for (let y = -step; y < H + step; y += step) {
    for (let x = step / 2; x < W; x += step) {
      ctx.fillRect(x - 1.5, y - off - 1.5, 3, 3);
    }
  }
}

// the pointer (arrow cursor) with a press squash
function pointer(ctx, x, y, press, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  const s = 1.55 * (1 - 0.14 * press);
  ctx.scale(s, s);
  ctx.rotate(-0.08);
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, 46); ctx.lineTo(11, 36); ctx.lineTo(19, 55); ctx.lineTo(27, 51); ctx.lineTo(19, 33); ctx.lineTo(34, 33);
  ctx.closePath();
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.strokeStyle = C.text; ctx.stroke();
  ctx.restore();
}
function ripple(ctx, x, y, b, b0, color, maxR) {
  const p = seg(b, b0, b0 + 1.1);
  if (p <= 0 || p >= 1) return;
  ctx.save();
  ctx.strokeStyle = color || '#fff';
  for (let k = 0; k < 2; k++) {
    const q = seg(p, k * 0.18, 1);
    if (q <= 0) continue;
    ctx.globalAlpha = (1 - q) * 0.9;
    ctx.lineWidth = 6 * (1 - q) + 1;
    ctx.beginPath(); ctx.arc(x, y, (maxR || 90) * E.outExpo(q), 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

// a burst of little morphing shapes flying out from (x, y) at beat b0
const BURST_COLS = [C.yellow, C.green, C.blue, C.white, C.sky];
function burst(ctx, b, b0, x, y, n, seed, spread, cols, sizeK) {
  const T = b - b0;
  if (T < 0 || T > 4) return;
  const r = mulberry(seed);
  cols = cols || BURST_COLS;
  for (let i = 0; i < n; i++) {
    const ang = r() * TAU, sp = (0.4 + r() * 0.6) * (spread || 520);
    const life = 1.4 + r() * 1.6;
    const q = T / life;
    if (q >= 1) { r(); r(); r(); continue; }
    const d = sp * (1 - Math.exp(-T * 3.2)) / 1.0;
    const px = x + Math.cos(ang) * d, py = y + Math.sin(ang) * d + T * T * 40;
    const sz = (6 + r() * 16) * (sizeK || 1) * (1 - E.inCubic(q));
    const col = cols[Math.floor(r() * cols.length)];
    const ph = r() * 8 + T * 2.2;
    ctx.globalAlpha = 1 - E.inCubic(q);
    fillPts(ctx, xformPts(cyclePts(ph), px, py, sz, T * (r() - 0.5) * 6), col);
  }
  ctx.globalAlpha = 1;
}

// soft glow disc (additive-looking) used for spotlights and hits
function glow(ctx, x, y, r, color, a) {
  if (a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(color, a));
  g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

// camera shake from a list of impacts [[beat, px], ...]
function shakeAt(b, list) {
  let x = 0, y = 0;
  for (const [b0, amp] of list) {
    const k = kick(b, b0, 7) * amp;
    if (k < 0.05) continue;
    x += noise1(b * 38 + b0 * 3) * k;
    y += noise1(b * 41 + b0 * 7 + 50) * k;
  }
  return [x, y];
}

// ---- 30-hook-flag.js
// ============================================================
// Scene 1 (beats 0-4): the hook. "VAI VOTAR NO ESCURO?" under a failing lamp, a blackout, and one
// point of light that blows up into the whole frame.
// Scene 2 (beats 4-8): the flag, rebuilt from its geometry, then taken apart into Brasília: the globe
// splits into the Senate dome and the Chamber bowl, the rhombus flattens into the roof slab and
// the twin towers rise. The bowl then flips over and becomes the plenary of scene 3.
// ============================================================

// the failing lamp: 1 = lit. Shared with the audio (every stutter gets a zap).
function lampAt(b) {
  if (b < 2.06) return 0;
  const k = Math.floor(b * 16);
  if (b < 2.3) return hash(k * 1.7) < 0.5 ? 0.25 : 1;
  if (b > 2.62 && hash(k * 3.7 + 1) < (b - 2.55) * 0.62) return 0.12;
  return 1;
}

function sceneHook(ctx, b) {
  ctx.fillStyle = C.deep;
  ctx.fillRect(0, 0, W, H);
  if (b >= 3.5) {
    // blackout, then one point of light that swells into the frame
    if (b >= 3.6) {
      const grow = E.inExpo(seg(b, 3.78, 4.0));
      const r = lerp(10 + 3 * Math.sin(b * 40), 1250, grow);
      glow(ctx, 540, 960, 120 + r * 1.4, '#AFC2FF', 0.5 * seg(b, 3.6, 3.7));
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(540, 960, r, 0, TAU); ctx.fill();
    }
    return;
  }
  const lamp = lampAt(b);
  // subtle cold room light once the lamp is on
  glow(ctx, 540, 1000, 900, '#2A3FA0', 0.28 * lamp);

  // the filament: a line of light that draws itself, then becomes the text's floor
  if (b < 1.4) {
    const p = pr(b, 0.05, 0.85, E.outExpo), out = pr(b, 1.0, 1.35, E.inExpo);
    const w = 860 * p * (1 - out), fl = 0.75 + 0.25 * Math.sin(b * 70);
    glow(ctx, 540, 960, 520 * p, '#6F8BFF', 0.3 * p * (1 - out));
    ctx.save();
    ctx.shadowColor = '#9FB4FF'; ctx.shadowBlur = 36;
    ctx.fillStyle = `rgba(255,255,255,${fl})`;
    ctx.fillRect(540 - w / 2, 957, w, 5);
    ctx.restore();
  }

  // VAI VOTAR
  kLine(ctx, b, { text: 'VAI VOTAR', x: 540, y: 900, size: 150, weight: 800, maxW: 930, tIn: 1.0, style: 'rise', mask: true, stagger: 0.05, dur: 1.0 });

  // NO ESCURO? - hollow letters, only filled where the flickering spotlight lands
  if (b >= 2.0) {
    const text = 'NO ESCURO?';
    const size = fitSize(ctx, text, 900, 168, 0, 950);
    const L = layoutLine(ctx, text, 900, size, 0);
    const x0 = 540 - L.w / 2, y = 1085;
    const app = pr(b, 2.0, 2.35, E.outExpo);
    const jit = b > 3.0 ? E.inCubic(seg(b, 3.0, 3.5)) * 26 : 0;
    const jk = Math.floor(b * 24);
    ctx.save();
    ctx.font = FONT(900, size);
    const sc = lerp(1.12, 1, app);
    ctx.translate(540, y - size * 0.35); ctx.scale(sc, sc); ctx.translate(-540, -(y - size * 0.35));
    const drawLetters = fill => {
      for (let i = 0; i < text.length; i++) {
        if (text[i] === ' ') continue;
        const jx = jit * (hash(jk * 7 + i) - 0.5), jy = jit * (hash(jk * 11 + i + 3) - 0.5);
        if (fill) ctx.fillText(text[i], x0 + L.xs[i] + jx, y + jy);
        else ctx.strokeText(text[i], x0 + L.xs[i] + jx, y + jy);
      }
    };
    ctx.lineWidth = 2.5; ctx.strokeStyle = `rgba(143,168,255,${0.42 * app})`;
    drawLetters(false);
    // spotlight
    const sx = 540 + Math.sin((b - 2.0) * 2.1 - 1.2) * 340 + noise1(b * 3) * 50;
    const sy = 1010 + noise1(b * 2.3 + 9) * 36;
    if (lamp > 0) {
      ctx.save();
      ctx.beginPath(); ctx.arc(sx, sy, 245, 0, TAU); ctx.clip();
      glow(ctx, sx, sy, 300, '#C8D6FF', 0.22 * lamp);
      ctx.fillStyle = `rgba(255,255,255,${lamp})`;
      drawLetters(true);
      ctx.restore();
      // the rim of the beam
      ctx.strokeStyle = `rgba(200,214,255,${0.18 * lamp})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, 245, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
}

// ---------- scene 2 geometry
const FLAG = {
  cx: 540, cy: 960, r: 320,
  rh: [[540, 405], [1030, 960], [540, 1515], [50, 960]],       // rhombus vertices T R B L
  band: { cx: 380, cy: 1880, r0: 940, r1: 998 },
};
const CONG = {
  slabY: 1229, slabH: 22, groundY: 1330, poolY: 1500,
  dome: { cx: 300, rx: 135, ry: 88 }, bowl: { cx: 790, rx: 190, ry: 100 },
  towers: [[487, 533], [547, 593]], towerTop: 560,
};
// 27 stars: one for each state and the Federal District, one above the band as on the flag
const STARS = (() => {
  const r = mulberry(27), out = [[620, 872, 13]];
  let guard = 0;
  while (out.length < 27 && guard++ < 5000) {
    const x = FLAG.cx + (r() * 2 - 1) * 290, y = FLAG.cy + (r() * 2 - 1) * 290;
    if (Math.hypot(x - FLAG.cx, y - FLAG.cy) > 280) continue;
    if (Math.hypot(x - FLAG.band.cx, y - FLAG.band.cy) > FLAG.band.r0 - 22) continue;
    if (out.some(s => Math.hypot(s[0] - x, s[1] - y) < 46)) continue;
    out.push([x, y, 7 + r() * 8]);
  }
  // where each star goes when the flag becomes the night sky over Brasília
  return out.map((s, i) => ({ x: s[0], y: s[1], r: s[2], sx: 60 + hash(i * 3.1) * 960, sy: 170 + hash(i * 5.7 + 2) * 470, tw: hash(i * 9.3) * TAU }));
})();

const SH2 = {};     // cached morph endpoints
function flagShapes() {
  if (SH2.ready) return SH2;
  SH2.rh = S_.rhombus(540, 960, 980, 1110);
  SH2.slab = S_.rect(540, CONG.slabY + CONG.slabH / 2, 940, CONG.slabH, 3);
  SH2.up = S_.half(FLAG.cx, FLAG.cy, FLAG.r, FLAG.r, true);
  SH2.low = S_.half(FLAG.cx, FLAG.cy, FLAG.r, FLAG.r, false);
  SH2.dome = S_.half(CONG.dome.cx, CONG.slabY, CONG.dome.rx, CONG.dome.ry, true);
  SH2.bowl = S_.half(CONG.bowl.cx, CONG.slabY - CONG.bowl.ry, CONG.bowl.rx, CONG.bowl.ry, false);
  SH2.plen = S_.half(540, 1420, 490, 490, true);     // the plenary of scene 3
  SH2.tmp = new Float32Array(NP * 2);
  SH2.ready = true;
  return SH2;
}

function nightSky(ctx, b) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#050A26');
  g.addColorStop(0.55, '#0D1A52');
  g.addColorStop(0.68, '#27418F');
  g.addColorStop(0.69, '#0B1440');
  g.addColorStop(1, '#060B26');
  ctx.fillStyle = g;
  ctx.fillRect(-W, -H, W * 3, H * 3);
}

function drawStar(ctx, x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + (i / 10) * TAU, rr = i % 2 ? r * 0.45 : r;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}

// the band with "ORDEM E PROGRESSO" along it, swept in by angle
function flagBand(ctx, b, alpha) {
  const B = FLAG.band, sweep = pr(b, 4.35, 4.9, E.outCubic);
  if (sweep <= 0 || alpha <= 0) return;
  const a0 = -106 * Math.PI / 180, a1 = lerp(a0, -52 * Math.PI / 180, sweep);
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.beginPath(); ctx.arc(FLAG.cx, FLAG.cy, FLAG.r * 0.999, 0, TAU); ctx.clip();
  ctx.beginPath();
  ctx.arc(B.cx, B.cy, B.r1, a0, a1);
  ctx.arc(B.cx, B.cy, B.r0, a1, a0, true);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  // lettering, bent along the band
  const text = 'ORDEM E PROGRESSO', size = 29, track = 3.2;
  const L = layoutLine(ctx, text, 700, size, track);
  const R = (B.r0 + B.r1) / 2 - size * 0.34;
  const ac = Math.atan2(FLAG.cy - 30 - B.cy, FLAG.cx - B.cx);
  ctx.font = FONT(700, size);
  ctx.fillStyle = C.flagGreen;
  for (let i = 0; i < text.length; i++) {
    const s = L.xs[i] + L.ws[i] / 2 - L.w / 2;
    const a = ac + s / R;
    if (a > a1 - 0.01) continue;
    const q = pr(b, 4.55 + i * 0.022, 4.8 + i * 0.022, E.outBack);
    if (q <= 0) continue;
    ctx.save();
    ctx.translate(B.cx + Math.cos(a) * R, B.cy + Math.sin(a) * R);
    ctx.rotate(a + Math.PI / 2);
    ctx.scale(q, q);
    ctx.fillText(text[i], -L.ws[i] / 2, size * 0.36);
    ctx.restore();
  }
  ctx.restore();
}

function sceneFlag(ctx, b) {
  const S = flagShapes();
  ctx.fillStyle = C.flagGreen;
  ctx.fillRect(0, 0, W, H);

  // camera: lands tilted and settles, breathes on the downbeat, then stays put for the build
  const land = pr(b, 4.0, 5.0, E.outExpo);
  let cs = lerp(1.1, 1, land) + 0.018 * kick(b, 5, 5) + 0.012 * kick(b, 6, 5);
  let crot = lerp(-0.07, 0, land);
  const [shx, shy] = shakeAt(b, [[4, 22], [6.0, 8]]);
  // the flip into the plenary: everything but the bowl drops out of frame
  const drop = E.inCubic(seg(b, 7.25, 7.85));
  ctx.save();
  ctx.translate(540 + shx, 960 + shy); ctx.rotate(crot); ctx.scale(cs, cs); ctx.translate(-540, -960);

  // flood: the globe's blue floods outward and becomes the night
  const flood = E.inOutExpo(seg(b, 5.5, 6.15));
  if (flood > 0) {
    ctx.save();
    ctx.beginPath(); ctx.arc(FLAG.cx, FLAG.cy, lerp(FLAG.r, 1500, flood), 0, TAU); ctx.clip();
    nightSky(ctx, b);
    ctx.restore();
  }
  const night = seg(b, 5.6, 6.3);

  // stars: pop in on the globe, then scatter into the sky and twinkle
  const fly = E.inOutCubic(seg(b, 5.55, 6.35));
  STARS.forEach((s, i) => {
    const q = pr(b, 4.6 + i * 0.028, 4.95 + i * 0.028, E.outBack);
    if (q <= 0) return;
    const x = lerp(s.x, s.sx, fly), y = lerp(s.y, s.sy, fly) - Math.sin(fly * Math.PI) * 120;
    const tw = fly > 0.9 ? 0.55 + 0.45 * Math.sin(b * 5 + s.tw) : 1;
    const r = lerp(s.r, 3 + s.r * 0.25, fly) * q;
    ctx.fillStyle = `rgba(255,255,255,${(0.35 + 0.65 * tw) * (1 - 0.8 * seg(b, 7.4, 7.95))})`;
    if (fly < 0.98) drawStar(ctx, x, y, r, fly * 3);
    else { ctx.beginPath(); ctx.arc(x, y, r * 0.8, 0, TAU); ctx.fill(); }
  });

  // rhombus: corners fly in from the four edges, later it flattens into the roof slab
  if (b < 5.55) {
    const from = [[540, -260], [1400, 960], [540, 2200], [-320, 960]];
    ctx.beginPath();
    FLAG.rh.forEach((v, i) => {
      const q = pr(b, 4.08 + i * 0.07, 4.62 + i * 0.07, E.outExpo);
      const x = lerp(from[i][0], v[0], q), y = lerp(from[i][1], v[1], q);
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = C.flagYellow;
    ctx.fill();
  }

  // Congress, built as a layer so it can be mirrored in the reflecting pool
  const build = seg(b, 5.55, 8);
  if (b >= 5.55) {
    ctx.save();
    ctx.translate(0, drop * 900);
    ctx.globalAlpha = 1 - drop;
    congress(ctx, b, S, false);
    // reflecting pool: the same drawing, flipped about the waterline, faded
    const water = pr(b, 6.1, 6.7, E.outCubic);
    if (water > 0) {
      ctx.save();
      ctx.beginPath(); ctx.rect(0, CONG.groundY, W, CONG.poolY - CONG.groundY); ctx.clip();
      ctx.fillStyle = '#081238'; ctx.fillRect(0, CONG.groundY, W, CONG.poolY - CONG.groundY);
      ctx.globalAlpha *= 0.32 * water;
      ctx.translate(0, CONG.groundY * 2); ctx.scale(1, -1);
      congress(ctx, b, S, true);
      ctx.restore();
      // ripples of light on the water
      ctx.save();
      ctx.globalAlpha *= water;
      for (let k = 0; k < 9; k++) {
        const y = CONG.groundY + 18 + k * 19, w = 120 + hash(k) * 320, x = (hash(k * 3) * 900 + b * 40 * (k % 2 ? 1 : -1)) % 1000;
        ctx.fillStyle = 'rgba(160,190,255,0.10)'; ctx.fillRect(x, y, w, 2);
      }
      ctx.fillStyle = '#050A22'; ctx.fillRect(0, CONG.poolY, W, H - CONG.poolY);
      ctx.fillStyle = 'rgba(160,190,255,0.25)'; ctx.fillRect(0, CONG.groundY, W, 2);
      ctx.restore();
    }
    ctx.restore();
  }

  // the globe: one circle (from the burst of light), then two halves that become dome and bowl
  if (b < 5.55) {
    const q = E.outExpo(seg(b, 4.0, 4.55));
    const r = lerp(1250, FLAG.r, q);
    ctx.fillStyle = mix('#FFFFFF', C.flagBlue, seg(b, 4.0, 4.32));
    ctx.beginPath(); ctx.arc(FLAG.cx, FLAG.cy, r, 0, TAU); ctx.fill();
    // stars sit on the globe; draw them again on top of it
    STARS.forEach((s, i) => {
      const qq = pr(b, 4.6 + i * 0.028, 4.95 + i * 0.028, E.outBack);
      if (qq <= 0) return;
      ctx.fillStyle = '#fff';
      drawStar(ctx, s.x, s.y, s.r * qq, 0);
    });
    flagBand(ctx, b, 1 - seg(b, 5.4, 5.55));
  } else {
    const m = E.inOutExpo(seg(b, 5.6, 6.3));
    const col = mix(C.flagBlue, C.concrete, seg(b, 5.85, 6.3));
    // a small split before the morph (anticipation)
    const gap = 16 * Math.sin(Math.PI * seg(b, 5.55, 5.95));
    morphPts(S.up, S.dome, m, S.tmp);
    ctx.save(); ctx.translate(0, -gap * (1 - m)); ctx.translate(0, drop * 900); ctx.globalAlpha = 1 - drop;
    domeFill(ctx, S.tmp, col, m);
    ctx.restore();
    // the bowl keeps going: it flips over and swells into the plenary
    const flip = E.inOutExpo(seg(b, 7.3, 8.0));
    if (flip <= 0) {
      morphPts(S.low, S.bowl, m, S.tmp);
      ctx.save(); ctx.translate(0, gap * (1 - m));
      domeFill(ctx, S.tmp, col, m);
      ctx.restore();
    } else {
      morphPts(S.bowl, S.plen, flip, S.tmp);
      // scene 3 opens zoomed in 1.5x on the plenary: meet it there
      const z = lerp(1, 1.5, flip);
      ctx.save(); ctx.translate(540, 1420); ctx.scale(z, z); ctx.translate(-540, -1420);
      fillPts(ctx, S.tmp, mix(C.concrete, '#16235F', E.inOutCubic(seg(b, 7.3, 7.8))));
      ctx.restore();
    }
  }

  // labels and counters
  if (b >= 6.35 && drop < 1) {
    ctx.save();
    ctx.globalAlpha = 1 - E.inCubic(seg(b, 7.2, 7.55));
    counterLabel(ctx, b, 6.4, CONG.dome.cx, 1040, 81, 'SENADORES');
    counterLabel(ctx, b, 6.55, CONG.bowl.cx, 1012, 513, 'DEPUTADOS');
    const h = pr(b, 6.2, 6.8);
    if (h > 0) {
      ctx.globalAlpha *= h;
      label(ctx, 'CONGRESSO NACIONAL', 540, 395 - 30 * (1 - h), 34, C.mute, 'center', 9, 700);
      ctx.fillStyle = rgba(C.mute, 0.6);
      const lw = 90 * h;
      ctx.fillRect(540 - 280 - lw, 383, lw, 2); ctx.fillRect(540 + 280, 383, lw, 2);
    }
    ctx.restore();
  }
  ctx.restore();
}

function domeFill(ctx, P, col, m) {
  tracePts(ctx, P);
  ctx.fillStyle = col;
  ctx.fill();
  if (m > 0.6) {
    // concrete shading: lit from the left
    const [cx] = ptsCentroid(P);
    const g = ctx.createLinearGradient(cx - 200, 0, cx + 200, 0);
    g.addColorStop(0, 'rgba(255,255,255,0.0)');
    g.addColorStop(1, `rgba(20,30,80,${0.35 * seg(m, 0.6, 1)})`);
    ctx.fillStyle = g;
    ctx.fill();
  }
}

function counterLabel(ctx, b, b0, x, y, n, word) {
  const p = seg(b, b0, b0 + 0.6);
  if (p <= 0) return;
  const v = Math.round(n * E.outCubic(p));
  const a = pr(b, b0, b0 + 0.35);
  ctx.save();
  ctx.globalAlpha *= a;
  ctx.font = FONT(900, 118);
  ctx.textAlign = 'center';
  ctx.fillStyle = C.yellow;
  ctx.fillText(String(v), x, y - 20 * (1 - a));
  ctx.textAlign = 'left';
  label(ctx, word, x, y + 46, 30, C.white, 'center', 5, 700);
  // leader tick down to the building
  const lh = 26 * pr(b, b0 + 0.2, b0 + 0.6);
  ctx.fillStyle = rgba(C.white, 0.7);
  ctx.fillRect(x - 1, y + 60, 2, lh);
  ctx.beginPath(); ctx.arc(x, y + 62 + lh, 4, 0, TAU); ctx.fill();
  ctx.restore();
}

// the Congress without the dome and bowl (they are drawn by the morph)
function congress(ctx, b, S, mirrored) {
  // slab (the rhombus, flattened)
  const m = E.inOutExpo(seg(b, 5.55, 6.2));
  if (!mirrored) {
    morphPts(S.rh, S.slab, m, S.tmp);
    fillPts(ctx, S.tmp, mix(C.flagYellow, C.concrete, seg(b, 5.75, 6.2)));
  } else {
    fillPts(ctx, S.slab, C.concrete);
    fillPts(ctx, S.dome, C.concrete);
    if (b < 7.3) fillPts(ctx, S.bowl, C.concrete);
  }
  // main block under the slab, opening from the middle
  const open = pr(b, 6.05, 6.55, E.outExpo);
  if (open > 0) {
    const w = 840 * open, x0 = 540 - w / 2;
    ctx.fillStyle = '#9AA6CB';
    ctx.fillRect(x0, CONG.slabY + CONG.slabH, w, CONG.groundY - CONG.slabY - CONG.slabH);
    ctx.fillStyle = 'rgba(10,20,60,0.35)';
    for (let x = x0 + 14; x < x0 + w - 6; x += 28) ctx.fillRect(x, CONG.slabY + CONG.slabH + 8, 3, CONG.groundY - CONG.slabY - CONG.slabH - 8);
    // the ramp up to the roof
    ctx.fillStyle = C.concrete;
    ctx.beginPath();
    ctx.moveTo(lerp(540, 40, open), CONG.groundY); ctx.lineTo(lerp(540, 190, open), CONG.slabY + CONG.slabH);
    ctx.lineTo(lerp(540, 226, open), CONG.slabY + CONG.slabH); ctx.lineTo(lerp(540, 84, open), CONG.groundY);
    ctx.closePath(); ctx.fill();
  }
  // the twin towers rise out of the slab
  CONG.towers.forEach(([x0, x1], i) => {
    const q = pr(b, 6.0 + i * 0.1, 6.75 + i * 0.1, E.outExpo);
    if (q <= 0) return;
    const top = lerp(CONG.slabY, CONG.towerTop, q);
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, i ? '#C9D1EA' : '#F2F4FA');
    g.addColorStop(1, i ? '#A7B2D6' : '#D5DCEF');
    ctx.fillStyle = g;
    ctx.fillRect(x0, top, x1 - x0, CONG.slabY - top);
    ctx.fillStyle = 'rgba(15,25,70,0.16)';
    for (let y = top + 12; y < CONG.slabY - 6; y += 22) ctx.fillRect(x0 + 5, y, x1 - x0 - 10, 3);
  });
  // the bridge between the towers (the H)
  const hq = pr(b, 6.55, 6.85);
  if (hq > 0) { ctx.fillStyle = '#DCE2F2'; ctx.fillRect(533, 868, 14 * hq, 34); }
}

// ---- 40-hemi-ui.js
// ============================================================
// Scene 3 (beats 8-11): the plenary. 513 seats pop in left to right, then take the colour of
// their score, a wave out from the centre. Then they are sucked into the avatars of the ranking.
// Scene 4 (beats 11-17): the ranking itself, as a browser card: search, filters, rows that score,
// criteria that add and subtract points, and a re-sort that crowns a new first place.
// ============================================================
const HEMI = { cx: 540, cy: 1420, r0: 175, r1: 465, rows: 12, dot: 9.5 };
const SEATS = (() => {
  const R = [], sum = [];
  let tot = 0;
  for (let i = 0; i < HEMI.rows; i++) { const r = lerp(HEMI.r0, HEMI.r1, i / (HEMI.rows - 1)); R.push(r); tot += r; }
  const n = R.map(r => Math.max(2, Math.round(513 * r / tot)));
  let diff = 513 - n.reduce((a, c) => a + c, 0);
  for (let i = HEMI.rows - 1; diff !== 0; i = (i + HEMI.rows - 1) % HEMI.rows) { n[i] += Math.sign(diff); diff -= Math.sign(diff); }
  const rnd = mulberry(513), out = [];
  for (let i = 0; i < HEMI.rows; i++) {
    for (let j = 0; j < n[i]; j++) {
      const th = Math.PI - (j / (n[i] - 1)) * Math.PI;
      const sc = (rnd() + rnd() + rnd()) / 1.5 - 1;
      out.push({ row: i, th, x: HEMI.cx + Math.cos(th) * R[i], y: HEMI.cy - Math.sin(th) * R[i], score: sc });
    }
  }
  out.forEach((s, k) => { s.u = 1 - s.th / Math.PI; s.target = Math.min(4, Math.floor(s.u * 5)); s.k = k; });
  // one seat per avatar survives the trip and becomes it: the one nearest the middle of its slice
  for (let a = 0; a < 5; a++) {
    let best = null;
    for (const s of out) if (s.target === a && s.row === 6 && (!best || Math.abs(s.u - (a + 0.5) / 5) < Math.abs(best.u - (a + 0.5) / 5))) best = s;
    best.keeper = true;
  }
  return out;
})();
const seatColor = s => (s.score > 0.2 ? C.green : s.score < -0.25 ? C.red : C.yellow);

// part 'bg': background, floor, seats at rest, count, legend; 'fg': the headline and the seats in flight
function sceneHemi(ctx, b, part) {
  const withBg = part !== 'fg', withFg = part !== 'bg';
  if (withBg) {
    bgNavy(ctx, b, C.ink, C.navy, 1250);
    dotGrid(ctx, b, 0.07);
  }
  const zoom = lerp(1.5, 1, pr(b, 8.0, 8.9, E.outExpo));
  const fade = 1 - seg(b, 10.3, 10.75);
  ctx.save();
  ctx.translate(HEMI.cx, HEMI.cy); ctx.scale(zoom, zoom); ctx.translate(-HEMI.cx, -HEMI.cy);
  // the plenary floor (continuing the flipped bowl)
  if (withBg && fade > 0) {
    ctx.globalAlpha = fade;
    fillPts(ctx, flagShapes().plen, '#16235F');
    ctx.strokeStyle = 'rgba(143,168,255,0.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(40, HEMI.cy + 1); ctx.lineTo(1040, HEMI.cy + 1); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  const beatPulse = b > 9.4 && b < 10.4 ? kick(b, Math.floor(b * 2) / 2, 9) : 0;
  for (const s of SEATS) {
    const a = 8.05 + s.u * 0.85 + s.row * 0.012;
    const q = seg(b, a, a + 0.4);
    if (q <= 0) continue;
    const cq = seg(b, 9.05 + s.row * 0.05 + s.u * 0.12, 9.3 + s.row * 0.05 + s.u * 0.12);
    const col = cq <= 0 ? C.white : cq >= 1 ? seatColor(s) : mix(C.white, seatColor(s), cq);
    // the trip into the ranking
    const f0 = 10.3 + (1 - s.row / HEMI.rows) * 0.18 + s.u * 0.12, f = seg(b, f0, f0 + 0.62);
    let x = s.x, y = s.y, r = HEMI.dot * E.outBack(q, 3) * (1 + 0.35 * beatPulse * (s.score > 0.2 ? 1 : 0.3));
    if (f > 0) {
      if (!withFg) continue;
      // the plenary zoom is 1 by now, so this is screen space
      const tgt = uiAvatar(s.target, b);
      const e = E.inOutCubic(f);
      // curve out and down, like water down a drain
      x = lerp(s.x, tgt[0], e) + Math.sin(e * Math.PI) * (s.u - 0.5) * 260;
      y = lerp(s.y, tgt[1], e) - Math.sin(e * Math.PI) * 160;
      r = s.keeper ? lerp(HEMI.dot, 40, E.inCubic(f)) : HEMI.dot * (1 - E.inCubic(f));
      if (s.keeper) { ctx.fillStyle = mix(seatColor(s), ROWS[s.target].av, E.inCubic(f)); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); continue; }
    } else if (!withBg) continue;
    if (r <= 0.2) continue;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  ctx.restore();
  if (withFg) {
    kLine(ctx, b, { text: 'QUEM TRABALHA', x: 540, y: 430, size: 118, weight: 800, maxW: 960, tIn: 8.15, style: 'rise', mask: true, tOut: 10.35, outDur: 0.45 });
    kLine(ctx, b, { text: 'POR VOCÊ?', x: 540, y: 572, size: 118, weight: 800, maxW: 960, tIn: 8.4, style: 'rise', mask: true, tOut: 10.45, outDur: 0.45,
      colors: { 4: C.yellow, 5: C.yellow, 6: C.yellow, 7: C.yellow, 8: C.yellow } });
  }
  if (!withBg) return;

  // the count in the middle of the plenary
  const cq = seg(b, 8.4, 9.3);
  if (cq > 0) {
    ctx.save();
    ctx.globalAlpha = pr(b, 8.4, 8.7) * fade;
    ctx.font = FONT(900, 120); ctx.textAlign = 'center'; ctx.fillStyle = C.white;
    ctx.fillText(String(Math.round(513 * E.outCubic(cq))), HEMI.cx, HEMI.cy - 18);
    ctx.textAlign = 'left';
    label(ctx, 'DEPUTADOS FEDERAIS', HEMI.cx, HEMI.cy + 52, 28, C.mute, 'center', 6, 700);
    ctx.restore();
  }
  // legend
  const lg = pr(b, 9.3, 9.8, E.outBack);
  if (lg > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, lg) * fade;
    legendChip(ctx, 540 - 170, 1580, '+ pontos', C.green, lg);
    legendChip(ctx, 540 + 170, 1580, '− pontos', C.red, pr(b, 9.45, 9.95, E.outBack));
    ctx.restore();
  }
}
function legendChip(ctx, cx, cy, text, col, s) {
  if (s <= 0) return;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.font = FONT(700, 32);
  const w = ctx.measureText(text).width + 90;
  rrect(ctx, -w / 2, -34, w, 68, 34);
  ctx.fillStyle = rgba(col, 0.14); ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(-w / 2 + 36, 0, 11, 0, TAU); ctx.fill();
  ctx.fillStyle = C.white; ctx.fillText(text, -w / 2 + 60, 11);
  ctx.restore();
}

// ---------- scene 4: the ranking card
const UI = { x: 80, y: 700, w: 920, h: 1000, r: 44, rowY: 1010, rowH: 120, rowGap: 14 };
const ROWS = [
  { uf: 'SP', nw: 300, s0: 812, s1: 754, av: '#5B7CFF' },
  { uf: 'MG', nw: 250, s0: 776, s1: 817, av: '#16C66E' },
  { uf: 'BA', nw: 330, s0: 743, s1: 839, av: '#FFB020' },
  { uf: 'RS', nw: 270, s0: 701, s1: 689, av: '#FF6B7A' },
  { uf: 'PE', nw: 290, s0: 668, s1: 818, av: '#9B6BFF' },
];
(() => {
  const order = ROWS.map((r, i) => i).sort((a, c) => ROWS[c].s1 - ROWS[a].s1);
  order.forEach((i, k) => { ROWS[i].newRank = k; });
})();
const slotY = k => UI.rowY + k * (UI.rowH + UI.rowGap);

// where the panel is (it slides up into place)
function uiPanelT(b) {
  const q = pr(b, 10.85, 11.55, E.outExpo);
  return { dy: (1 - q) * 1000, rot: (1 - q) * 0.07, s: lerp(0.94, 1, q), q };
}
function uiAvatar(i, b) {
  const P = uiPanelT(b);
  const x = 255, y = slotY(i) + 60 + P.dy;
  return [540 + (x - 540) * P.s, 1200 + (y - 1200) * P.s];
}

function sceneUI(ctx, b, withBg) {
  const P = uiPanelT(b);
  const morph = seg(b, 16.7, 17.3);          // the card becomes the stopwatch
  if (withBg) {
    bgNavy(ctx, b, C.ink, C.navy, 1300);
    dotGrid(ctx, b, 0.07);
    // headlines
    kLine(ctx, b, { text: 'CONSULTE', x: 540, y: 400, size: 124, weight: 800, maxW: 960, tIn: 11.1, style: 'rise', mask: true, tOut: 13.7, outDur: 0.45 });
    kLine(ctx, b, { text: 'O RANKING', x: 540, y: 545, size: 124, weight: 800, maxW: 960, tIn: 11.3, style: 'rise', mask: true, tOut: 13.8, outDur: 0.45,
      hl: { from: 2, to: 9, color: C.yellow, text: C.text, b: 11.85 } });
    kLine(ctx, b, { text: 'ESCOLHA COM', x: 540, y: 400, size: 124, weight: 800, maxW: 960, tIn: 14.05, style: 'rise', mask: true, tOut: 16.6, outDur: 0.45 });
    kLine(ctx, b, { text: 'CRITÉRIO.', x: 540, y: 545, size: 124, weight: 800, maxW: 960, tIn: 14.25, style: 'rise', mask: true, tOut: 16.7, outDur: 0.45,
      hl: { from: 0, to: 9, color: C.yellow, text: C.text, b: 14.75 } });
  }
  if (morph > 0) { uiMorph(ctx, b, morph); if (!withBg) return; }
  if (b > 17.3) return;
  const fadeOut = 1 - seg(b, 16.5, 16.72);
  ctx.save();
  ctx.translate(540, 1200 + P.dy); ctx.rotate(P.rot); ctx.scale(P.s, P.s); ctx.translate(-540, -1200);
  if (morph <= 0) {
    // the card
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 80; ctx.shadowOffsetY = 40;
    rrect(ctx, UI.x, UI.y, UI.w, UI.h, UI.r); ctx.fillStyle = C.paper; ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = fadeOut;
  if (fadeOut > 0) uiContent(ctx, b);
  ctx.restore();
  ctx.globalAlpha = 1;
  // criteria stickers float over the card
  if (b > 14) criteria(ctx, b);
  // pointer
  const keys = [[11.0, 1180, 2080], [11.5, 640, 868], [12.95, 660, 880], [13.3, 200, 958], [13.9, 560, 1300], [14.5, 760, 1480], [15.9, 860, 1120], [16.15, 700, 1070], [16.7, 1200, 1400]];
  const [px, py] = pathAt(keys, b);
  const press = Math.max(bump1(b, 11.55), bump1(b, 13.35), bump1(b, 16.2));
  ripple(ctx, 640, 868, b, 11.55, C.blue, 70);
  ripple(ctx, 200, 958, b, 13.35, C.blue, 70);
  pointer(ctx, px, py, press, pr(b, 11.0, 11.3) * (1 - seg(b, 16.45, 16.7)));
}
const bump1 = (b, b0) => Math.max(0, 1 - Math.abs(b - b0) / 0.12);

function uiContent(ctx, b) {
  // browser bar with the address
  ctx.save();
  rrect(ctx, UI.x, UI.y, UI.w, 82, UI.r); ctx.clip();
  ctx.fillStyle = '#E4E8F4'; ctx.fillRect(UI.x, UI.y, UI.w, 82);
  ctx.restore();
  ['#FF5F57', '#FEBC2E', '#28C840'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(128 + i * 30, 741, 9, 0, TAU); ctx.fill(); });
  rrect(ctx, 240, 716, 720, 50, 25); ctx.fillStyle = '#fff'; ctx.fill();
  // lock
  ctx.strokeStyle = C.text; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(276, 736, 7, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = C.text; rrect(ctx, 266, 736, 20, 16, 3); ctx.fill();
  ctx.font = FONT(600, 27); ctx.fillStyle = C.text; ctx.fillText('ranking.org.br', 300, 750);

  // search
  const sq = pr(b, 11.25, 11.7, E.outBack);
  if (sq > 0) {
    ctx.save();
    ctx.translate(540, 855); ctx.scale(lerp(0.9, 1, sq), lerp(0.9, 1, sq)); ctx.translate(-540, -855);
    ctx.globalAlpha *= Math.min(1, sq);
    const focus = seg(b, 11.55, 11.7);
    rrect(ctx, 120, 810, 840, 90, 45); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = mix(C.line, C.blue, focus); ctx.stroke();
    ctx.strokeStyle = C.text; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(172, 850, 14, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(182, 860); ctx.lineTo(194, 872); ctx.stroke();
    const q = 'Deputados federais';
    const nChars = Math.floor(clamp((b - 11.65) / 0.075, 0, q.length));
    ctx.font = FONT(500, 32);
    if (nChars === 0) { ctx.fillStyle = '#9AA3C4'; ctx.fillText('Busque um político', 215, 866); }
    else { ctx.fillStyle = C.text; ctx.fillText(q.slice(0, nChars), 215, 866); }
    if (focus > 0 && Math.floor(b * 4) % 2 === 0) {
      const cw = nChars ? ctx.measureText(q.slice(0, nChars)).width : 0;
      ctx.fillStyle = C.blue; ctx.fillRect(218 + cw, 834, 3, 42);
    }
    ctx.restore();
  }
  // filter chips
  const chips = [['Deputados', true], ['Senadores', false], ['Todos os estados ▾', false]];
  let cx = 120;
  ctx.font = FONT(600, 26);
  chips.forEach(([t, on], i) => {
    const w = ctx.measureText(t).width + 52;
    const q = pr(b, 11.5 + i * 0.1, 11.95 + i * 0.1, E.outBack);
    if (q > 0) {
      ctx.save();
      ctx.translate(cx + w / 2, 955); ctx.scale(q, q);
      const act = on ? (b < 13.35 ? 0.35 : 1) : 0;
      rrect(ctx, -w / 2, -30, w, 60, 30);
      ctx.fillStyle = mix('#FFFFFF', C.text, act); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = on ? C.text : C.line; ctx.stroke();
      ctx.fillStyle = act > 0.5 ? '#fff' : C.text;
      ctx.fillText(t, -w / 2 + 26, 9);
      ctx.restore();
    }
    cx += w + 14;
  });
  // rows
  const sort = E.inOutCubic(seg(b, 15.25, 16.0));
  // draw the ones moving up last (they pass in front)
  const drawOrder = ROWS.map((r, i) => i).sort((a, c) => (ROWS[a].newRank - a) - (ROWS[c].newRank - c)).reverse();
  for (const i of drawOrder) uiRow(ctx, b, i, sort);
}

function uiRow(ctx, b, i, sort) {
  const R = ROWS[i];
  const inq = pr(b, 11.05 + i * 0.12, 11.75 + i * 0.12, E.outExpo);
  if (inq <= 0) return;
  const up = R.newRank < i;
  const y = lerp(slotY(i), slotY(R.newRank), sort) + (1 - inq) * 90;
  const bulge = Math.sin(sort * Math.PI);
  const x = (up ? -1 : 1) * bulge * 26;
  const s = 1 + (up ? 0.035 : -0.01) * bulge;
  const win = R.newRank === 0 ? pr(b, 16.0, 16.4) : 0;
  ctx.save();
  ctx.globalAlpha *= inq;
  ctx.translate(540 + x, y + 60); ctx.scale(s, s); ctx.translate(-540, -(y + 60));
  ctx.save();
  ctx.shadowColor = `rgba(16,26,70,${0.12 + 0.25 * bulge * (up ? 1 : 0)})`; ctx.shadowBlur = 24 + 30 * bulge; ctx.shadowOffsetY = 8 + 12 * bulge;
  rrect(ctx, 110, y, 860, UI.rowH, 26); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.restore();
  if (win > 0) {
    ctx.save(); rrect(ctx, 110, y, 860, UI.rowH, 26); ctx.clip();
    ctx.fillStyle = rgba(C.yellow, 0.22 * win); ctx.fillRect(110, y, 860, UI.rowH);
    ctx.fillStyle = C.yellow; ctx.fillRect(110, y, 10 * win, UI.rowH);
    ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = rgba('#E0A800', win); rrect(ctx, 110, y, 860, UI.rowH, 26); ctx.stroke();
  }
  // rank (flips to the new number halfway through the sort)
  const rank = sort < 0.5 ? i : R.newRank;
  const flip = Math.abs(Math.cos(sort * Math.PI));
  ctx.save();
  ctx.translate(165, y + 60); ctx.scale(1, Math.max(0.05, flip));
  ctx.font = FONT(800, 42); ctx.textAlign = 'center';
  ctx.fillStyle = win > 0.5 ? '#C98F00' : C.text;
  ctx.fillText(`${rank + 1}º`, 0, 15);
  ctx.restore();
  // avatar
  const av = seg(b, 10.95 + i * 0.03, 11.15 + i * 0.03);
  ctx.fillStyle = R.av; ctx.beginPath(); ctx.arc(255, y + 60, 40, 0, TAU); ctx.fill();
  if (av > 0) {
    ctx.save(); ctx.beginPath(); ctx.arc(255, y + 60, 40, 0, TAU); ctx.clip();
    ctx.globalAlpha *= av;
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath(); ctx.arc(255, y + 50, 14, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(255, y + 92, 28, 22, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // name (redacted bar), state and party
  const nq = pr(b, 11.3 + i * 0.1, 11.8 + i * 0.1);
  rrect(ctx, 315, y + 28, R.nw * nq, 22, 11); ctx.fillStyle = C.text; ctx.fill();
  rrect(ctx, 315, y + 62, 62, 32, 16); ctx.fillStyle = '#EEF1FA'; ctx.fill();
  ctx.font = FONT(700, 20); ctx.fillStyle = C.text; ctx.textAlign = 'center'; ctx.fillText(R.uf, 346, y + 85); ctx.textAlign = 'left';
  rrect(ctx, 390, y + 70, 110 * nq, 16, 8); ctx.fillStyle = C.line; ctx.fill();
  // score: counts up, then moves with the criteria
  const cnt = E.outCubic(seg(b, 12.2 + i * 0.08, 13.2 + i * 0.08));
  const dq = E.inOutCubic(seg(b, 14.45 + i * 0.14, 15.05 + i * 0.14));
  const score = Math.round(lerp(0, R.s0, cnt) + (R.s1 - R.s0) * dq);
  ctx.font = FONT(800, 46); ctx.textAlign = 'right'; ctx.fillStyle = C.text;
  ctx.fillText(String(score), 930, y + 70);
  ctx.font = FONT(600, 20); ctx.fillStyle = '#8A93B8'; ctx.fillText('pontos', 930, y + 98);
  ctx.textAlign = 'left';
  // score bar
  rrect(ctx, 520, y + 84, 250, 10, 5); ctx.fillStyle = '#E8ECF7'; ctx.fill();
  rrect(ctx, 520, y + 84, 250 * score / 900, 10, 5); ctx.fillStyle = dq > 0 && R.s1 < R.s0 ? C.red : C.green; ctx.fill();
  // the delta floats up off the score
  const dd = seg(b, 14.45 + i * 0.14, 15.4 + i * 0.14);
  if (dd > 0 && dd < 1) {
    const d = R.s1 - R.s0;
    ctx.save();
    ctx.globalAlpha *= Math.sin(dd * Math.PI);
    ctx.font = FONT(800, 38); ctx.textAlign = 'right';
    ctx.fillStyle = d > 0 ? C.green : C.red;
    ctx.fillText(`${d > 0 ? '+' : '−'}${Math.abs(d)}`, 840, y + 40 - dd * 60);
    ctx.restore();
  }
  // crown for the new first place
  if (win > 0) {
    const q = E.outBack(win, 2.5);
    ctx.save();
    ctx.translate(315 + R.nw + 36, y + 39); ctx.scale(q, q); ctx.rotate((1 - win) * 1.5);
    fillPts(ctx, xformPts(UNIT.star, 0, 0, 20, 0), C.yellow);
    ctx.restore();
  }
  ctx.restore();
}

// "stickers" for the criteria that move the score
const CRIT = [
  { t: 'Presença', s: '+', x: 250, y: 682, r: -0.08, b: 14.25, c: C.green },
  { t: 'Votações', s: '+', x: 815, y: 696, r: 0.07, b: 14.5, c: C.green },
  { t: 'Gastos', s: '−', x: 245, y: 1705, r: 0.06, b: 14.75, c: C.red },
  { t: 'Processos', s: '−', x: 815, y: 1690, r: -0.06, b: 15.0, c: C.red },
];
function criteria(ctx, b) {
  for (const k of CRIT) {
    const q = pr(b, k.b, k.b + 0.55, E.outBack);
    const out = E.inBack(seg(b, 16.45, 16.75));
    const s = q * (1 - out);
    if (s <= 0.001) continue;
    ctx.save();
    ctx.translate(k.x, k.y + Math.sin(b * 2.2 + k.x) * 6);
    ctx.rotate(k.r + (1 - Math.min(1, q)) * 0.5);
    ctx.scale(s, s);
    ctx.font = FONT(700, 36);
    const w = ctx.measureText(k.t).width + 110;
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
    rrect(ctx, -w / 2, -40, w, 80, 40); ctx.fillStyle = k.c; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-w / 2 + 42, 0, 24, 0, TAU); ctx.fill();
    ctx.fillStyle = k.c; ctx.fillRect(-w / 2 + 30, -4, 24, 8);
    if (k.s === '+') ctx.fillRect(-w / 2 + 38, -12, 8, 24);
    ctx.fillStyle = '#fff'; ctx.fillText(k.t, -w / 2 + 80, 13);
    ctx.restore();
  }
}

// the card collapses into the stopwatch ring
function uiMorph(ctx, b, m) {
  if (!uiMorph.A) {
    uiMorph.A = S_.rrect(UI.x, UI.y, UI.w, UI.h, UI.r);
    uiMorph.B = S_.circle(CLOCK.cx, CLOCK.cy, CLOCK.R + CLOCK.th / 2);
    uiMorph.T = new Float32Array(NP * 2);
  }
  const e = E.inOutExpo(m);
  morphPts(uiMorph.A, uiMorph.B, e, uiMorph.T);
  const L = layer();
  L.clearRect(0, 0, W, H);
  fillPts(L, uiMorph.T, mix(C.paper, CLOCK.track, seg(m, 0.3, 1)));
  const hole = E.inOutCubic(seg(b, 17.0, 17.35));
  if (hole > 0) {
    L.globalCompositeOperation = 'destination-out';
    L.beginPath(); L.arc(CLOCK.cx, CLOCK.cy, (CLOCK.R - CLOCK.th / 2) * hole, 0, TAU); L.fill();
    L.globalCompositeOperation = 'source-over';
  }
  ctx.drawImage(L.canvas, 0, 0);
}

// ---- 50-clock-urna.js
// ============================================================
// Scene 5 (beats 17-20): "LEVA SÓ 2 MINUTOS". The ranking card is now a stopwatch; a slot-machine
// digit rolls to 2 while the arc sweeps once round.
// Wipe (19.45-20.45): three bars shaped like the logo's (rounded top-left) sweep up and away.
// Scene 6 (beats 20-24): the voting machine. Four boxes fill, CONFIRMA, "FIM"... and the letters of
// FIM come loose to seed the logo. No digits are ever shown: no candidate, no party number.
// ============================================================
const CLOCK = { cx: 540, cy: 1010, R: 300, th: 28, track: '#1E2C72' };

function sceneClock(ctx, b, withBg) {
  if (withBg) {
    bgNavy(ctx, b, C.ink, C.navy, CLOCK.cy);
    dotGrid(ctx, b, 0.06);
  }
  const { cx, cy, R, th } = CLOCK;
  const pop = kick(b, 19.25, 5);
  // ticks
  for (let i = 0; i < 60; i++) {
    const q = pr(b, 17.1 + i * 0.008, 17.45 + i * 0.008, E.outBack);
    if (q <= 0) continue;
    const a = -Math.PI / 2 + (i / 60) * TAU, big = i % 5 === 0;
    const r0 = R + 32 + (big ? 0 : 8), r1 = R + 32 + (big ? 30 : 20) * q;
    const lit = seg(b, 17.35, 19.25) * 60 > i;
    ctx.strokeStyle = lit ? C.yellow : rgba(C.mute, 0.55);
    ctx.lineWidth = big ? 6 : 3;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.stroke();
  }
  // ring track (only once the morph from the card has finished)
  if (b >= 17.3) {
    ctx.strokeStyle = CLOCK.track; ctx.lineWidth = th;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
  }
  // crown button, pressed to start
  const press = bump1(b, 17.3) * 10;
  ctx.fillStyle = CLOCK.track;
  rrect(ctx, cx - 22, cy - R - 64 + press, 44, 40, 8); ctx.fill();
  rrect(ctx, cx - 44, cy - R - 76 + press, 88, 20, 10); ctx.fill();
  // the sweep
  const p = E.inOutCubic(seg(b, 17.35, 19.25));
  if (p > 0) {
    const a0 = -Math.PI / 2, a1 = a0 + p * TAU;
    ctx.save();
    ctx.shadowColor = C.yellow; ctx.shadowBlur = 30;
    ctx.strokeStyle = C.yellow; ctx.lineWidth = th; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx + Math.cos(a1) * R, cy + Math.sin(a1) * R, th * 0.36, 0, TAU); ctx.fill();
  }
  if (pop > 0.02) {
    ctx.strokeStyle = rgba(C.yellow, pop * 0.8); ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(cx, cy, R + (1 - pop) * 160, 0, TAU); ctx.stroke();
  }
  // the digit: a slot-machine roll 0 -> 1 -> 2, clipped to the dial
  const roll = seg(b, 17.35, 18.15);
  if (roll > 0) {
    const size = 470, dh = size * 1.1;
    const v = E.outBack(roll, 1.3) * 2;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R - th / 2 - 4, 0, TAU); ctx.clip();
    ctx.font = FONT(900, size); ctx.textAlign = 'center';
    const sc = 1 + 0.07 * pop;
    ctx.translate(cx, cy); ctx.scale(sc, sc);
    for (let d = 0; d <= (v > 2 ? 3 : 2); d++) {
      const y = (d - v) * dh;
      if (Math.abs(y) > dh * 1.2) continue;
      ctx.fillStyle = d === 2 ? C.white : rgba(C.white, 0.5);
      ctx.fillText(String(d % 10), 0, y + size * 0.35);
    }
    ctx.restore();
  }
  if (withBg) {
    kLine(ctx, b, { text: 'LEVA SÓ', x: 540, y: 470, size: 130, weight: 800, maxW: 960, tIn: 17.05, style: 'rise', mask: true });
    kLine(ctx, b, { text: 'MINUTOS', x: 540, y: 1510, size: 136, weight: 900, maxW: 960, tIn: 17.55, style: 'rise', mask: true, color: C.yellow });
  }
  burst(ctx, b, 19.25, cx, cy - R, 14, 7, 360);
}

// the three-bar wipe (colours of the flag, shape of the logo's bars)
function wipeBars(ctx, b) {
  if (b < 19.45 || b > 20.5) return;
  const cols = [C.green, C.yellow, C.blue];
  for (let i = 0; i < 3; i++) {
    const top = lerp(H + 60, -60, E.inOutExpo(seg(b, 19.45 + i * 0.09, 19.86 + i * 0.09)));
    const bot = lerp(H + 60, -60, E.inOutExpo(seg(b, 19.98 + i * 0.09, 20.4 + i * 0.09)));
    if (bot <= top) continue;
    const x = i * 360;
    ctx.fillStyle = cols[i];
    const r = Math.min(180, (bot - top) / 2);
    ctx.beginPath();
    ctx.moveTo(x, top + r); ctx.arcTo(x, top, x + r, top, r);
    ctx.lineTo(x + 362, top); ctx.lineTo(x + 362, bot); ctx.lineTo(x, bot); ctx.closePath();
    ctx.fill();
  }
}

// ---------- scene 6: the voting machine (a stylised, upright take on the Brazilian urna)
const URNA = {
  x: 170, y: 700, w: 740, h: 860,
  scr: [215, 760, 650, 300], lcd: [235, 780, 610, 260],
  keyW: 130, keyH: 74, keyX0: 327, keyY0: 1090, pitchX: 148, pitchY: 92,
  btnY: 1460, btnH: 72,
  btns: [['BRANCO', 205, 200, '#F7F7F2'], ['CORRIGE', 420, 200, '#F28C28'], ['CONFIRMA', 635, 240, '#1FA64A']],
};
const FILLS = [20.55, 20.8, 21.05, 21.3];         // the four boxes fill (the typing is off screen)
const CONFIRM_B = 22.0;
// the FIM letters, where they sit on the screen: shared with the logo scene, which takes them over
function fimLayout(ctx) {
  const L = layoutLine(ctx, 'FIM', 900, 190, 6);
  const x0 = 540 - L.w / 2;
  return ['F', 'I', 'M'].map((ch, i) => ({ ch, x: x0 + L.xs[i] + L.ws[i] / 2, y: 978 - 190 * 0.35, w: L.ws[i] }));
}
function urnaFall(b) { return E.inExpo(seg(b, 23.35, 23.95)); }

function sceneUrna(ctx, b, withBg) {
  if (withBg) {
    bgNavy(ctx, b, C.ink, C.navy, 1100);
    glow(ctx, 540, 1150, 700, '#2F5BFF', 0.18);
  }
  const enter = pr(b, 19.95, 20.6, E.outExpo);
  const fall = urnaFall(b);
  const [shx, shy] = shakeAt(b, [[CONFIRM_B, 10], [22.25, 16]]);
  const s = lerp(0.95, 1, enter) + 0.03 * kick(b, 22.25, 4);
  ctx.save();
  ctx.translate(540 + shx, 1130 + shy + (1 - enter) * 80 + fall * 1100);
  ctx.rotate(fall * 0.16);
  ctx.scale(s, s);
  ctx.translate(-540, -1130);
  urnaBody(ctx, b);
  ctx.restore();

  // pointer to CONFIRMA
  const cb = URNA.btns[2], bx = cb[1] + cb[2] / 2, by = URNA.btnY + URNA.btnH / 2;
  const [px, py] = pathAt([[21.1, 1180, 1780], [21.85, bx + 10, by + 6], [22.3, bx + 14, by + 10], [22.9, 1200, 1900]], b);
  pointer(ctx, px, py, bump1(b, CONFIRM_B), pr(b, 21.1, 21.3) * (1 - seg(b, 22.6, 22.9)));
  ripple(ctx, bx, by, b, CONFIRM_B, C.green, 150);

  // headline
  kLine(ctx, b, { text: 'SEU VOTO', x: 540, y: 330, size: 122, weight: 800, maxW: 960, tIn: 20.2, style: 'rise', mask: true, tOut: 23.3, outDur: 0.4 });
  kLine(ctx, b, { text: 'NÃO É', x: 540, y: 462, size: 122, weight: 800, maxW: 960, tIn: 22.22, style: 'slam', stagger: 0.03, dur: 0.6, tOut: 23.35, outDur: 0.4 });
  kLine(ctx, b, { text: 'DESPERDIÇADO.', x: 540, y: 594, size: 122, weight: 900, maxW: 960, tIn: 22.4, style: 'slam', stagger: 0.03, dur: 0.6, color: C.green, tOut: 23.4, outDur: 0.4 });
}

function urnaBody(ctx, b) {
  const U = URNA;
  // body
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 70; ctx.shadowOffsetY = 36;
  rrect(ctx, U.x, U.y, U.w, U.h, 34);
  const g = ctx.createLinearGradient(0, U.y, 0, U.y + U.h);
  g.addColorStop(0, '#F1ECDF'); g.addColorStop(1, '#D8D0BC');
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.fillRect(U.x + 30, U.y + 22, U.w - 60, 6);
  // screen
  const [sx, sy, sw, sh] = U.scr, [lx, ly, lw, lh] = U.lcd;
  rrect(ctx, sx, sy, sw, sh, 16); ctx.fillStyle = '#2A2E38'; ctx.fill();
  const lg = ctx.createLinearGradient(0, ly, 0, ly + lh);
  lg.addColorStop(0, '#E3EAE4'); lg.addColorStop(1, '#CCD6CF');
  ctx.fillStyle = lg; ctx.fillRect(lx, ly, lw, lh);
  const done = b >= CONFIRM_B + 0.12;
  ctx.save();
  ctx.beginPath(); ctx.rect(lx, ly, lw, lh); ctx.clip();
  ctx.fillStyle = '#1E2522';
  if (!done) {
    ctx.font = FONT(600, 22); ctx.fillText('SEU VOTO PARA', lx + 22, ly + 38);
    ctx.font = FONT(700, 34); ctx.textAlign = 'center'; ctx.fillText('DEPUTADO FEDERAL', 540, ly + 92); ctx.textAlign = 'left';
    const bw = 64, bh = 78, gap = 16, x0 = 540 - (4 * bw + 3 * gap) / 2, y0 = ly + 118;
    FILLS.forEach((f, i) => {
      const x = x0 + i * (bw + gap);
      const on = b >= f, flash = kick(b, f, 10);
      ctx.lineWidth = 3; ctx.strokeStyle = '#1E2522';
      ctx.fillStyle = `rgba(30,37,34,${0.12 * flash})`;
      ctx.fillRect(x, y0, bw, bh); ctx.strokeRect(x, y0, bw, bh);
      if (on) { ctx.fillStyle = '#1E2522'; ctx.beginPath(); ctx.arc(x + bw / 2, y0 + bh / 2, 12 * E.outBack(seg(b, f, f + 0.2), 3), 0, TAU); ctx.fill(); }
      const next = FILLS.findIndex(ff => b < ff);
      if (next === i && Math.floor(b * 4) % 2 === 0) ctx.fillRect(x + 12, y0 + bh - 14, bw - 24, 5);
    });
    ctx.font = FONT(500, 19); ctx.textAlign = 'center';
    ctx.fillText('Aperte a tecla VERDE para CONFIRMAR este voto', 540, ly + lh - 20);
    ctx.textAlign = 'left';
  } else {
    // FIM (its letters leave the screen for the logo scene)
    const lift = seg(b, 23.3, 23.5);
    if (lift < 1) {
      ctx.font = FONT(900, 190);
      ctx.globalAlpha = 1 - lift;
      for (const l of fimLayout(ctx)) { ctx.fillText(l.ch, l.x - l.w / 2, 978); }
      ctx.globalAlpha = 1;
    }
  }
  // the screen flashes as the vote is cast
  const fl = kick(b, CONFIRM_B + 0.12, 7);
  if (fl > 0.01) { ctx.fillStyle = `rgba(255,255,255,${0.8 * fl})`; ctx.fillRect(lx, ly, lw, lh); }
  ctx.restore();
  // keypad (keys lift off for the logo scene)
  const lift = seg(b, 23.3, 23.45);
  for (let k = 0; k < 10; k++) {
    const [x, y] = urnaKey(k);
    ctx.globalAlpha = 1 - lift;
    rrect(ctx, x, y + 4, U.keyW, U.keyH, 12); ctx.fillStyle = '#0B0C0F'; ctx.fill();
    rrect(ctx, x, y, U.keyW, U.keyH, 12); ctx.fillStyle = '#1C1D22'; ctx.fill();
    ctx.font = FONT(700, 38); ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.fillText(String(k === 9 ? 0 : k + 1), x + U.keyW / 2, y + U.keyH / 2 + 14);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
  // action buttons
  U.btns.forEach(([t, x, w, col], i) => {
    const pressed = i === 2 ? Math.max(0, 1 - Math.abs(b - CONFIRM_B - 0.04) / 0.14) : 0;
    const y = U.btnY + pressed * 6;
    rrect(ctx, x, U.btnY + 6, w, U.btnH, 12); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
    rrect(ctx, x, y, w, U.btnH, 12); ctx.fillStyle = pressed ? mix(col, '#000000', 0.2 * pressed) : col; ctx.fill();
    ctx.font = FONT(700, 25); ctx.fillStyle = '#16181C'; ctx.textAlign = 'center';
    ctx.fillText(t, x + w / 2, y + U.btnH / 2 + 9);
    ctx.textAlign = 'left';
  });
}
function urnaKey(k) {
  const U = URNA;
  const col = k === 9 ? 1 : k % 3, row = k === 9 ? 3 : Math.floor(k / 3);
  return [U.keyX0 + col * U.pitchX, U.keyY0 + row * U.pitchY];
}
// screen position of an urna element, with the urna's current transform (used by the logo scene)
function urnaToScreen(b, x, y) {
  const enter = pr(b, 19.95, 20.6, E.outExpo), fall = urnaFall(b);
  const s = lerp(0.95, 1, enter) + 0.03 * kick(b, 22.25, 4);
  const c = Math.cos(fall * 0.16), si = Math.sin(fall * 0.16);
  const dx = (x - 540) * s, dy = (y - 1130) * s;
  return [540 + dx * c - dy * si, 1130 + (1 - enter) * 80 + fall * 1100 + dx * si + dy * c];
}

// ---- 60-logo.js
// ============================================================
// Scene 7 (beats 23.3-32): the logo, built from metamorphic shapes.
// The letters of FIM and the keys of the urna come loose, turn into shapes that never stop changing
// (circle, rhombus, square, triangle, star...) and orbit. They are swallowed one by one by a white disc
// that wobbles like liquid as each one lands, then settles into a perfect circle. The column capital
// slides in from the sides; three dots rise from below and stretch into the ranking bars; each one
// turns into a cut-out as it lands. The mark slides left, the wordmark is born letter by letter
// from shapes, "15 Anos" comes out from behind the disc, and the call to action lands on the downbeat.
// ============================================================
const LS = 0.78;                                              // final lockup scale (logo px -> screen px)
const LX = (W - (LOGO_BBOX[2] - LOGO_BBOX[0]) * LS) / 2;      // lockup left edge on screen
const LY = 668;                                               // lockup top edge on screen
const L2S = (x, y) => [LX + (x - LOGO_BBOX[0]) * LS, LY + (y - LOGO_BBOX[1]) * LS];
const MARK_F = L2S(LOGO_MARK.cx, LOGO_MARK.cy);
const HERO = { x: 540, y: 905, s: 1.52 };

function markT(b) {
  const u = E.inOutExpo(seg(b, 26.25, 26.95));
  const x = lerp(HERO.x, MARK_F[0], u), y = lerp(HERO.y, MARK_F[1], u) - Math.sin(u * Math.PI) * 40;
  return { x, y, s: lerp(HERO.s, LS, u), u };
}

// ---------- the cut-outs, in mark-local units (logo px about the disc centre)
const CUT = (() => {
  const M = LOGO_MARK, cx = M.cx, cy = M.cy;
  const [ax0, ay0, ax1, ay1, ar] = M.abacus, [ex0, ey0, ex1, ey1] = M.echinus;
  const out = {
    abacus: S_.rrect(ax0 - cx, ay0 - cy, ax1 - ax0, ay1 - ay0, 0, [0, 0, ar, ar]),
    echinus: S_.rrect(ex0 - cx, ey0 - cy, ex1 - ex0, ey1 - ey0, 0),
    bars: M.bars.map(([x0, top]) => S_.rrect(x0 - cx, top - cy, M.barW, 260 - (top - cy), 0, [M.barR, 0, 0, 0])),
  };
  out.abacusC = [(ax0 + ax1) / 2 - cx, (ay0 + ay1) / 2 - cy];
  out.echinusC = [(ex0 + ex1) / 2 - cx, (ey0 + ey1) / 2 - cy];
  out.pillA = S_.rect(out.abacusC[0], out.abacusC[1], 70, 30, 15);
  out.pillE = S_.rect(out.echinusC[0], out.echinusC[1], 70, 30, 15);
  out.dots = M.bars.map(([x0, top]) => S_.circle(x0 - cx + M.barW / 2, top - cy + M.barW / 2, M.barW / 2));
  return out;
})();
// [move window start, end, land start, land end, colour]
const CUT_T = {
  abacus: [24.85, 25.25, 25.18, 25.34, C.yellow],
  echinus: [25.1, 25.5, 25.43, 25.6, C.sky],
  bars: [[25.35, 25.75, 25.68, 25.85, C.green], [25.6, 26.0, 25.93, 26.1, C.yellow], [25.85, 26.25, 26.18, 26.35, C.blue]],
};

// ---------- the swarm
const SWARM_COLS = [C.yellow, C.green, C.blue, C.white, C.sky];
let SWARM = null;
function buildSwarm(ctx) {
  const items = [];
  const r = mulberry(2026);
  // the letters of FIM (from the urna screen)
  ctx.save();
  for (const l of fimLayout(ctx)) {
    const [x, y] = urnaToScreen(23.3, l.x, l.y);
    items.push({ kind: 'letter', ch: l.ch, sx: x, sy: y, ax: l.w * 0.42 / 0.85, ay: 66 / 0.85, col0: '#1E2522' });
  }
  ctx.restore();
  // keys and buttons
  for (let k = 0; k < 10; k++) {
    const [kx, ky] = urnaKey(k);
    const [x, y] = urnaToScreen(23.3, kx + URNA.keyW / 2, ky + URNA.keyH / 2);
    items.push({ kind: 'key', sx: x, sy: y, ax: URNA.keyW / 2 / 0.85, ay: URNA.keyH / 2 / 0.85, col0: '#1C1D22' });
  }
  URNA.btns.forEach(([t, bx, bw, col]) => {
    const [x, y] = urnaToScreen(23.3, bx + bw / 2, URNA.btnY + URNA.btnH / 2);
    items.push({ kind: 'key', sx: x, sy: y, ax: bw / 2 / 0.85, ay: URNA.btnH / 2 / 0.85, col0: col });
  });
  // a few more that fly in from outside the frame
  for (let k = 0; k < 8; k++) {
    const a = r() * TAU;
    items.push({ kind: 'extra', sx: 540 + Math.cos(a) * 1300, sy: 905 + Math.sin(a) * 1300, ax: 20, ay: 20, col0: SWARM_COLS[k % 5] });
  }
  const N = items.length;
  items.forEach((it, i) => {
    it.col = SWARM_COLS[i % SWARM_COLS.length];
    it.R = 175 + r() * 300;
    it.th = (i / N) * TAU + r() * 0.4;
    it.w = (1.6 + r() * 1.2) * (r() < 0.5 ? 1 : 1.25);
    it.size = 20 + r() * 30;
    it.ph = r() * 8;
    it.phs = 1.6 + r() * 1.4;
    it.g0 = 23.3 + i * 0.012;
    it.a = 24.5 + (i / N) * 0.55;            // when it is absorbed into the disc
  });
  SWARM = items;
}
function orbitPos(it, b) {
  const tt = (b - 23.3) * BEAT;
  const spin = it.th + it.w * tt + 1.4 * E.inCubic(seg(b, 24.0, 25.2)) * it.w;
  const R = it.R * (1 - 0.35 * pr(b, 24.0, 24.9, E.outCubic)) * (1 + 0.12 * kick(b, 24, 5));
  return [HERO.x + Math.cos(spin) * R, HERO.y + Math.sin(spin) * R * 0.92, spin];
}

const _A = new Float32Array(NP * 2), _B = new Float32Array(NP * 2), _P = new Float32Array(NP * 2);

function drawSwarm(ctx, b) {
  if (!SWARM) buildSwarm(ctx);
  const disc = discRadius(b) * HERO.s;
  for (const it of SWARM) {
    const g = E.inOutCubic(seg(b, it.g0, it.g0 + 0.6));
    const ab = seg(b, it.a, it.a + 0.3);
    if (ab >= 1) continue;
    const ph = it.ph + (b - 23.3) * it.phs;
    // motion trails: ghosts at earlier times
    for (let ghost = 3; ghost >= 0; ghost--) {
      const bb = b - ghost * 0.035;
      if (ghost && (bb < 23.95 || ab > 0.2)) continue;
      const gg = E.inOutCubic(seg(bb, it.g0, it.g0 + 0.6));
      let [ox, oy, spin] = orbitPos(it, bb);
      let x = lerp(it.sx, ox, gg), y = lerp(it.sy, oy, gg) - Math.sin(gg * Math.PI) * 140;
      let size = it.size * (1 + 0.25 * kick(bb, 24, 6));
      if (ab > 0) {
        const k = E.inCubic(ab);
        const dx = x - HERO.x, dy = y - HERO.y, d = Math.hypot(dx, dy) || 1;
        x = lerp(x, HERO.x + dx / d * disc * 0.75, k); y = lerp(y, HERO.y + dy / d * disc * 0.75, k);
        size *= 1 - k;
      }
      // start shape (the key / letter box) -> the ever-changing shape
      xformPts(UNIT.square, it.sx, it.sy, it.ax, 0, _A, it.ay);
      xformPts(cyclePts(ph), x, y, size, spin * 0.6, _B);
      const P = gg < 1 ? morphPts(_A, _B, gg, _P) : _B;
      ctx.globalAlpha = ghost ? 0.14 * (4 - ghost) / 3 : 1;
      fillPts(ctx, P, gg < 1 ? mix(it.col0, it.col, E.outCubic(seg(bb, it.g0, it.g0 + 0.3))) : it.col);
      // a FIM letter lights up as it leaves the screen, then dissolves into its shape
      if (!ghost && it.kind === 'letter' && b < it.g0 + 0.45) {
        const la = 1 - seg(b, it.g0 + 0.1, it.g0 + 0.4);
        ctx.save();
        ctx.globalAlpha = la;
        ctx.font = FONT(900, 190); ctx.textAlign = 'center';
        ctx.fillStyle = mix('#1E2522', '#FFFFFF', seg(b, 23.3, 23.42));
        const tx = lerp(it.sx, x, gg), ty = lerp(it.sy, y, gg);
        ctx.fillText(it.ch, tx, ty + 66);
        ctx.restore();
      }
    }
  }
  ctx.globalAlpha = 1;
}

// disc radius in logo px: grows as the swarm feeds it
function discRadius(b) {
  return LOGO_MARK.r * E.outBack(seg(b, 24.3, 25.05), 1.5);
}
// liquid wobble: low harmonics that ring after each absorption and die away by beat 25.9
function discPts(b, out) {
  const R = discRadius(b);
  const env = seg(b, 24.3, 24.6) * (1 - seg(b, 25.3, 25.95));
  const a2 = 0.07 * env * Math.sin(b * 13.1), a3 = 0.05 * env * Math.sin(b * 17.3 + 1), a5 = 0.03 * env * Math.sin(b * 23.9 + 2);
  for (let k = 0; k < NP; k++) {
    const th = -Math.PI / 2 + (k / NP) * TAU;
    const r = R * (1 + a2 * Math.sin(2 * th + b * 3) + a3 * Math.sin(3 * th - b * 4) + a5 * Math.sin(5 * th + b * 6));
    out[k * 2] = Math.cos(th) * r; out[k * 2 + 1] = Math.sin(th) * r;
  }
  return out;
}

// where a cut-out is (mark-local polygon), and how landed it is
function cutState(name, i, b) {
  const T = name === 'bars' ? CUT_T.bars[i] : CUT_T[name];
  const p = seg(b, T[0], T[1]);
  if (p <= 0) return null;
  const land = seg(b, T[2], T[3]);
  let P;
  if (name === 'bars') {
    const e = E.outBack(p, 1.25);
    morphPts(CUT.dots[i], CUT.bars[i], E.inOutCubic(seg(p, 0.25, 1)), _P);
    const dy = (1 - e) * 330;
    for (let k = 0; k < NP; k++) _P[k * 2 + 1] += dy;
    P = _P;
  } else {
    const e = E.outExpo(p);
    const src = name === 'abacus' ? CUT.pillA : CUT.pillE, dst = CUT[name];
    morphPts(src, dst, E.inOutCubic(seg(p, 0.3, 1)), _P);
    const dx = (name === 'abacus' ? -1 : 1) * (1 - e) * 560;
    for (let k = 0; k < NP; k++) _P[k * 2] += dx;
    P = _P;
  }
  return { P, land, col: T[4] };
}

// logo layer: disc + cut-outs + wordmark + 15 Anos, drawn together so one light sweep can cross it all
function drawLogo(ctx, b) {
  const L = layer('logo');
  L.setTransform(1, 0, 0, 1, 0, 0);
  L.clearRect(0, 0, W, H);
  const T = markT(b);
  const A = ASSETS.atlas;
  const glyph = (name, a, dx, dy, sc) => {
    const g = ASSETS.glyph[name];
    if (!g || a <= 0) return;
    const [x, y] = L2S(g.x, g.y);
    const w = g.w * LS, h = g.h * LS;
    L.save();
    L.globalAlpha = a;
    L.translate(x + w / 2 + (dx || 0), y + h / 2 + (dy || 0));
    if (sc && sc !== 1) L.scale(sc, sc);
    L.drawImage(A, g.sx, g.sy, g.w, g.h, -w / 2, -h / 2, w, h);
    L.restore();
  };
  // "15" comes out from behind the disc; "Anos" writes itself on
  const q15 = seg(b, 27.3, 27.85);
  if (q15 > 0) {
    const g = ASSETS.glyph['15'];
    const [gx, gy] = L2S(g.x + g.w / 2, g.y + g.h / 2);
    const e = E.outBack(q15, 1.6);
    glyph('15', Math.min(1, q15 * 3), (MARK_F[0] - gx) * (1 - e) * 0.7, (MARK_F[1] - gy) * (1 - e) * 0.7, lerp(0.5, 1, e));
  }
