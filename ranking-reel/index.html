  ['A', 'n3', 'o4', 's3'].forEach((n, j) => {
    const q = seg(b, 27.55 + j * 0.06, 27.85 + j * 0.06);
    glyph(n, q, -18 * (1 - E.outExpo(q)), 0, 1);
  });
  // the disc, with its knock-outs
  if (b >= 24.3) {
    const D = discPts(b, _A);
    xformPts(D, T.x, T.y, T.s, 0, _B);
    fillPts(L, _B, '#fff');
    L.globalCompositeOperation = 'destination-out';
    const cuts = [['abacus', 0], ['echinus', 0], ['bars', 0], ['bars', 1], ['bars', 2]];
    for (const [n, i] of cuts) {
      const st = cutState(n, i, b);
      if (!st || st.land <= 0) continue;
      L.globalAlpha = st.land;
      fillPts(L, xformPts(st.P, T.x, T.y, T.s, 0, _B), '#000');
    }
    L.globalAlpha = 1;
    L.globalCompositeOperation = 'source-over';
  }
  // the wordmark: every letter is born as a little morphing shape
  const WORD = [['R', 'a', 'n', 'k', 'i', 'n2', 'g'], ['d', 'o', 's', 'p', 'o2', 'l', 'ii', 't', 'i2', 'c', 'o3', 's2']];
  const born = [];
  WORD.forEach((line, li) => line.forEach((n, j) => {
    const b0 = li === 0 ? 26.6 + j * 0.07 : 26.95 + j * 0.045;
    const p = seg(b, b0, b0 + 0.55);
    if (p <= 0) return;
    const gp = seg(p, 0.3, 1);
    glyph(n, Math.min(1, gp * 2), 0, 26 * (1 - E.outExpo(gp)), lerp(0.7, 1, E.outBack(gp, 2)));
    if (p < 0.7) born.push([n, p, li * 10 + j]);
  }));
  // light sweep across the whole lockup
  const sw = seg(b, 27.95, 28.65);
  if (sw > 0 && sw < 1) {
    L.globalCompositeOperation = 'source-atop';
    const x = lerp(-300, W + 300, E.inOutCubic(sw));
    const g = L.createLinearGradient(x - 160, 0, x + 160, 0);
    g.addColorStop(0, 'rgba(255,210,63,0)'); g.addColorStop(0.5, 'rgba(255,225,120,0.95)'); g.addColorStop(1, 'rgba(255,210,63,0)');
    L.fillStyle = g;
    L.save(); L.translate(x, 900); L.transform(1, 0, -0.35, 1, 0, 0); L.translate(-x, -900);
    L.fillRect(x - 170, 500, 340, 800);
    L.restore();
    L.globalCompositeOperation = 'source-over';
  }
  ctx.drawImage(L.canvas, 0, 0);
  // the shapes the letters are born from (on top)
  for (const [n, p, seed] of born) {
    const g = ASSETS.glyph[n];
    const [x, y] = L2S(g.x + g.w / 2, g.y + g.h / 2);
    const s = 26 * E.outBack(seg(p, 0, 0.35), 2) * (1 - seg(p, 0.3, 0.7));
    if (s <= 0.2) continue;
    fillPts(ctx, xformPts(cyclePts(seed * 0.7 + p * 3), x, y - 10, s, p * 4), SWARM_COLS[seed % 5]);
  }
  // cut-outs on their way in, still solid and coloured
  const cuts = [['abacus', 0], ['echinus', 0], ['bars', 0], ['bars', 1], ['bars', 2]];
  for (const [n, i] of cuts) {
    const st = cutState(n, i, b);
    if (!st || st.land >= 1) continue;
    ctx.globalAlpha = 1 - st.land;
    fillPts(ctx, xformPts(st.P, T.x, T.y, T.s, 0, _B), st.col);
  }
  ctx.globalAlpha = 1;
}

// drifting background shapes for the end card
function ambient(ctx, b) {
  const a = seg(b, 24.2, 25.5);
  if (a <= 0) return;
  const r = mulberry(77);
  for (let i = 0; i < 16; i++) {
    const x0 = r() * W, y0 = r() * H, sp = 18 + r() * 30, sz = 10 + r() * 22, ph = r() * 8, col = SWARM_COLS[i % 5];
    const y = ((y0 - (b - 24) * sp) % (H + 100) + H + 100) % (H + 100) - 50;
    ctx.globalAlpha = 0.13 * a;
    fillPts(ctx, xformPts(cyclePts(ph + b * 0.6), x0 + Math.sin(b * 0.7 + i) * 30, y, sz, b * 0.3 + i), col);
  }
  ctx.globalAlpha = 1;
}

function sceneLogo(ctx, b, part) {
  if (part !== 'fg') {
    bgNavy(ctx, b, C.ink, C.navy, 900);
    glow(ctx, HERO.x, HERO.y, 700, '#3A64FF', 0.22 * seg(b, 24.2, 25) + 0.12 * kick(b, 28, 3));
    ambient(ctx, b);
    // shockwaves on the two big hits
    for (const [b0, x, y, col] of [[24, HERO.x, HERO.y, C.white], [28, MARK_F[0], MARK_F[1], C.yellow]]) {
      const q = seg(b, b0, b0 + 1.4);
      if (q <= 0 || q >= 1) continue;
      ctx.strokeStyle = rgba(col, 0.5 * (1 - q)); ctx.lineWidth = 10 * (1 - q) + 1;
      ctx.beginPath(); ctx.arc(x, y, 80 + E.outExpo(q) * 900, 0, TAU); ctx.stroke();
    }
    if (part === 'bg') return;
  }
  if (b < 25.4) drawSwarm(ctx, b);
  drawLogo(ctx, b);
  burst(ctx, b, 24.0, HERO.x, HERO.y, 22, 11, 700);
  burst(ctx, b, 28.0, MARK_F[0], MARK_F[1], 26, 12, 820);

  // end card
  const tag = pr(b, 28.0, 28.6);
  if (tag > 0) {
    ctx.save();
    ctx.globalAlpha = tag;
    label(ctx, 'ELEIÇÕES 2026', 540, 470 - 24 * (1 - tag), 34, C.yellow, 'center', 10, 700);
    ctx.fillStyle = rgba(C.yellow, 0.7);
    const lw = 120 * pr(b, 28.1, 28.8);
    ctx.fillRect(540 - 205 - lw, 458, lw, 3); ctx.fillRect(540 + 205, 458, lw, 3);
    ctx.restore();
  }
  kLine(ctx, b, { text: 'Consulte antes de votar.', x: 540, y: 1215, size: 60, weight: 700, maxW: 940, tIn: 28.05, style: 'rise', mask: true, stagger: 0.02, dur: 0.8 });
  // the button (the tap's confetti goes behind it)
  burst(ctx, b, 29.65, 700, 1370, 12, 21, 300);
  const bq = seg(b, 28.3, 28.95);
  if (bq > 0) {
    const press = bump1(b, 29.65);
    const s = E.outBack(bq, 2) * (1 - 0.05 * press) * (1 + 0.025 * kick(b, 30, 4) + 0.025 * kick(b, 31, 4));
    ctx.save();
    ctx.translate(540, 1345); ctx.scale(s, s);
    ctx.font = FONT(800, 64);
    const tw = ctx.measureText('ranking.org.br').width, w = tw + 150, h = 124;
    ctx.shadowColor = rgba(C.yellow, 0.55); ctx.shadowBlur = 50 + 30 * kick(b, 29.65, 3);
    rrect(ctx, -w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = C.yellow; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = C.text;
    ctx.fillText('ranking.org.br', -w / 2 + 60, 22);
    // arrow
    const ax = w / 2 - 62 + 8 * Math.sin(Math.max(0, b - 29) * 5.5) * seg(b, 29, 29.3);
    ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = C.text;
    ctx.beginPath(); ctx.moveTo(ax - 20, 0); ctx.lineTo(ax + 12, 0); ctx.moveTo(ax - 2, -16); ctx.lineTo(ax + 14, 0); ctx.lineTo(ax - 2, 16); ctx.stroke();
    ctx.restore();
  }
  kLine(ctx, b, { text: 'Leva só 2 minutos.', x: 540, y: 1490, size: 40, weight: 500, maxW: 900, tIn: 28.7, style: 'rise', mask: true, stagger: 0.02, dur: 0.8, color: C.mute });
  // tap
  const [px, py] = pathAt([[28.9, 1180, 1800], [29.55, 700, 1370], [29.9, 712, 1382], [30.8, 1180, 1900]], b);
  ripple(ctx, 700, 1370, b, 29.65, C.yellow, 160);
  pointer(ctx, px, py, bump1(b, 29.65), pr(b, 28.9, 29.1) * (1 - seg(b, 30.3, 30.8)));
}

// ---- 70-post.js
// ============================================================
// The lens: the 2D scene is uploaded as a texture and finished on the GPU. Real motion blur
// (several sub-frames accumulated inside the shutter), chromatic aberration that spikes on the hits,
// a bright-pass bloom, flashes, scanline glitches for the failing lamp, vignette and film grain.
// ============================================================
const GL = {};
const VS = `#version 300 es
in vec2 p; out vec2 vUv;
void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
const FS_ACC = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform float uW;
in vec2 vUv; out vec4 o;
void main() { o = vec4(texture(uTex, vUv).rgb * uW, 1.0); }`;
const FS_POST = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime, uCA, uGrain, uVig, uGlitch, uBloom, uSeed;
uniform vec4 uFlash;
in vec2 vUv; out vec4 o;
float h(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main() {
  vec2 uv = vUv;
  if (uGlitch > 0.0) {
    float band = floor(uv.y * 54.0);
    if (h(vec2(band, uSeed)) < uGlitch * 0.55) uv.x += (h(vec2(band * 1.37, uSeed + 3.1)) - 0.5) * 0.14 * uGlitch;
  }
  vec2 d = uv - 0.5;
  float ca = uCA * (0.35 + 2.2 * dot(d, d));
  vec3 col;
  col.r = texture(uTex, uv + d * ca).r;
  col.g = texture(uTex, uv).g;
  col.b = texture(uTex, uv - d * ca).b;
  // bloom from the mip chain: smooth, wide, and cheap
  vec3 bl = max(textureLod(uTex, uv, 3.0).rgb - 0.5, 0.0) * 0.5
          + max(textureLod(uTex, uv, 4.5).rgb - 0.42, 0.0) * 0.6
          + max(textureLod(uTex, uv, 6.0).rgb - 0.35, 0.0) * 0.7;
  col += bl * uBloom;
  float v = smoothstep(1.0, 0.28, length(d * vec2(1.0, 0.82)) * 1.32);
  col *= mix(1.0, v, uVig);
  col = mix(col, uFlash.rgb, uFlash.a);
  col += (h(uv * uRes + fract(uTime * 7.13)) - 0.5) * uGrain;
  o = vec4(col, 1.0);
}`;

function glInit(canvas) {

// ---- 80-audio.js
// ============================================================
// The soundtrack: an original samba-electronic cue, synthesised with WebAudio, no samples.

// the mestre's whistle calling the drop, a cuíca, brass stabs on every cut, and the sound design

const PLAY = { ctx: null, src: null, t0: 0, buf: null, muted: false, gain: null };

      glUpload(SCN);
      glAccumulate(i === 0, 1 / samples);
    }
    glPost(true, postAt(t));
  }
  STATS.ms = performance.now() - t0;
  return STATS;
}

// the poster before anyone clicks: the end card, dimmed, with a play button
function renderPoster(sec) {
  drawScene(sctx, 31);
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.fillStyle = 'rgba(4,7,22,0.62)'; sctx.fillRect(0, 0, W, H);
  const s = 1 + 0.04 * Math.sin(sec * 3);
  sctx.save();
  sctx.translate(540, 960); sctx.scale(s, s);
  sctx.fillStyle = C.yellow; sctx.beginPath(); sctx.arc(0, 0, 110, 0, TAU); sctx.fill();
  sctx.fillStyle = C.text; sctx.beginPath(); sctx.moveTo(-32, -50); sctx.lineTo(58, 0); sctx.lineTo(-32, 50); sctx.closePath(); sctx.fill();
  sctx.restore();
  label(sctx, 'Toque para assistir (com som)', 540, 1150, 40, C.white, 'center', 0, 600);
  glUpload(SCN);
  glPost(false, { time: sec, ca: 0.002, glitch: 0, flash: [0, 0, 0, 0], seed: 0, grain: 0.04, vig: 0.5, bloom: 0.4 });
}

// ---------- clock and input
const QS = new URLSearchParams(location.search);
const FIXED_T = QS.has('t') ? parseFloat(QS.get('t')) : null;
let mode = QS.has('autoplay') ? 'play' : 'poster';
let paused = false, startMs = performance.now(), errors = 0;

async function start() {
  if (mode === 'play' && PLAY.src) return;
  mode = 'play';
  cv.style.cursor = 'default';
  try { await audioStart(); } catch (e) { console.warn('audio unavailable', e); }
  startMs = performance.now();
}
cv.addEventListener('pointerdown', start);
cv.addEventListener('dblclick', () => {
  const d = document;
  if (d.fullscreenElement) d.exitFullscreen && d.exitFullscreen();
  else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
});
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') audioMute(!PLAY.muted);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); start(); }
});
function tick(now) {
  if (paused) return;
  try {
    if (!ASSETS.ready) { /* wait */ }
    else if (mode === 'poster') renderPoster((now - startMs) / 1000);
    else {
      const ta = audioTime();
      const t = ta !== null ? ta : (((now - startMs) / 1000) % DUR);
      renderFrame(t, 1);
    }
  } catch (e) { if (errors++ < 3) console.error(e); }
  requestAnimationFrame(tick);
}

// ---------- hooks (no visible UI)
window.__reel = {
  ready: () => ASSETS.ready,
  dur: () => DUR,
  render: (t, samples, dt, shutter) => renderFrame(t, samples, dt, shutter),
  pause: () => { paused = true; },
  resume: () => { if (paused) { paused = false; requestAnimationFrame(tick); } },
  audioWav: (sr, peakDb) => audioWav(sr, peakDb),
  audio: () => audioMeasure(),
  // contact sheet of piece times (seconds), drawn over the page
  sheet: (times, cols, scale) => {
    cols = cols || 4; scale = scale || 0.25;
    const w = Math.round(W * scale), h = Math.round(H * scale), rows = Math.ceil(times.length / cols);
    let c = document.getElementById('__sheet');
    if (!c) { c = document.createElement('canvas'); c.id = '__sheet'; c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#111;z-index:9'; document.body.appendChild(c); }
    c.width = w * cols; c.height = h * rows;
    const x = c.getContext('2d');
    x.font = `${Math.round(w * 0.07)}px sans-serif`;
    times.forEach((t, i) => {
      renderFrame(t, 1);
      x.drawImage(cv, (i % cols) * w, Math.floor(i / cols) * h, w, h);
      x.fillStyle = '#ff0'; x.fillText(`t=${t.toFixed(2)} sb=${storyBeat(t / BEAT).toFixed(2)}`, (i % cols) * w + 6, Math.floor(i / cols) * h + w * 0.09);
    });
    return c.toDataURL('image/png');
  },
};

glInit(cv);
loadAssets().then(() => {
  if (FIXED_T !== null && isFinite(FIXED_T)) { mode = 'fixed'; renderFrame(FIXED_T, 1); }
  else requestAnimationFrame(tick);
}).catch(e => console.error(e));

</script>
</body>
